  defLevel({ id: '5-4', fl: 5, name: 'Личный сейф', target: 1, kits: ['base', 'gym', 'pick', 'whistle'], par: [4, 227],

  defLevel({ id: '6-1', fl: 6, name: 'Приёмная', target: 2, kits: ['base', 'gym', 'pick', 'whistle'], par: [4, 187],

defLevel({ id: '6-2', fl: 6, name: 'Тринадцатая секунда', target: 1, kits: ['base', 'gym', 'pick', 'whistle'], par: [4, 172], fin: 1,

  var LV = {};
  for (var li = 0; li < LEVELS.length; li++) LV[LEVELS[li].id] = parseLevel(LEVELS[li]);

  function parseLevel(L) {
    var H = L.map.length, W = 0, i, x, y;
    for (i = 0; i < H; i++) if (L.map[i].length > W) W = L.map[i].length;
    var o = { id: L.id, W: W, H: H, t: [], plates: [], doors: [], keys: [], vaults: [], locks: [], items: [],
      starts: [], exits: [], notes: [], levers: [], lasers: [], cams: [], guards: [], groups: {},
      grates: [], creaks: [], sch: [], trg: [] };
    for (y = 0; y < H; y++) for (x = 0; x < W; x++) {
      var c = L.map[y].charAt(x) || ' ';
      var base = '.';
      if (c === '#' || c === ' ') base = c;
      else if (c >= 'a' && c <= 'f' && c !== 'k') {
        var w = (L.w && L.w[x + ',' + y]) || 1;
        o.plates.push({ x: x, y: y, g: c, w: w }); o.groups[c] = 1;
      } else if (c >= 'A' && c <= 'D') { o.doors.push({ x: x, y: y, g: c.toLowerCase(), inv: L.inv && L.inv.indexOf(c) >= 0 ? 1 : 0 }); base = 'D'; }
      else if (c === 'k') o.keys.push({ x: x, y: y });
      else if (c === 'V') { o.vaults.push({ x: x, y: y }); base = 'V'; }
      else if (c === 'L') { o.locks.push({ x: x, y: y }); base = 'L'; }
      else if (c === 'Z') { o.grates.push({ x: x, y: y }); base = 'Z'; }
      else if (c === 'T') base = 'T';
      else if (c === '~') o.creaks.push({ x: x, y: y });
      else if (c === '$') o.items.push({ x: x, y: y, h: 0 });
      else if (c === 'H') o.items.push({ x: x, y: y, h: 1 });
      else if (c === 'S') o.starts.push({ x: x, y: y });
      else if (c === 'E') o.exits.push({ x: x, y: y });
      else if (c === 'n') o.notes.push({ x: x, y: y });
      else if (c === '/') { var g = (L.lev && L.lev[x + ',' + y]) || 'a'; o.levers.push({ x: x, y: y, g: g }); o.groups[g] = 1; }
      o.t.push(base);
    }
    var k;
    for (k = 0; k < (L.las || []).length; k++) { var ls = L.las[k]; o.lasers.push({ x: ls.x, y: ls.y, d: ls.d, g: ls.g || '', on: ls.on || 0, off: ls.off || 0, ph: ls.ph || 0 }); }
    for (k = 0; k < (L.cams || []).length; k++) { var cm = L.cams[k]; o.cams.push({ x: cm.x, y: cm.y, d: cm.d, per: cm.per, g: cm.g || '' }); }
    for (k = 0; k < (L.guards || []).length; k++) {
      var gd = L.guards[k], p = gd.p, full = [];
      // разворачиваем ломаную в список клеток маршрута (замкнутый обход)
      for (i = 0; i < p.length; i++) {
        var a = p[i], b = p[(i + 1) % p.length], cx = a[0], cy = a[1];
        if (i === 0) full.push([cx, cy]);
        while (cx !== b[0] || cy !== b[1]) {
          cx += cx < b[0] ? 1 : cx > b[0] ? -1 : 0;
          if (cx === b[0]) cy += cy < b[1] ? 1 : cy > b[1] ? -1 : 0;
          full.push([cx, cy]);
        }
      }
      if (full.length > 1) full.pop(); // последняя точка совпадает с первой
      o.guards.push({ route: full, o: gd.o || 0, f: gd.f || 0, sp: gd.sp || 0, ear: gd.ear || 0, zz: gd.zz || 0,
        call: gd.call || null, cf: gd.cf || 0, lk: gd.lk || LOOK_N });
    }

    } else if (!G.watch && save.set.coach !== 0) {
      if (G.stuck && st.phase === "run") {
        text = tx(STUCK[G.stuck]);
        uiSel = ".retry";
      } else if (!save.seen["w-" + G.lvId] && !G.daily && STEPS[G.lvId] && st.phase !== "win") {
        const C = coachCtx(st, lv);
        for (const r of STEPS[G.lvId]) if (r.when(C)) {
          text = tx(r.dyn ? r.dyn(C) : r.x);
          hl = r.hl ? r.hl(lv) : null;
          uiSel = r.ui;
          break;
        }
      }
    }
    G.coachHl = hl;
    let low = false;
    if (text && !portrait) {
      const me = st.W && st.phase === "run" ? st.W.b.find((b) => b.ci < 0 && b.o === G.me) : null;
      const pts = (hl || []).concat([me ? [me.x, me.y] : [lv.starts[0].x, lv.starts[0].y]]);
      low = pts.reduce((a, p) => a + p[1], 0) / pts.length < lv.H * 0.45;
    }
    const key = text + "|" + VW + "x" + VH + "|" + (R.box ? R.box.y : 0) + "|" + low;
    if (key !== G.coachKey) {
      G.coachKey = key;
      G.coachLow = low;
      placeCoach();
      const W2 = parseInt(coachEl.style.width, 10) || 400;
      coachEl.innerHTML = text ? vp(text, W2 - 24, portrait ? 13 : 14, "y", 1.6) : "";
      coachEl.className = text ? "fr on" : "";
      placeCoach();
      document.body.dataset.coach = text ? low ? "low" : "high" : "";
    }
    for (const e of document.querySelectorAll(".cpulse")) if (!uiSel || !e.matches(uiSel)) e.classList.remove("cpulse");
    if (uiSel) {
      const e = document.querySelector(uiSel);
      if (e && !e.classList.contains("cpulse")) e.classList.add("cpulse");
    }
  }
  var hudMem = "";
  function updateHud(st, t2) {
    const Lp = L.loopLen(st), lv = L.level(st);
    const left = Math.max(0, Lp - t2), segOn = Math.ceil(left / Lp * 12);
    const dep = st.W && st.phase !== "plan" ? st.W.dep : 0;
    const key = segOn + "|" + Math.ceil(left / 2) + "|" + dep + "|" + st.copies.length + "|" + st.phase;
    if (key === hudMem) return;
    hudMem = key;
    const segs = hud.querySelectorAll(".seg");
    segs.forEach((s, i) => {
      s.classList.toggle("on", i < segOn);
      s.classList.toggle("warn", left <= 60 && i < segOn);
    });
    const dl = hud.querySelector(".dial");
    if (dl) dl.classList.toggle("warn", left <= 60 && st.phase === "run");
    const r = portrait ? 35 : 42, g = hud.querySelector(".dnum");
    if (g) g.innerHTML = dialNumPath((left / 20).toFixed(1).replace(".", ","), r, Math.floor(2 * (r - 6) * 0.6 / (measure("12,0", 1) || 3)));
    const loot = $("#loot");
    if (loot) {
      loot.innerHTML = vt("₽ " + dep + " / " + lv.target, portrait ? 15 : 18, dep >= lv.target ? "g" : "g dimg");
      if (G.lootBump) {
        G.lootBump = 0;
        loot.classList.remove("bump");
        void loot.offsetWidth;
        loot.classList.add("bump");
      }
    }
    const rec = $("#rec");
    if (rec) rec.classList.toggle("on", st.phase === "run");
    const cc = $("#ccount");
    if (cc) cc.innerHTML = vt(tf("hudCopies", (n) => "копий " + n, st.copies.length), portrait ? 12 : 14, "c");
  }
  function frameState(st, frac, T) {
    const lv = L.level(st);
    const liveOpts = {}, hats = {};
    const markers = G.mode === "local2" ? { p1: "1", p2: "2" } : {};
    st.order.forEach((id, i) => {
      liveOpts[id] = { marker: markers[id] || (id === G.me ? t("ТЫ") : String(i + 1)), hat: id === G.me || G.mode === "local2" ? save.hat : G.peerHat && G.peerHat[id] || "" };
      hats[id] = liveOpts[id].hat;
    });
    let S2, w, tk;
    if (G.watch) {
      const Wt = G.watch;
      w = JSON.parse(Wt.snaps[Math.min(Wt.snaps.length - 1, Math.floor(Wt.t))]);
      tk = Math.floor(Wt.t);
      S2 = renderState(Wt.st, w, tk, { frac: Wt.playing ? Wt.t % 1 : 0, time: T, hats: {} });
      S2.paths = ghostPaths(Wt.st, Wt.snaps);
    } else if (st.phase === "run" || st.phase === "win") {
      w = st.W;
      tk = st.t;
      S2 = renderState(st, w, tk, { frac: st.phase === "run" ? frac : 1, time: T, live: liveOpts, hats });
    } else {
      const key = st.lv + "|" + st.ver + "|" + st.copies.length + "|" + st.loops;
      if (key !== G.snapKey) {
        G.snapKey = key;
        G.snaps = ghostRun(st);
        G.paths = ghostPaths(st, G.snaps);
        G.previewT = 0;
      }
      const pt = st.phase === "count" ? 0 : Math.min(G.snaps.length - 1, Math.floor(G.previewT));
      w = JSON.parse(G.snaps[pt]);
      tk = pt;
      const full = L.newWorld(lv, st);
      for (const b of full.b) if (b.ci < 0) w.b.push(b);
      S2 = renderState(st, w, tk, { frac: G.previewPlay && st.phase === "plan" ? G.previewT % 1 : 0, time: T, live: liveOpts, hats });
      S2.paths = G.paths;
      S2.plan = 1;
      S2.bodies.forEach((b) => {
        if (!b.live) b.bright *= 0.85;
      });
    }
    for (const b of S2.bodies) {
      const k = "b" + b.idx, tr = G.trails[k] || (G.trails[k] = []);
      const last = tr[tr.length - 1];
      if (!last || Math.abs(last[0] - b.rx) + Math.abs(last[1] - b.ry) > 0.04) {
        tr.push([b.rx, b.ry, T]);
        if (tr.length > 40) tr.shift();
      }
      b.trail = tr;
    }
    S2.guards.forEach((gd, i) => {
      const k = "g" + i, tr = G.trails[k] || (G.trails[k] = []);
      const last = tr[tr.length - 1];
      if (!last || Math.abs(last[0] - gd.rx) + Math.abs(last[1] - gd.ry) > 0.04) {
        tr.push([gd.rx, gd.ry, T]);
        if (tr.length > 40) tr.shift();
      }
      gd.trail = tr;
    });
    G.doorA = G.doorA && G.doorA.length === lv.doors.length ? G.doorA : lv.doors.map(() => 0);
    S2.doorAnim = G.doorA = G.doorA.map((v, i) => v + ((S2.doors[i] ? 1 : 0) - v) * 0.25);
    G.vaultA = (G.vaultA || 0) + ((S2.vault ? 1 : 0) - (G.vaultA || 0)) * 0.12;
    S2.vaultAnim = G.vaultA;
    S2.bursts = (G.bursts || []).filter((b) => T - b.t0 < 900);
    G.bursts = S2.bursts;
    S2.spawn = G.runAt ? Math.min(1, (T - G.runAt) / 450) : 1;
    S2.pops = G.pops;
    S2.fx = { shake: G.fx.shake, flash: G.fx.flash, flashColor: G.fx.flashColor, alarmAt: S2.fxAlarm };
    S2.bloom = 0.55;
    S2.rewind = G.fx.rewind || 0;
    S2.coach = G.coachHl;
    return { S: S2, t: tk };
  }
  var lastT = performance.now();
  function frame(now) {
    const dt = Math.max(0, Math.min(0.1, (now - lastT) / 1e3));
    lastT = now;
    G.time += dt;
    const T = now;
    G.fx.shake *= 0.85;
    if (G.fx.shake < 0.3) G.fx.shake = 0;
    G.fx.flash *= 0.88;
    if (G.fx.flash < 0.01) G.fx.flash = 0;
    G.fx.rewind = Math.max(0, (G.fx.rewind || 0) - dt * 1.6);
    G.pops.forEach((p) => p.age += dt / 1.4);
    G.pops = G.pops.filter((p) => p.age < 1);
    if (G.mode === "client" && G.room) clientPoll();
    if (G.scr === "game") {
      if (G.watch) {
        if (G.watch.playing) {
          G.watch.t += dt * 20;
          if (G.watch.t >= G.watch.snaps.length - 1) G.watch.t = 0;
        }
      } else if (!G.pause && !G.cardPause) simStep(dt);
      const st = curSt();
      if (st) {
        phaseWatch();
        if (st.phase === "plan" && G.previewPlay && G.snaps) {
          G.previewT += dt * 20;
          if (G.previewT >= G.snaps.length - 1 + 20) G.previewT = 0;
        }
        const frac = G.mode === "client" ? Math.min(1, (now - G.snapAt) / 50) : Math.min(1, G.acc / 0.05);
        const { S: S2, t: t2 } = frameState(st, frac, T);
        followCam(st, S2, dt);
        R.draw(S2);
        autoQuality(dt);
        updateHud(G.watch ? G.watch.st : st, G.watch ? G.watch.t : st.phase === "run" || st.phase === "win" ? st.t : G.previewT);
        renderPanels(st);
        coachTick(st);
        musicTick(st.phase === "run" ? st.t : null, st.phase === "run" ? st.t / L.loopLen(st) : 0, dt);
      }
    } else {
      if (G.attract) {
        const A = G.attract;
        A.t += dt * 20;
        if (A.t >= A.snaps.length - 1 + 30) A.t = 0;
        const ti = Math.min(A.snaps.length - 1, Math.floor(A.t)), w = JSON.parse(A.snaps[ti]);
        const S2 = renderState(A.st, w, ti, { frac: A.t % 1, time: T });
        S2.bodies.forEach((b) => {
          b.bright *= 0.8;
        });
        for (const b of S2.bodies) {
          const k = "a" + b.idx, tr = G.trails[k] || (G.trails[k] = []);
          tr.push([b.rx, b.ry, T]);
          if (tr.length > 40) tr.shift();
          b.trail = tr;
        }
        S2.bloom = 0.5;
        S2.doorAnim = S2.doors.map((d) => d ? 1 : 0);
        R.draw(S2);
      } else if (G.dlgScene) {
        const D = G.dlgScene, S2 = renderState(D.st, D.w, 0, { time: T });
        S2.bodies = [];
        S2.cones = [];
        S2.bloom = 0.3;
        R.draw(S2);
        const g = R.g;
        g.setTransform(1, 0, 0, 1, 0, 0);
        g.fillStyle = "rgba(0,0,0,0.62)";
        g.fillRect(0, 0, cv.width, cv.height);
      } else {
        const g = R.g;
        g.setTransform(1, 0, 0, 1, 0, 0);
        g.fillStyle = "#000";
        g.fillRect(0, 0, cv.width, cv.height);
      }
      if (G.portrait && portR) portR.portrait(G.portrait, T);
      musicTick(null, 0, dt);
      if (G.mode === "host" && G.sess) {
        hostReadGuests();
        if ((G.pubN = (G.pubN || 0) + 1) % 3 === 0) hostPublish();
      }
    }
    window.__ready = true;
    __frames++;
    requestAnimationFrame(frame);
  }
  var perf = { n: 0, sum: 0 };
  function autoQuality(dt) {
    if (R.low || perf.off || Q.has("shot") || document.hidden || dt <= 0) return;
    perf.n++;
    perf.sum += dt;
    if (perf.n < 90) return;
    const avg = perf.sum / perf.n;
    perf.n = 0;
    perf.sum = 0;
    if (avg > 0.045) {
      R.low = true;
      layout();
      toast(t("Графика переключена в экономный режим. Вернуть — в настройках."), PAL.ui);
    }
  }
  function followCam(st, S2, dt) {
    const mine = (S2.bodies || []).filter((b) => b.live && b.marker);
    const want = portrait && !G.watch && mine.length === 1 && (st.phase === "run" || st.phase === "count") ? Math.min(2, Math.max(1, 50 / R.baseTile)) : 1;
    const z = G.zoom || (G.zoom = { Z: 1, x: 0, y: 0 });
    const k = 1 - Math.exp(-dt * 5);
    z.Z += (want - z.Z) * k;
    if (mine.length === 1) {
      if (z.Z < 1.01) {
        z.x = mine[0].rx;
        z.y = mine[0].ry;
      } else {
        z.x += (mine[0].rx - z.x) * Math.min(1, k * 1.6);
        z.y += (mine[0].ry - z.y) * Math.min(1, k * 1.6);
      }
    }
    R.setView(z.Z, z.x, z.y);
  }
  var hiddenLast = 0;
  setInterval(() => {
    if (!document.hidden || G.mode !== "host" || !G.sess) return;
    const now = performance.now(), dt = hiddenLast ? Math.min(0.1, (now - hiddenLast) / 1e3) : 0.05;
    hiddenLast = now;
    if (G.scr === "game") {
      simStep(dt);
      phaseWatch();
    } else {
      hostReadGuests();
      hostPublish();
    }
  }, 50);
  document.addEventListener("visibilitychange", () => {
    hiddenLast = 0;
  });
  async function boot() {
    layout();
    setVolumes(save.set.sfx, save.set.mus);
    addEventListener("pointerdown", () => initAudio(), { once: true });
    const shot = Q.get("shot");
    if (shot) return shotScene(shot);
    titleScreen();
    requestAnimationFrame(frame);
    if (await cloud.init()) {
      const remote = await cloud.loadSave();
      if (remote) {
        save = merge(save, remote);
        saveLocal(save);
        if (G.scr === "title") titleScreen();
      }
    }
  }
  function shotScene(kind) {
    const id = Q.get("lv") || "3-4";
    save = blankSave();
    for (const d of L.LEVELS) save.stars[d.id] = d.fl < 6 ? [1, 1, 0] : [0, 0, 0];
    save.introDone = 1;
    for (let f = 1; f <= 6; f++) save.seen["f" + f] = 1;
    save.hat = Q.get("hat") || "";
    G.noSave = 1;
    if (kind === "title") titleScreen();
    else if (kind === "tower") towerScreen();
    else if (kind === "dialog") playDialog([ORDERS3[Q.get("f") || 1][+Q.get("i") || 0]], () => {
    }, Q.get("lv") || "1-1");
    else {
      startLevel(id);
      const st = G.sess.st, demo = DEMOS[id];
      const nc = kind === "plan" ? Math.max(0, demo.length - 1) : demo.length - 1;
      st.copies = demo.slice(0, nc).map(([k, r], i) => ({ o: "p1", col: 0, k, rec: unrle(r, LOOP), tr: "", n: i + 1, f: 0 }));
      st.loops = nc;
      st.ver++;
      if (kind === "run" || kind === "results") {
        const last = demo[demo.length - 1], rec = unrle(last[1], LOOP), T = +(Q.get("t") || 90);
        st.P.p1.kit = last[0];
        st.phase = "run";
        st.t = 0;
        st.loops++;
        st.W = L.newWorld(L.level(st), st);
        for (let i = 0; i < T && st.phase === "run"; i++) {
          st.P.p1.d = rec.charCodeAt(i) - 48;
          if (st.P.p1.d >= 5) {
            st.P.p1.tap = 1;
            st.P.p1.d -= 5;
          }
          logic.update(st, { noff: 1 });
        }
        G.lastPhase = st.phase;
        G.hold = 1e9;
        layout();
        if (kind === "results") {
          G.results = { id, copies: st.copies.length + 1, ticks: 150, loops: st.loops, res: { stars: [1, 1, 0], newStars: [0, 1, 0], rec: false } };
          resultsScreen();
        }
      } else {
        G.previewT = +(Q.get("t") || 60);
        G.previewPlay = false;
      }
    }
    requestAnimationFrame(frame);
  }
  boot();
})();

</script>
