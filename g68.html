<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Notebook Armada</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#d9c9a3}
  canvas{display:block;position:fixed;inset:0;margin:auto;touch-action:none;cursor:crosshair}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* ============ setup & utils ============ */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const TAU=Math.PI*2,PI=Math.PI,H=720;let W=1280,SC=1,DPR=1,now=0,BOIL=0;
const INK='#17141a',PEN='#2447a6',PEN2='#3d6bd1',RED='#d23b2a',GRN='#2f8f4e',ORG='#e8872b',PINK='#ef9aa6',YEL='#e9c23c',PAPER='#f3e6c4',PAPER_HI='#faf1d8',GREY='#6d655c';
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,ease=(v,t,k,dt)=>v+(t-v)*(1-Math.exp(-dt*k));
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
function hash(s){let h=7;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h}

/* ============ ink: wobbly boiling pen lines ============ */
let jr=rng(1),JIT=1.1,FLIP=false;
function seed(id){jr=rng((id*7919+BOIL*104729)|0)}
const j=()=>(jr()-.5)*2*JIT;
function trace(P,closed,sharp){ctx.beginPath();const n=P.length;
  if(sharp){ctx.moveTo(P[0][0],P[0][1]);for(let i=1;i<n;i++)ctx.lineTo(P[i][0],P[i][1]);if(closed)ctx.closePath();return}
  if(closed){const l=P[n-1];ctx.moveTo((l[0]+P[0][0])/2,(l[1]+P[0][1])/2);for(let i=0;i<n;i++){const q=P[(i+1)%n];ctx.quadraticCurveTo(P[i][0],P[i][1],(P[i][0]+q[0])/2,(P[i][1]+q[1])/2)}ctx.closePath();return}
  ctx.moveTo(P[0][0],P[0][1]);for(let i=1;i<n-1;i++)ctx.quadraticCurveTo(P[i][0],P[i][1],(P[i][0]+P[i+1][0])/2,(P[i][1]+P[i+1][1])/2);ctx.lineTo(P[n-1][0],P[n-1][1])}
function ink(pts,o){o=o||{};const P=pts.map(p=>[p[0]+j(),p[1]+j()]);if(o.closed)P.push([P[0][0]+j(),P[0][1]+j()],[P[1][0]+j()*2,P[1][1]+j()*2]);
  trace(P,false,o.sharp);ctx.strokeStyle=o.color||INK;ctx.lineWidth=o.lw||2;ctx.globalAlpha=o.a==null?.95:o.a;ctx.stroke();
  if(o.twice){trace(pts.map(p=>[p[0]+j()*1.8,p[1]+j()*1.8]),false,o.sharp);ctx.globalAlpha*=.45;ctx.lineWidth=(o.lw||2)*.55;ctx.stroke()}ctx.globalAlpha=1}
function fill(pts,color,a,sharp){trace(pts,true,sharp);ctx.fillStyle=color;ctx.globalAlpha=a==null?1:a;ctx.fill();ctx.globalAlpha=1}
function blob(x,y,r,color,a){ctx.beginPath();ctx.ellipse(x+j()*.3,y+j()*.3,r*(1+j()*.05),r*(1+j()*.05),0,0,TAU);ctx.fillStyle=color||INK;ctx.globalAlpha=a==null?1:a;ctx.fill();ctx.globalAlpha=1}
function hatch(pts,o){o=o||{};let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const p of pts){x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1])}
  const cx=(x0+x1)/2,cy=(y0+y1)/2,R=Math.hypot(x1-x0,y1-y0)/2+2,an=o.angle==null?-.9:o.angle,ca=Math.cos(an),sa=Math.sin(an),gap=o.gap||4;
  ctx.save();trace(pts,true,o.sharp);ctx.clip();ctx.beginPath();
  for(let d=-R;d<R;d+=gap){const dd=d+j()*.8,w=j()*2,k=o.zig?(jr()*.5+.5):1;ctx.moveTo(cx-ca*R-sa*dd,cy-sa*R+ca*dd+w);ctx.lineTo(cx+ca*R*k-sa*(dd+(o.zig?gap:0)),cy+sa*R*k+ca*(dd+(o.zig?gap:0))-w)}
  ctx.strokeStyle=o.color||INK;ctx.lineWidth=o.lw||1.2;ctx.globalAlpha=o.a==null?.85:o.a;ctx.stroke();ctx.restore();ctx.globalAlpha=1}
function ell(cx,cy,rx,ry,n,a0,a1,rot){n=n||10;a0=a0||0;a1=a1==null?TAU:a1;const P=[],full=Math.abs(a1-a0-TAU)<1e-6,c=Math.cos(rot||0),s=Math.sin(rot||0);
  for(let i=0;i<(full?n:n+1);i++){const a=a0+(a1-a0)*i/n,x=Math.cos(a)*rx,y=Math.sin(a)*ry;P.push([cx+x*c-y*s,cy+x*s+y*c])}return P}
const line=(x1,y1,x2,y2,b)=>[[x1,y1],[(x1+x2)/2+(b||0)*(y2-y1)*.1,(y1+y2)/2-(b||0)*(x2-x1)*.1],[x2,y2]];
function scribble(x,y,rx,ry,n,o){const P=[];for(let i=0;i<n;i++){const a=jr()*TAU,r=.35+jr()*.65;P.push([x+Math.cos(a)*rx*r,y+Math.sin(a)*ry*r])}ink(P,o)}

/* ============ hand lettering: a stroke font, every letter a little wrong ============ */
const G={};{const D={A:"062046 1333",B:"0006 0030413203 033344453606",C:"4130100105163645",D:"0006 003041453606",E:"40000646 0333",F:"400006 0333",G:"41301001051636454323",H:"0006 4046 0343",I:"1030 2026 1636",J:"1040 3035261605",K:"0006 400346",L:"000646",M:"0600234046",N:"06004640",O:"103041453616050110",P:"060030413203",Q:"103041453616050110 2446",R:"060030413203 1346",S:"413010010213334445361605",T:"0040 2026",U:"000516364540",V:"002640",W:"0016233640",X:"0046 4006",Y:"002340 2326",Z:"00400646",
  0:"103041453616050110",1:"112026 1636",2:"01103041420646",3:"011030413222 324345361605",4:"300444 3036",5:"400003334445361605",6:"4130100105163645443303",7:"004016",8:"2301103041230516364523",9:"43130201103041453616",
  "!":"2024 2526","?":"01103041322324 2526",".":"2526 2625",",":"2617","-":"1333","+":"1333 2125",":":"2122 2425","'":"2022","/":"4006","(":"30111536",")":"10313516","=":"1232 1434","#":"1016 3036 0242 0444","$":"260301102130414326","*":"204602420620","^":"031540",">":"0343 214325","<":"4303 230325","%":"4006 0011 3546","_":"0646","~":"03122334"};
  for(const k in D)G[k]=D[k].split(' ').map(s=>{const P=[];for(let i=0;i<s.length;i+=2)P.push([+s[i],+s[i+1]]);return P})}
const chW=(ch,size)=>ch==' '?size*.45:(4*size/6)*(ch!=ch.toUpperCase()?.74:1)*(ch=='I'||ch=='i'||ch=='!'||ch=="'"||ch=='.'||ch==','||ch==':'||ch=='1'?.7:1)+size*.2;
function txtW(s,size){let w=0;for(const ch of s)w+=chW(ch,size);return w}
function txt(s,x,y,size,o){o=o||{};s=String(s);const r=rng(hash(s)*13+(o.still?0:Math.floor(now*(o.fps||4)))*977+(o.seed||0)),m=o.mess==null?1:o.mess,al=o.align||'l';
  const w=txtW(s,size),n=o.rev==null?1e9:Math.floor(o.rev*s.length);
  ctx.save();ctx.translate(x,y);if(FLIP)ctx.scale(-1,1);if(o.rot)ctx.rotate(o.rot);ctx.strokeStyle=o.color||INK;ctx.lineWidth=o.lw||Math.max(1.3,size*.085);ctx.globalAlpha=o.a==null?.95:o.a;ctx.lineCap='round';ctx.lineJoin='round';
  let cx=al=='c'?-w/2:al=='r'?-w:0,i=0;
  for(const ch of s){if(i++>=n)break;const g=G[ch.toUpperCase()],cw=chW(ch,size);if(g){const low=ch!=ch.toUpperCase(),u=size/6*(low?.74:1)*(1+(r()-.5)*.2*m),rot=(r()-.5)*.2*m,by=(r()-.5)*size*.14*m,narrow=cw<size*.75&&ch!=' '?-size*.1:0;
      ctx.save();ctx.translate(cx+narrow,by);ctx.rotate(rot);ctx.beginPath();for(const st of g){for(let k=0;k<st.length;k++){const X=st[k][0]*u+(r()-.5)*u*.55*m,Y=(st[k][1]-6)*u+(r()-.5)*u*.55*m;k?ctx.lineTo(X,Y):ctx.moveTo(X,Y)}}
      ctx.stroke();if(o.bold){ctx.translate(size*.04,size*.03);ctx.stroke()}ctx.restore()}cx+=cw}
  if(o.under){ctx.beginPath();const x0=al=='c'?-w/2:al=='r'?-w:0;ctx.moveTo(x0-4,size*.22+r()*3);ctx.quadraticCurveTo(x0+w/2,size*.3+r()*6,x0+w+6,size*.18+r()*3);if(o.under>1){ctx.moveTo(x0+w+2,size*.4);ctx.lineTo(x0+2,size*.42+r()*4)}ctx.stroke()}
  if(o.strike){ctx.beginPath();const x0=al=='c'?-w/2:al=='r'?-w:0;ctx.moveTo(x0-3,-size*.45+r()*4);ctx.lineTo(x0+w+4,-size*.5+r()*6);ctx.moveTo(x0-2,-size*.3+r()*4);ctx.lineTo(x0+w+2,-size*.38+r()*4);ctx.stroke()}
  ctx.restore();ctx.globalAlpha=1;return w}

/* ============ paper ============ */
let paper=null;
function makePaper(){const p=document.createElement('canvas');p.width=Math.ceil(W*SC*DPR);p.height=Math.ceil(H*SC*DPR);const g=p.getContext('2d');g.scale(SC*DPR,SC*DPR);const r=rng(23);
  g.fillStyle=PAPER;g.fillRect(0,0,W,H);
  for(let i=0;i<46;i++){const x=r()*W,y=r()*H,R=80+r()*280,gr=g.createRadialGradient(x,y,0,x,y,R),c=r()<.55?'176,132,70':'255,250,230';gr.addColorStop(0,`rgba(${c},${.05+r()*.06})`);gr.addColorStop(1,`rgba(${c},0)`);g.fillStyle=gr;g.fillRect(x-R,y-R,R*2,R*2)}
  // ruled lines (blue, slightly uneven print) and the red margin
  for(let y=84;y<H-10;y+=33){g.strokeStyle=`rgba(90,140,200,${.2+r()*.1})`;g.lineWidth=1;g.beginPath();g.moveTo(0,y+r());g.lineTo(W,y+r()*1.5);g.stroke()}
  g.strokeStyle='rgba(215,80,70,.38)';g.lineWidth=1.4;g.beginPath();g.moveTo(92,0);g.lineTo(93,H);g.stroke();g.strokeStyle='rgba(215,80,70,.2)';g.beginPath();g.moveTo(96,0);g.lineTo(96.5,H);g.stroke();
  // fibres, specks, smudges
  for(let i=0;i<W*H/1100;i++){const x=r()*W,y=r()*H,a=r()*TAU,l=2+r()*7;g.strokeStyle=r()<.6?`rgba(110,80,40,${.04+r()*.07})`:`rgba(255,255,255,${.14+r()*.2})`;g.lineWidth=.5+r()*.6;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke()}
  for(let i=0;i<9;i++){const x=r()*W,y=r()*H;g.save();g.translate(x,y);g.rotate(r()*PI);const gr=g.createRadialGradient(0,0,0,0,0,60);gr.addColorStop(0,'rgba(60,60,80,.06)');gr.addColorStop(1,'rgba(60,60,80,0)');g.fillStyle=gr;g.scale(2.4,.6);g.fillRect(-60,-60,120,120);g.restore()}
  // punched holes
  for(const y of[H*.16,H*.5,H*.84]){g.fillStyle='rgba(70,45,15,.28)';g.beginPath();g.arc(41,y+2,13,0,TAU);g.fill();g.fillStyle='#d9c9a3';g.beginPath();g.arc(40,y,12,0,TAU);g.fill();g.strokeStyle='rgba(90,60,20,.3)';g.lineWidth=1;g.stroke()}
  // worn edges + coffee ring + a fold
  let v=g.createRadialGradient(W/2,H/2,H*.4,W/2,H/2,Math.hypot(W,H)*.6);v.addColorStop(0,'rgba(120,80,30,0)');v.addColorStop(1,'rgba(120,80,30,.26)');g.fillStyle=v;g.fillRect(0,0,W,H);
  const cx=W*.62,cy=H*.9,cr=52;g.strokeStyle='rgba(140,90,40,.13)';for(let k=0;k<3;k++){g.lineWidth=1+r()*3.5;g.beginPath();g.ellipse(cx+r()*2,cy+r()*2,cr+k,cr*.96+k,r(),r()*1.3,TAU-r())  ;g.stroke()}
  v=g.createLinearGradient(W*.5-14,0,W*.5+14,0);v.addColorStop(0,'rgba(90,60,20,0)');v.addColorStop(.5,'rgba(90,60,20,.07)');v.addColorStop(.56,'rgba(255,250,230,.25)');v.addColorStop(1,'rgba(90,60,20,0)');g.fillStyle=v;g.fillRect(W*.5-14,0,28,H);
  // dog-ear
  g.fillStyle='#d9c9a3';g.beginPath();g.moveTo(W-46,0);g.lineTo(W,0);g.lineTo(W,46);g.closePath();g.fill();g.fillStyle='#e6d6ae';g.beginPath();g.moveTo(W-46,0);g.lineTo(W-46,46);g.lineTo(W,46);g.closePath();g.fill();g.strokeStyle='rgba(90,60,20,.35)';g.stroke();
  paper=p}

/* ============ the sea (blue ballpoint) ============ */
const SEAY=486;let ROUGH=1,storm=0;
function sea(x){return SEAY+ROUGH*(Math.sin(x*.011+now*1.3)*9+Math.sin(x*.023-now*1.9)*5+Math.sin(x*.0047+now*.6)*8)}
function waveLine(y0,amp,k,sp,step){const P=[];for(let x=-20;x<=W+20;x+=step)P.push([x,y0+Math.sin(x*k+now*sp)*amp+Math.sin(x*k*2.3-now*sp*1.4)*amp*.4]);return P}
function drawSeaBack(){JIT=1;seed(11);
  // far away: an island with the treasure, and something that is definitely not a monster
  const ix=W*.52,iy=SEAY-30;ink([[ix-46,iy],[ix-20,iy-16],[ix+14,iy-19],[ix+44,iy]],{lw:1.4,color:GREY,a:.6});ink([[ix+4,iy-18],[ix+8,iy-40],[ix+6,iy-52]],{lw:1.3,color:GREY,a:.6});
  for(let i=0;i<4;i++)ink([[ix+6,iy-52],[ix+6+Math.cos(i*1.4-2.6)*14,iy-56+Math.sin(i*1.4-2.6)*7],[ix+6+Math.cos(i*1.4-2.6)*22,iy-46+Math.sin(i*1.4-2.6)*9]],{lw:1.2,color:GRN,a:.6});
  txt('x',ix-18,iy-8,10,{color:RED,a:.7,still:true});
  const nk=(now*.05)%1;if(nk<.35){const u=Math.sin(nk/.35*PI),nx=W*.3+nk*160,ny=SEAY-22+(1-u)*34;for(let i=0;i<3;i++)ink(ell(nx-i*34,ny+8,15,15*u,6,PI,TAU),{lw:1.5,color:GREY,a:.55});
    ink([[nx+18,ny+8],[nx+24,ny-18*u],[nx+30,ny-26*u],[nx+42,ny-22*u],[nx+36,ny-16*u]],{lw:1.5,color:GREY,a:.55});blob(nx+33,ny-22*u,1.2,GREY,.6)}
  ink(waveLine(SEAY-27,4,.02,.7,40),{lw:1.2,color:PEN2,a:.45});ink(waveLine(SEAY-15,5,.017,-.9,36),{lw:1.5,color:PEN2,a:.6})}
function drawSeaFront(){JIT=1.2;seed(12);const top=[];for(let x=-24;x<=W+24;x+=24)top.push([x,sea(x)]);
  const body=top.slice(),r=rng(5);for(let x=W+24;x>=-24;x-=60)body.push([x,H-78+r()*16+Math.sin(x*.05)*5]);
  fill(body,PAPER,.8);hatch(body,{color:PEN,angle:-.45,gap:7,a:.3,lw:1.1});hatch(body,{color:PEN2,angle:.2,gap:13,a:.28,lw:1});
  // shadow scribble right under the surface
  const sh=top.map(p=>[p[0],p[1]+2]).concat(top.slice().reverse().map(p=>[p[0],p[1]+17+Math.sin(p[0]*.07)*5]));hatch(sh,{color:PEN,angle:1.1,gap:4.5,a:.5,lw:1.2});
  ctx.beginPath();ctx.strokeStyle=PEN;ctx.lineWidth=1.6;ctx.globalAlpha=.6;
  for(let k=1;k<=5;k++){const y=SEAY+16+k*25,sp=(8+k*9)*(k%2?1:-1),off=((now*sp)%90+90)%90;for(let x=-90+off+(k*37)%90;x<W+20;x+=90){const yy=y+Math.sin(x*.02+now+k)*3+j();ctx.moveTo(x,yy);ctx.quadraticCurveTo(x+11,yy+8+j(),x+22,yy);ctx.quadraticCurveTo(x+31,yy-6,x+40,yy+j())}}
  ctx.stroke();ctx.globalAlpha=1;
  ink(top,{lw:3.2,color:PEN,twice:true});
  // curls on the crests
  for(let x=-((now*26)%170);x<W;x+=170){const y=sea(x+8);ink([[x,y],[x+10,y-11],[x+21,y-9],[x+22,y-1],[x+15,y+1],[x+13,y-5]],{lw:2,color:PEN})}
  ink(body.slice(top.length),{lw:1.4,color:PEN,a:.5})}

/* ============ sky doodles ============ */
const gulls=[0,1,2].map(i=>({x:Math.random()*1400,y:70+i*38+Math.random()*30,s:22+Math.random()*26,p:Math.random()*9}));
const clouds=[0,1,2,3].map(i=>({x:i*380+Math.random()*100,y:70+Math.random()*90,s:.8+Math.random()*.6,v:6+Math.random()*7}));
function drawSky(dt){JIT=1.1;seed(21);
  // the sun, who thinks he is cool
  const ti=GM.state=='title',sx=ti?150:W*.37,sy=ti?120:150,R=34,sc=storm;ctx.save();ctx.translate(sx,sy);
  for(let i=0;i<11;i++){const a=i/11*TAU+now*.15,l=(i%2?17:26)*(1-sc*.5);ink(line(Math.cos(a)*(R+7),Math.sin(a)*(R+7),Math.cos(a)*(R+7+l),Math.sin(a)*(R+7+l)+sc*9),{lw:2,color:ORG,a:.8})}
  const S=ell(0,0,R,R,12);fill(S,PAPER_HI);hatch(S,{color:YEL,gap:4,angle:.7,a:.6,lw:1.6});ink(S,{closed:true,lw:2.4,color:ORG});
  if(sc<.5){for(const s of[-1,1]){const L=[[s*4,-10],[s*26,-11],[s*24,2],[s*14,5],[s*5,1]];fill(L,INK);ink(L,{closed:true,lw:1.5})}ink(line(-5,-8,5,-8),{lw:2});ink([[-13,13],[0,20],[14,11]],{lw:2})}
  else{for(const s of[-1,1]){ink(ell(s*13,-6,7,8,8),{closed:true,lw:1.6});blob(s*13+2,-4,2.4)}ink(ell(0,16,5,7,8),{closed:true,lw:1.8});ink([[24,-22],[28,-13],[22,-12],[24,-22]],{lw:1.4,color:PEN})}
  ctx.restore();
  for(const c of clouds){c.x+=c.v*dt;if(c.x>W+120)c.x=-160;const P=[];for(let i=0;i<=12;i++){const a=PI+i/12*PI,b=1+.3*Math.abs(Math.sin(i*1.57));P.push([c.x+Math.cos(a)*62*c.s,c.y+Math.sin(a)*26*c.s*b])}P.push([c.x+62*c.s,c.y+4],[c.x-62*c.s,c.y+5]);
    ink(P,{closed:true,lw:1.5,color:GREY,a:.5});hatch(P,{color:GREY,gap:6,angle:.3,a:.18})}
  for(const g of gulls){g.x-=dt*(30+g.s);if(g.x<-40){g.x=W+40;g.y=60+Math.random()*170}const f=Math.sin(now*7+g.p)*g.s*.3;ink([[g.x-g.s*.5,g.y-f],[g.x-g.s*.2,g.y-g.s*.22],[g.x,g.y],[g.x+g.s*.2,g.y-g.s*.22],[g.x+g.s*.5,g.y-f]],{lw:1.8,a:.75})}}

/* ============ margin doodles (what the rest of the lesson looked like) ============ */
function coolS(x,y,u,a){const L=[[0,1,0,2],[1,1,1,2],[2,1,2,2],[0,3.6,0,4.6],[1,3.6,1,4.6],[2,3.6,2,4.6],[0,1,1,0],[1,0,2,1],[0,4.6,1,5.6],[1,5.6,2,4.6],[0,2,1,3.6],[1,2,2,3.6],[2,2,1.5,2.8],[0,3.6,.5,2.8]];
  for(const l of L)ink(line(x+l[0]*u,y+l[1]*u,x+l[2]*u,y+l[3]*u),{lw:1.6,color:PEN,a})}
function drawMargin(){JIT=.9;seed(31);const a=.62;

  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+(att||.005));g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*.5);s.stop(t+dur+.05)}
function tone(dur,type,f0,f1,vol,delay){if(!AC||muted)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05)}

function fireShot(s,lx,ly,vx,vy,kind,r){const p=toWorld(s,lx,ly);shots.push({x:p[0],y:p[1],vx,vy,owner:s===player?'player':'foe',kind:kind||'ball',r:r||8,skips:0,spin:0,trail:[],id:uid++,holed:{}});

function playerFire(){const s=player,sp=lerp(430,1100,s.charge),n=now<s.triple?3:1;for(let i=0;i<n;i++){const a=s.aim+s.tilt+(i-(n-1)/2)*.1;const p=fireShot(s,34+Math.cos(s.aim)*38,-52+Math.sin(s.aim)*38,Math.cos(a)*sp,Math.sin(a)*sp,'ball',8);if(!i&&Math.random()<.35)word(pick(WORDS.fire),p[0]+30,p[1]-34,24)}

    if(ph==0){for(let i=0;i<(mad?5:4);i++)lob(Tm+.15+i*.22,110,'ball',9);word('SILENCE!',s.x-150,s.y-470,34,RED,{sp:false})}
    else if(ph==1){for(let i=0;i<(mad?4:2);i++)bolts.push({x:clamp(player.x+(i?rnd(-170,170):0),130,W*.5),sx:W-rnd(320,520),t0:now+1+i*.45,warn:1+i*.45,dur:.32,hit:false})}
    else{for(let i=0;i<(mad?3:2);i++){const p=toWorld(s,-40+i*60,-300);shots.push({x:p[0],y:p[1],vx:-200,vy:rnd(-120,40),owner:'foe',kind:'plane',r:11,skips:0,spin:0,trail:[],id:uid++,holed:{},born:now})}word('detention slips!',s.x-220,s.y-360,20,INK,{sp:false})}}}
function hurt(x,y){if(player.inv>0||player.dead)return;player.hp--;player.inv=1.3;player.flash=.2;boom(x,y,30);word(pick(WORDS.hit),x,y-50,34,RED);shake=16;SND.hurt();GM.combo=1;teacher('hurt');player.tiltV-=2.5;player.rxV-=200;debris(x,y,4);
  if(player.hp<=0){player.dead=true;GM.endAt=now+2.6;word('glub glub glub',player.x,player.y-120,26,PEN,{dur:2.4,sp:false});for(let i=0;i<4;i++)setTimeout(()=>boom(player.x+rnd(-60,60),player.y-rnd(10,120),rnd(24,44)),i*260)}}
function kill(s,b){s.dead=true;const T=TYPES[s.type],skip=b&&b.skips>0;addScore(T.score*(skip?2:1),s.x,s.y-160,skip?'SKIP SHOT x2':'');debris(s.x,s.y-40,s.type=='paper'?7:12,s.type=='paper');word(s.type=='boss'?'KRAKA-BOOOOM':pick(WORDS.hit),s.x,s.y-130,s.type=='boss'?60:42,INK);boom(s.x,s.y-50,s.type=='boss'?90:46);

function hitShip(s,b){const skip=b.skips>0,dmg=skip?2:1;s.hp-=dmg;s.flash=.16;s.rxV+=-s.side*(s.type=='boss'?30:150);s.tiltV+=-s.side*(s.type=='boss'?.2:1.2);GM.hits++;GM.missStreak=0;boom(b.x,b.y,skip?34:26);addScore(25*GM.combo,b.x,b.y-30,GM.combo>1?'x'+GM.combo:'');GM.combo=Math.min(9,GM.combo+1);

function updateShip(s,dt){const T=TYPES[s.type],w=T.w*T.S*.7;s.y=(sea(s.x-w)+sea(s.x)+sea(s.x+w))/3;const slope=Math.atan2(sea(s.x+w)-sea(s.x-w),w*2)*(s.type=='boss'?.35:.9);
  s.tiltV+=((slope-s.vx*.0006-s.tilt)*34-s.tiltV*4.2)*dt;s.tilt+=s.tiltV*dt;s.rxV+=(-s.rx*60-s.rxV*7)*dt;s.rx+=s.rxV*dt;s.flap=Math.max(0,s.flap-dt*2.4);s.flash-=dt;s.inv-=dt;
  if(s.dead){s.sink+=dt/(s.type=='boss'?6:2.2);if(Math.random()<dt*7)fx.push({type:'drop',x:s.x+rnd(-40,40),y:s.y,vx:0,vy:-90,r:rnd(2,4),t0:now,dur:.5,color:PEN,id:uid++});return}
  if(s===player)return;
  if(now>s.wanderAt){s.wanderAt=now+rnd(3,6);if(s.type!='boss')s.tx=rnd(W*.56,W-100);else s.tx=W-290+rnd(-40,30)}
  for(const o of ships)if(o!==s&&!o.dead&&Math.abs(o.x-s.x)<(TYPES[o.type].w+T.w)*.9&&o.id<s.id)s.tx=Math.min(W-90,s.tx+60*dt*3);
  const sp=s.type=='boss'?46:s.type=='paper'?90:60;s.vx=ease(s.vx,clamp((s.tx-s.x)*1.2,-sp,sp),2,dt);s.x+=s.vx*dt;
  if(s.x<W-40&&!player.dead){s.tell=now>s.fireAt-.6?1:0;if(now>s.fireAt){foeFire(s);const r=T.rate,k=s.type=='boss'?(s.hp<s.max*.5?.75:1):[1.5,1.3,1.15,1.05,1,1][GM.wave];s.fireAt=now+rnd(r[0],r[1])*k}}else s.fireAt=Math.max(s.fireAt,now+1)}
function updatePlayer(dt){const s=player;if(s.dead)return;const dir=(keys.right?1:0)-(keys.left?1:0);s.vx=ease(s.vx,dir*250,4,dt);s.x=clamp(s.x+s.vx*dt,150,W*.47);s.reload-=dt;
  const m=toWorld(s,34,-52),wa=Math.atan2(mouse.y-m[1],mouse.x-m[0]);s.aim=ease(s.aim,clamp(wa-s.tilt,-1.5,.3),18,dt);
  if(mouse.down&&s.reload<=0)s.charge=Math.min(1,s.charge+dt/.8);else if(!mouse.down&&s.charge>0){s.charge=Math.max(s.charge,.12);playerFire()}}
function updateShots(dt){for(const b of shots){if(b.kind=='plane'){const a=Math.atan2(player.y-60-b.y,player.x-b.x),ca=Math.atan2(b.vy,b.vx);let d=a-ca;d=Math.atan2(Math.sin(d),Math.cos(d));const na=ca+clamp(d,-1.1*dt,1.1*dt)+Math.sin(now*5+b.id)*.02,sp=195;b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp;if(now-b.born>7)b.vy+=200*dt}else b.vy+=GRAV*dt;
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.spin+=dt*9;b.trail.push([b.x,b.y]);if(b.trail.length>9)b.trail.shift();
    const sy=sea(b.x);if(b.y>=sy){const v=Math.hypot(b.vx,b.vy);if(b.vy>0&&(Math.abs(b.vy)<Math.abs(b.vx)*.62&&v>250&&b.skips<4||b.kind=='ducky'&&b.skips<3)){b.vy=-Math.abs(b.vy)*.6-50;b.vx*=.86;b.y=sy-1;b.skips++;splash(b.x);SND.skip();if(Math.random()<.5)word(pick(WORDS.skip),b.x,sy-24,15,PEN,{dur:.6,sp:false})}
      else{b.gone=true;splash(b.x,true);SND.splash();if(Math.random()<.3)word(pick(WORDS.splash),b.x,sy-34,18,PEN,{sp:false});if(b.owner=='player'){GM.combo=1;if(++GM.missStreak==4){teacher('miss');GM.missStreak=0}}}}
    if(b.x<-80||b.x>W+80||b.y<-900)b.gone=true;if(b.gone)continue;
    const targets=b.owner=='player'?ships:[player];for(const s of targets){if(s.dead||b.gone)continue;const T=TYPES[s.type],L=toLocal(s,b.x,b.y),h=T.hull,sl=T.sails;
      if(L[0]>h[0]&&L[0]<h[1]&&L[1]>h[2]&&L[1]<h[3]){b.gone=true;if(s===player)hurt(b.x,b.y);else hitShip(s,b)}
      else if(sl&&!b.holed[s.id]&&L[0]>sl[0]&&L[0]<sl[1]&&L[1]>sl[2]&&L[1]<sl[3]&&b.kind!='plane'){b.holed[s.id]=1;if(s.holes.length<16)s.holes.push([L[0],L[1],b.id]);b.vx*=.82;s.flap=1;debris(b.x,b.y,2,true);if(Math.random()<.4)word('rrrip',b.x,b.y-20,16,INK,{dur:.6,sp:false})}}}
  for(const a of shots)if(a.owner=='player'&&!a.gone)for(const b of shots)if(b.owner=='foe'&&!b.gone&&Math.hypot(a.x-b.x,a.y-b.y)<a.r+b.r+6){a.gone=b.gone=true;stars(b.x,b.y,34);blot(b.x,b.y,14,{drops:4,flame:false});word(pick(WORDS.clank),b.x,b.y-24,22,INK,{sp:false});addScore(b.kind=='plane'?75:50,b.x,b.y-40);SND.skip();GM.hits++}

function updatePickups(dt){for(const p of pickups){p.x-=34*dt;p.y=sea(p.x);let got=!player.dead&&Math.abs(p.x-player.x)<80;for(const b of shots)if(b.owner=='player'&&Math.hypot(b.x-p.x,b.y-(p.y-16))<28){got=true;b.gone=true}

function update(dt){storm=ease(storm,GM.state!='play'&&GM.state!='dead'?0:GM.eraser?0:GM.wave==5?(ships[0]&&ships[0].hp<ships[0].max*.5?1:.55):GM.wave==4?.12:0,GM.eraser?.5:.6,dt);ROUGH=ease(ROUGH,1+storm*.9,1,dt);

  if(touchUI){for(const d of[-1,1]){const cx=170+d*52,cy=H-44;ink(ell(cx,cy,30,26,10),{closed:true,lw:2.4,color:PEN});ink([[cx-d*10,cy-12],[cx+d*12,cy],[cx-d*10,cy+12]],{sharp:true,lw:3.4,color:PEN})}}
  txt(muted?'M: sound is OFF':'M: mute   P: pause',W-210,H-14,9,{lw:1.2,a:.55,still:true})}
function drawAim(){const s=player;if(s.dead||GM.state!='play')return;JIT=.6;seed(43);const sp=lerp(430,1100,Math.max(.12,s.charge)),a=s.aim+s.tilt,p=toWorld(s,34+Math.cos(s.aim)*38,-52+Math.sin(s.aim)*38);let x=p[0],y=p[1],vx=Math.cos(a)*sp,vy=Math.sin(a)*sp;
  for(let i=0;i<9;i++){for(let k=0;k<3;k++){vy+=GRAV*.016;x+=vx*.016;y+=vy*.016}if(y>sea(x))break;blob(x,y,2.6-i*.18,GREY,.7-i*.06)}
  if(s.charge>0){const m=toWorld(s,34,-52);ink(ell(m[0],m[1],30,30,12,-PI*.9,-PI*.9+s.charge*PI*1.5),{lw:5,color:s.charge>=1?RED:ORG,a:.85});if(s.charge>=1)txt('MAX!',m[0]-16,m[1]-42,13,{color:RED,lw:2,fps:12})}
  ink(line(mouse.x-9,mouse.y,mouse.x+9,mouse.y),{lw:2,color:RED});ink(line(mouse.x,mouse.y-9,mouse.x,mouse.y+9),{lw:2,color:RED});ink(ell(mouse.x,mouse.y,6,6,8),{closed:true,lw:1.4,color:RED})}
function drawBanner(){const b=GM.banner;if(!b)return;const k=now-b.t0;if(k>3.6){GM.banner=null;return}const a=clamp((3.6-k)/.6,0,1);seed(44);
  txt(b.title,W/2+3,243,50,{align:'c',color:PAPER_HI,lw:13,a,rev:k/.7,fps:3});txt(b.title,W/2,240,50,{align:'c',lw:5.5,bold:true,a,rev:k/.7,under:k>.8?2:0,fps:3});
  if(k>.8)txt(b.sub,W/2,290,20,{align:'c',color:PEN,lw:2.4,a,rev:(k-.8)/.8,fps:3});if(k>1.7)txt(GM.wave==5?'good.':'date?? margin?? use a RULER',W/2+120,326,14,{color:RED,rot:-.06,a,rev:(k-1.7)/.6,lw:1.8})}
function card(x,y,w,h,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);const P=[[-w/2,-h/2],[w/2,-h/2+4],[w/2-3,h/2],[-w/2+4,h/2-3]];hatch(P.map(p=>[p[0]+9,p[1]+11]),{gap:3,angle:.8,a:.5,sharp:true});fill(P,PAPER_HI,1,true);ink(P,{closed:true,sharp:true,lw:3});}
function drawScreens(){const k=now-GM.t0;seed(45);JIT=1.2;
  if(GM.state=='title'){txt('NOTEBOOK',W/2+5,165,78,{align:'c',color:RED,lw:8,a:.5,fps:3});txt('NOTEBOOK',W/2,160,78,{align:'c',lw:8.5,bold:true,fps:3,mess:1.3});txt('ARMADA',W/2+5,265,94,{align:'c',color:PEN2,lw:9,a:.5,fps:3});txt('ARMADA',W/2,260,94,{align:'c',lw:10,bold:true,under:2,fps:3,mess:1.3});
    txt('a sea battle in the back of my maths book',W/2,338,19,{align:'c',color:PEN,lw:2.2,fps:2});txt('by ________  (class 7B)',W/2,368,15,{align:'c',lw:1.8,fps:2});
    if(Math.sin(now*4)>-.4)txt('> click to start <',W/2,430+Math.sin(now*3)*3,28,{align:'c',color:RED,lw:3.2,bold:true});
    txt('A/D: sail   mouse: aim   hold: MORE BOOM   low shots SKIP!',W/2,H-40,14,{align:'c',color:PEN,lw:1.7,fps:2});txt('Is THIS your homework?!  - Mrs K.',W/2-190,H-84,19,{color:PAPER_HI,rot:-.04,lw:7,fps:2});txt('Is THIS your homework?!  - Mrs K.',W/2-190,H-84,19,{color:RED,rot:-.04,lw:2.4,fps:2,under:1})}
  if(GM.state=='dead'){card(W/2,300,600,300,-.02);txt('SUNK.',0,-50,90,{align:'c',color:RED,lw:9,bold:true,rev:k/.4,mess:1.5});txt('the '+player.name+' was, in fact, sinkable',0,0,17,{align:'c',lw:2});
    txt('score: '+GM.score,-40,40,18,{align:'c',strike:k>1,lw:2});if(k>1){txt(String(Math.floor(GM.score/2)),120,42,22,{color:RED,lw:2.6});txt('-50% LATE PENALTY',0,74,15,{align:'c',color:RED,lw:2,rot:-.03})}
    if(k>1.2&&Math.sin(now*4)>-.4)txt('click: launch the UNSINKABLE '+roman(GM.deaths+3),0,118,18,{align:'c',color:GRN,lw:2.4});ctx.restore()}
  if(GM.state=='win'){const acc=GM.fired?Math.round(GM.hits/GM.fired*100):0,pts=acc*.5+Math.max(0,50-GM.deaths*15),gr=pts>=80?'A+':pts>=68?'A':pts>=55?'B':pts>=42?'C':'D-';card(W/2,330,640,480,.015);
    txt('END OF TERM REPORT',0,-188,30,{align:'c',lw:3.6,bold:true,under:2});const rows=[['NAVAL COMBAT',gr],['ACCURACY',acc+'%'],['SHIPS LOST',String(GM.deaths)],['FINAL SCORE',String(GM.score)],['ATTENTION IN CLASS','F']];
    rows.forEach((r,i)=>{if(k<.5+i*.5)return;const y=-130+i*44;txt(r[0],-280,y,18,{lw:2.2,still:true});ink(line(-280+txtW(r[0],18)+8,y-3,150,y-2),{lw:1,a:.4});txt(r[1],170,y+2,i==0||i==4?34:22,{color:RED,lw:i==0||i==4?4.5:2.8,bold:true,rot:-.08,seed:i});if(i==0)ink(ell(170+txtW(r[1],34)/2,y-12,34,24,12),{closed:true,lw:2.4,color:RED})});
    if(k>3.2){txt('Shows real talent. At the WRONG THING.',-280,112,16,{color:RED,lw:2,rev:(k-3.2)/1.2,rot:-.02});txt('- Mrs K.',120,142,16,{color:RED,lw:2,rev:(k-4.4)/.4})}
    if(k>4.6){txt("SCHOOL'S OUT $ $ $",0,186,24,{align:'c',color:GRN,lw:3,bold:true,fps:8});if(Math.sin(now*4)>-.4)txt('click to do it all again',0,218,14,{align:'c',lw:1.7})}ctx.restore()}
  if(paused){card(W/2,320,520,150,.02);txt('PAUSED',0,0,56,{align:'c',lw:6,bold:true,still:true});txt('(teacher is looking. act natural.)',0,40,15,{align:'c',color:PEN,lw:1.8,still:true});ctx.restore()}}
function drawEraser(dt){const e=GM.eraser;if(!e||now<e.t0)return;e.x-=dt*W*.5;if(e.x<-400)return;seed(46);JIT=1.5;const y=100+Math.sin(now*9)*34;for(let i=0;i<5;i++)ink(line(e.x+60+i*60,y-50+i*17,e.x+400+i*70,y-46+i*19),{lw:9,color:PAPER_HI,a:.85});
  ctx.save();ctx.translate(e.x,y);ctx.rotate(-.3+Math.sin(now*9)*.12);const P=[[-60,-34],[60,-34],[64,34],[-58,36]];fill(P,PINK,1,true);hatch(P,{color:RED,gap:6,angle:.6,a:.35,sharp:true});ink(P,{closed:true,sharp:true,lw:3.4});const Bd=[[-60,-34],[-16,-34],[-14,36],[-58,36]];fill(Bd,PEN2,.8,true);ink(Bd,{closed:true,sharp:true,lw:2.6});ctx.restore();if(Math.random()<.2)SND.rub()}

/* ============ frame ============ */
function render(dt){ctx.setTransform(SC*DPR,0,0,SC*DPR,0,0);ctx.drawImage(paper,0,0,W,H);ctx.lineCap='round';ctx.lineJoin='round';
  ctx.save();if(shake>0)ctx.translate(rnd(-shake,shake),rnd(-shake,shake)*.7);
  drawMargin();drawSky(dt);drawSeaBack();
  for(const s of ships.slice().sort((a,b)=>TYPES[b.type].w-TYPES[a.type].w))drawShip(s);if(player&&player.sink<1)drawShip(player);drawStorm();
  drawSeaFront();for(const p of pickups)drawPickup(p);for(const b of bolts)drawBolt(b);for(const b of shots)drawShot(b);
  drawFx(0);drawEraser(dt);drawFx(1);drawAim();ctx.restore();
  if(GM.state!='title')drawHUD();drawNotes();drawBanner();drawScreens()}
let dprCap=2,slow=0;
function resize(){const iw=innerWidth,ih=innerHeight;W=Math.round(clamp(H*iw/ih,1000,1800));SC=Math.min(iw/W,ih/H);DPR=Math.min(dprCap,window.devicePixelRatio||1,2600/(W*SC));cv.width=Math.round(W*SC*DPR);cv.height=Math.round(H*SC*DPR);cv.style.width=W*SC+'px';cv.style.height=H*SC+'px';makePaper()}
function demo(){GM.state='title';GM.t0=now;newPlayer();player.inv=0;ships=[makeShip('galleon',W-180,-1),makeShip('paper',W-420,-1)];ships.forEach(s=>s.fireAt=1e9);shots=[];bolts=[];pickups=[]}
let last=0;function frame(ms){const t=ms/1000,dt=Math.min(.033,t-last||.016);slow=t-last>.03?slow+1:Math.max(0,slow-2);last=t;if(slow>80&&dprCap>1){dprCap=1;slow=0;resize()}if(!paused){now+=dt;BOIL=Math.floor(now*9);
    if(GM.state=='title'){updateShip(player,dt);ships.forEach(s=>{updateShip(s,dt);s.fireAt=1e9})}update(dt)}render(paused?0:dt);requestAnimationFrame(frame)}

/* ============ input ============ */
const toGame=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/SC,(e.clientY-r.top)/SC]};let movePtr=null;
function click(){audio();if(AC&&AC.state=='suspended')AC.resume();if(paused){paused=false;return true}
  if(GM.state=='title'){startGame();return true}
  if(GM.state=='dead'&&now-GM.t0>1.2){GM.deaths++;GM.score=Math.floor(GM.score/2);GM.state='play';ships=[];shots=[];bolts=[];pickups=[];newPlayer();GM.wave--;GM.nextAt=0;nextWave();note('try NOT sinking this time',130,H-30,{color:INK,size:15});return true}
  if(GM.state=='win'&&now-GM.t0>4.6){demo();return true}return GM.state!='play'}
cv.addEventListener('pointerdown',e=>{const p=toGame(e);if(e.pointerType=='touch')touchUI=true;cv.setPointerCapture(e.pointerId);
  if(touchUI&&GM.state=='play'&&p[1]>H-80&&p[0]>80&&p[0]<260){movePtr=e.pointerId;keys.left=p[0]<170;keys.right=p[0]>=170;return}
  mouse.x=p[0];mouse.y=p[1];if(click())return;mouse.down=true});
cv.addEventListener('pointermove',e=>{if(e.pointerId===movePtr){const p=toGame(e);keys.left=p[0]<170;keys.right=p[0]>=170;return}const p=toGame(e);mouse.x=p[0];mouse.y=p[1]});
const up=e=>{if(e.pointerId===movePtr){movePtr=null;keys.left=keys.right=false;return}mouse.down=false};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k=='a'||k=='arrowleft')keys.left=true;if(k=='d'||k=='arrowright')keys.right=true;if(k==' '){e.preventDefault();if(!e.repeat&&!click())mouse.down=true}
  if(k=='p'&&GM.state=='play')paused=!paused;if(k=='m'){muted=!muted}if(k=='enter')click()});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k=='a'||k=='arrowleft')keys.left=false;if(k=='d'||k=='arrowright')keys.right=false;if(k==' ')mouse.down=false});
addEventListener('blur',()=>{keys.left=keys.right=false;mouse.down=false;if(GM.state=='play')paused=true});addEventListener('resize',resize);
resize();demo();requestAnimationFrame(frame);
</script>
