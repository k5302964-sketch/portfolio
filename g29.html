  html, body { margin: 0; height: 100%; background: #120802; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  #c { position: absolute; left: 50%; top: 50%; width: 100vw; height: calc(100vw * 9 / 16); transform: translate(-50%, -50%); touch-action: none; }
  @media (min-aspect-ratio: 16/9) { #c { height: 100vh; width: calc(100vh * 16 / 9); } }
  /* сенсорный пульт: на телефоне боком — поверх кадра по углам, стоя — под кадром */
  #pad { display: none; }
  body.touch #pad { display: block; position: absolute; inset: 0; pointer-events: none; font-family: Kurale, serif; }
  #pad .grp { position: absolute; display: flex; gap: 14px; pointer-events: auto; }
  #pad button { -webkit-appearance: none; appearance: none; touch-action: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    min-width: 64px; height: 64px; border-radius: 32px; border: 4px solid #2a1a0e; background: #f4e6c8; color: #2a1a0e; font: 26px/1 'Yeseva One', serif;
    box-shadow: 0 4px 0 #2a1a0e; opacity: .88; padding: 0 14px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  #pad button.on { transform: translateY(3px); box-shadow: 0 1px 0 #2a1a0e; opacity: 1; background: #fff4da; }
  #pad button svg { width: 30px; height: 30px; }
  #pad .pick button { border-radius: 14px; font: 15px/1.15 Kurale, serif; min-width: 0; height: auto; min-height: 54px; padding: 6px 14px; text-align: center; white-space: nowrap; }
  #pad .pick button b { font: 19px 'Yeseva One', serif; }
  #pad .pick button.good { background: #ffd28a; }
  #pad .pick button.dim { opacity: .45; }
  #pad .pick button[data-pick=parcel] { border-color: #8a3a10; }
  #pad .move { left: max(14px, env(safe-area-inset-left)); bottom: 14px; }
  #pad .act { right: max(14px, env(safe-area-inset-right)); bottom: 14px; }
  #pad .act .grab { width: 78px; height: 78px; border-radius: 39px; background: #ffb067; }
  #pad .sys { right: max(14px, env(safe-area-inset-right)); top: 12px; gap: 10px; }
  #pad .sys button { min-width: 46px; height: 46px; font-size: 20px; padding: 0 10px; }
  #pad .pick { left: 50%; transform: translateX(-50%); bottom: 14px; display: none; gap: 10px; }
  body.choose #pad .pick { display: flex; }
  body.choose #pad .act, body:not(.playing) #pad .grp { display: none; }
  body.choose #pad .move { display: flex; }
  @media (orientation: portrait) {
    body.touch #c { top: max(8px, env(safe-area-inset-top)); left: 0; transform: none; width: 100vw; height: 56.25vw; }
    body.touch #pad { top: calc(56.25vw + max(8px, env(safe-area-inset-top))); }
    body.touch #pad .move button, body.touch #pad .act button { min-width: 84px; height: 84px; border-radius: 42px; font-size: 32px; }
    body.touch #pad button svg { width: 38px; height: 38px; }
    body.touch #pad .act .grab { width: 104px; height: 104px; border-radius: 52px; }
    body.touch #pad .move { bottom: max(28px, env(safe-area-inset-bottom)); }
    body.touch #pad .act { bottom: max(28px, env(safe-area-inset-bottom)); align-items: flex-end; }
    body.touch #pad .sys { top: 14px; }
    body.touch #pad .sys button { min-width: 52px; height: 52px; border-radius: 26px; font-size: 22px; }
    body.touch #pad .pick { flex-direction: column; top: 84px; bottom: auto; width: min(92vw, 420px); }
    body.touch #pad .pick button { font-size: 22px; white-space: normal; border-radius: 16px; min-width: 0; height: auto; min-height: 60px; padding: 8px 14px; }
    body.touch #pad .pick button b { font-size: 26px; }
    body.touch.choose #pad .move { bottom: max(28px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); }
  }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<div id="pad">
  <div class="grp sys"><button data-k="reset" aria-label="к площадке">↺</button><button data-k="music" aria-label="музыка">♪</button></div>
  <div class="grp move"><button data-k="left" aria-label="влево"><svg viewBox="-20 -20 40 40"><path d="M12,0 H-10 M2,-12 L-12,0 L2,12" fill="none" stroke="#2a1a0e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button data-k="right" aria-label="вправо"><svg viewBox="-20 -20 40 40"><path d="M-12,0 H10 M-2,-12 L12,0 L-2,12" fill="none" stroke="#2a1a0e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
  <div class="grp act"><button data-k="hop" aria-label="прыжок"><svg viewBox="-20 -20 40 40"><path d="M0,13 V-11 M-12,0 L0,-12 L12,0" fill="none" stroke="#2a1a0e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="grab" data-k="grab" aria-label="сорвать линии">✋</button></div>
  <div class="grp pick"><button data-pick="self"></button><button data-pick="parcel"></button><button data-pick="return"></button></div>
