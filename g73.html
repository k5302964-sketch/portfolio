.sheet { background: rgba(9, 12, 14, 0.88); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); align-content: start; padding-block: 24px 40px; }

.grid { position: relative; display: grid; gap: 2px; background: var(--line); border: 1px solid var(--line); width: max-content; max-width: 100%; }

.item[data-k="med"] .ic { color: #e8968c; } .item[data-k="ammo"] .ic { color: #dcc07a; } .item[data-k="flare"] .ic { color: #ff8a55; } .item[data-k="frag"] .ic { color: #b5c08f; } .item.rare .ic { color: var(--sodium); }

.body svg { width: 100%; max-width: 220px; display: block; margin: 0 auto; }

#hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; font-family: var(--f-mono); }
#hud .dot { position: absolute; left: 50%; top: 50%; width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px; background: rgba(220,223,218,0.7); border-radius: 50%; }

#hud .stagebar .m { font-family: var(--f-mono); font-size: var(--s-0); letter-spacing: 0.14em; color: var(--fog-3); }

#hud .prompt .ring { width: 18px; height: 18px; }

#hud .subs { position: absolute; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); text-align: center; display: grid; gap: 4px; width: min(720px, 92vw); }
#hud .subs div { font-family: var(--f-body); font-size: var(--s-2); color: var(--fog); text-shadow: 0 1px 6px rgba(0,0,0,0.95); transition: opacity 0.5s; }
#hud .subs b { font-family: var(--f-mono); font-weight: 500; font-size: var(--s-0); letter-spacing: 0.1em; color: var(--sodium); margin-right: 8px; }
#hud .toasts { position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); bottom: calc(120px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; max-width: min(420px, 70vw); }
#hud .toasts div { font-family: var(--f-body); font-size: var(--s-1); line-height: 1.35; background: var(--glass-2); border-left: 2px solid var(--fog-3); padding: 6px 10px; transition: opacity 0.6s; }
#hud .callout { position: absolute; left: 50%; top: 36%; transform: translateX(-50%); text-align: center; opacity: 0; transition: opacity 0.5s; }
#hud .callout .t { font-family: var(--f-head); font-weight: 800; font-size: var(--s-4); text-transform: uppercase; color: var(--danger); text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
#hud .callout .s { font-size: var(--s-1); color: var(--fog-2); }
#hud .status { position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: flex-end; gap: 14px; }

#hud .status .ic span { color: var(--danger); }
#hud .stam { width: 120px; height: 3px; background: rgba(220,223,218,0.12); opacity: 0; transition: opacity 0.5s; }
#hud .stam i { display: block; height: 100%; background: var(--fog-2); width: 100%; }

K.rng = function(seed) {

    a |= 0;
    a = a + 1831565813 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;

K.box = function(w, h, d, mat, r = 0) {
  const st = K.style;
  d *= K.thick();
  const mn = Math.min(w, h, d);
  let seg = 2;
  if (st === "vinyl") {
    r = Math.max(r, mn * .4);
    seg = 4;
  } else if (st === "plasticine") {
    r = Math.max(r, mn * .32);
    seg = 3;
  } else if (st === "ink") {
    r = Math.max(r, mn * .12);
    seg = 2;
  } else if (st === "signal") {
    r = 0;
  } else if (st === "shard" || st === "block") r = 0;
  const g = r > 0 ? new RoundedBoxGeometry(w, h, d, seg, Math.min(r, w / 2.01, h / 2.01, d / 2.01)) : new THREE.BoxGeometry(w, h, d);

K.shape = function(pts, holes) {

  for (let i = 1; i < pts.length; i++) s.lineTo(pts[i][0], pts[i][1]);
  s.closePath();
  if (holes) for (const h of holes) {
    const p = new THREE.Path;
    p.moveTo(h[0][0], h[0][1]);
    for (let i = 1; i < h.length; i++) p.lineTo(h[i][0], h[i][1]);
    p.closePath();
    s.holes.push(p);
  }
  return s;
};

K.prof = function(pts, depth, mat, bevel = .002, holes) {
  const st = K.style;
  depth *= K.thick();
  let xs = pts.map((p => p[0])), ys = pts.map((p => p[1]));
  const span = Math.min(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys));
  let bs = 1, cs = 6;
  if (st === "vinyl") {
    bevel = Math.max(bevel, depth * .38);
    bs = 4;
    cs = 12;
  } else if (st === "plasticine") {
    bevel = Math.max(bevel, depth * .3);
    bs = 3;
    cs = 10;
  } else if (st === "ink") {
    bevel = Math.max(bevel, depth * .12);
    bs = 2;
  } else if (st === "signal") {
    bevel = depth * .12;
    bs = 1;
    cs = 2;
  } else if (st === "shard") {
    bevel = 0;
    cs = 2;
  }
  const bsz = Math.min(bevel, span * .22);
  const g = new THREE.ExtrudeGeometry(K.shape(pts, holes), {
    depth: depth,
    bevelEnabled: bevel > 0,
    bevelThickness: bevel,
    bevelSize: bsz,
    bevelSegments: bs,
    curveSegments: cs
  });
  g.translate(0, 0, -depth / 2);
  g.computeVertexNormals();
  return new THREE.Mesh(g, mat);
};

K.profTop = function(pts, depth, mat, bevel = .002) {

K.arcBand = function(x0, y0, len, thick, R, depth, mat, steps = 10, dir = 1) {
  const ang = len / R;
  const outer = [], inner = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps * ang;
    const xr = x0 + R - R * Math.cos(t);
    const yr = y0 - R * Math.sin(t);
    outer.push([ x0 + dir * (R - R * Math.cos(t)) * 1, yr ]);
    const Ri = R - thick;
    inner.push([ x0 + dir * (R - Ri * Math.cos(t)), y0 - Ri * Math.sin(t) ]);
  }
  const pts = outer.concat(inner.reverse());
  return K.prof(pts, depth, mat, .002);
};

K.lathe = function(pts, mat, seg = 24, phiStart = 0, phiLen = Math.PI * 2) {

K.tube = function(pts, r, mat, seg = 24, rs = 8, closed = false) {

  const st = K.style;

    rs = 4;

K.at = function(o, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, s) {
  o.position.set(x, y, z);
  if (rx || ry || rz) o.rotation.set(rx, ry, rz);
  if (s != null) {
    if (typeof s === "number") o.scale.setScalar(s); else o.scale.set(s[0], s[1], s[2]);

K.grp = function(...kids) {

K.add = function(g, ...kids) {

K.rail = function(len, mat, teeth = true) {
  const g = new THREE.Group;
  const base = K.box(len, .006, .021, mat);
  base.position.y = .003;
  g.add(base);
  if (teeth) {
    const n = Math.max(2, Math.floor(len / .01));
    const tg = new THREE.BoxGeometry(.0052, .004, .0215);
    const im = new THREE.InstancedMesh(tg, mat, n);
    const d = new THREE.Object3D;
    for (let i = 0; i < n; i++) {
      d.position.set(-len / 2 + (i + .5) * (len / n), .008, 0);
      d.updateMatrix();
      im.setMatrixAt(i, d.matrix);
    }
    g.add(im);
  }
  return g;
};

K.stats = function(obj) {
  let tris = 0, meshes = 0;
  obj.traverse((o => {
    if (o.isMesh) {
      meshes++;
      const g = o.geometry;
      const c = g.index ? g.index.count / 3 : g.attributes.position.count / 3;
      tris += o.isInstancedMesh ? c * o.count : c;
    }
  }));
  const box = (new THREE.Box3).setFromObject(obj);
  const size = box.getSize(new THREE.Vector3);
  return {
    tris: Math.round(tris),
    meshes: meshes,
    size: size
  };
};

K.shadowAll = function(obj, cast = true, recv = true) {
  obj.traverse((o => {
    if (o.isMesh) {
      o.castShadow = cast;
      o.receiveShadow = recv;
    }
  }));
  return obj;
};

var TX = {};

TX.noise = function(seed) {
  const r = K.rng(seed);
  const vals = new Float32Array(4096);
  for (let i = 0; i < 4096; i++) vals[i] = r();
  const h = (x, y) => vals[(x * 73856093 ^ y * 19349663) & 4095];
  const sm2 = t => t * t * (3 - 2 * t);
  function v(x, y, p) {
    const x0 = Math.floor(x), y0 = Math.floor(y);
    const fx = sm2(x - x0), fy = sm2(y - y0);
    const a = (x0 % p + p) % p, b = (y0 % p + p) % p;
    const a1 = (a + 1) % p, b1 = (b + 1) % p;
    const v00 = h(a, b), v10 = h(a1, b), v01 = h(a, b1), v11 = h(a1, b1);
    return v00 + (v10 - v00) * fx + (v01 + (v11 - v01) * fx - (v00 + (v10 - v00) * fx)) * fy;
  }
  function fbm(u, vv, base = 4, oct = 5, gain = .5) {
    let s = 0, amp = 1, norm2 = 0, p = base;
    for (let o = 0; o < oct; o++) {
      s += v(u * p, vv * p, p) * amp;
      norm2 += amp;
      amp *= gain;
      p *= 2;
    }
    return s / norm2;
  }
  function fbmA(u, vv, bx, by, oct = 4) {
    let s = 0, amp = 1, norm2 = 0, px = bx, py = by;
    for (let o = 0; o < oct; o++) {
      const p = Math.max(px, py);
      s += v(u * px, vv * py, p) * amp;
      norm2 += amp;
      amp *= .5;
      px *= 2;
      py *= 2;
    }
    return s / norm2;
  }
  return {
    v: v,
    fbm: fbm,
    fbmA: fbmA
  };
};

TX.voronoi = function(seed, n) {
  const r = K.rng(seed);
  const pts = [];
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) pts.push([ (i + .15 + r() * .7) / n, (j + .15 + r() * .7) / n, r() ]);
  return function(u, v) {
    const ci = Math.floor(u * n), cj = Math.floor(v * n);
    let f1 = 9, f2 = 9, id = 0;
    for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
      const ii = ((ci + di) % n + n) % n, jj = ((cj + dj) % n + n) % n;
      const p = pts[jj * n + ii];
      const px = p[0] + Math.floor((ci + di) / n) * 1 + (ci + di < 0 ? 0 : 0);
      let dx = p[0] - u, dy = p[1] - v;
      dx -= Math.round(dx);
      dy -= Math.round(dy);
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < f1) {
        f2 = f1;
        f1 = d;
        id = p[2];
      } else if (d < f2) f2 = d;
    }
    return {
      f1: f1,
      f2: f2,
      id: id
    };
  };
};

var hex = h => [ parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16) ];

var mix = (a, b, t) => [ a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t ];

var cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));

var ss = (e0, e1, x) => {
  const t = cl((x - e0) / (e1 - e0));
  return t * t * (3 - 2 * t);
};

TX.paint = function(size, fn, post) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const ctx = c.getContext("2d");
  const img = ctx.createImageData(size, size);
  const d = img.data;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const col = fn(x / size, y / size, x, y);
    const i = (y * size + x) * 4;
    d[i] = col[0];
    d[i + 1] = col[1];
    d[i + 2] = col[2];
    d[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  if (post) post(ctx, size);
  return c;
};

var txCache = new Map;

TX.get = function(key, seed = 7, rep = 1) {
  const ck = key + ":" + seed + ":" + rep;
  if (txCache.has(ck)) return txCache.get(ck);
  const d = TX.defs[key];
  const canvas = TX.paint(d.size, d.fn(seed), d.post ? d.post(seed) : null);
  const t = new K.THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = K.THREE.RepeatWrapping;
  t.repeat.set(rep, rep);
  t.colorSpace = K.THREE.SRGBColorSpace;
  t.anisotropy = 4;
  t.userData.canvas = canvas;
  txCache.set(ck, t);
  return t;
};

TX.mat = function(key, rep = 1, o = {}) {
  const d = TX.defs[key];
  return K.mat("#ffffff", {
    map: TX.get(key, o.seed ?? 7, rep),
    r: o.r ?? d.rough,
    m: o.m ?? (d.fam === "Metal" ? .5 : .02)
  });
};

ST.hash3 = function(x, y, z) {
  let h = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453;
  return h - Math.floor(h);
};

ST.vnoise = function(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const s = t => t * t * (3 - 2 * t);
  const u = s(xf), v = s(yf), w = s(zf);
  const h = ST.hash3;
  const l = (a, b, t) => a + (b - a) * t;
  return l(l(l(h(xi, yi, zi), h(xi + 1, yi, zi), u), l(h(xi, yi + 1, zi), h(xi + 1, yi + 1, zi), u), v), l(l(h(xi, yi, zi + 1), h(xi + 1, yi, zi + 1), u), l(h(xi, yi + 1, zi + 1), h(xi + 1, yi + 1, zi + 1), u), v), w);
};

ST.fbm3 = (x, y, z) => ST.vnoise(x, y, z) * .65 + ST.vnoise(x * 2.1, y * 2.1, z * 2.1) * .35;

ST.lut = (() => {
  const a = new Float32Array(256);
  for (let i = 0; i < 256; i++) {
    const c = i / 255;
    a[i] = c <= .04045 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4);
  }
  return a;
})();

ST.imgCache = new WeakMap;

ST.imgData = function(img) {
  if (!img || !img.getContext) return null;
  let d = ST.imgCache.get(img);
  if (!d) {
    d = img.getContext("2d").getImageData(0, 0, img.width, img.height);
    ST.imgCache.set(img, d);
  }
  return d;
};

ST.avgCache = new WeakMap;

ST.avgColor = function(tex) {
  const img = tex && tex.image;
  if (!img || !img.getContext) return null;
  if (ST.avgCache.has(img)) return ST.avgCache.get(img);
  const d = ST.imgData(img).data;
  let r = 0, g = 0, b = 0, n = 0;
  for (let i = 0; i < d.length; i += 16) {
    r += ST.lut[d[i]];
    g += ST.lut[d[i + 1]];
    b += ST.lut[d[i + 2]];
    n++;
  }
  const c = new K.THREE.Color(r / n, g / n, b / n);
  ST.avgCache.set(img, c);
  return c;
};

ST.gradient = null;

ST.toonRamp = function() {
  if (ST.gradient) return ST.gradient;
  const T2 = K.THREE;
  const t = new T2.DataTexture(new Uint8Array([ 70, 150, 255 ]), 3, 1, T2.RedFormat);
  t.minFilter = t.magFilter = T2.NearestFilter;
  t.generateMipmaps = false;
  t.needsUpdate = true;
  ST.gradient = t;
  return t;
};

ST.bumpTex = null;

ST.thumbBump = function() {
  if (ST.bumpTex) return ST.bumpTex;
  const c = document.createElement("canvas");
  c.width = c.height = 256;
  const x = c.getContext("2d");
  x.fillStyle = "#808080";
  x.fillRect(0, 0, 256, 256);
  const r = K.rng(77);
  for (let i = 0; i < 70; i++) {
    const cx = r() * 256, cy = r() * 256, rad = 6 + r() * 22;
    for (let k = 0; k < 6; k++) {
      x.strokeStyle = `rgba(${r() < .5 ? 255 : 0},${r() < .5 ? 255 : 0},${r() < .5 ? 255 : 0},0.08)`;
      x.lineWidth = 1.2;
      const rr = Math.max(1, rad - k * 2.2);
      x.beginPath();
      x.ellipse(cx, cy, rr, rr * .7, r() * 3, .3, 4.4);
      x.stroke();
    }
  }
  for (let i = 0; i < 1800; i++) {
    x.fillStyle = `rgba(${r() < .5 ? 40 : 220},${r() < .5 ? 40 : 220},${r() < .5 ? 40 : 220},0.12)`;
    x.fillRect(r() * 256, r() * 256, 1.5, 1.5);
  }
  const t = new K.THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = K.THREE.RepeatWrapping;
  ST.bumpTex = t;
  return t;
};

ST.hsl = c => {
  const o = {};
  c.getHSL(o, K.THREE.SRGBColorSpace);
  return o;
};

ST.setHSL = (c, h, s, l) => c.setHSL(h, Math.max(0, Math.min(1, s)), Math.max(0, Math.min(1, l)), K.THREE.SRGBColorSpace);

ST.color = function(mat, style) {
  const T2 = K.THREE;
  let c = mat.color ? mat.color.clone() : new T2.Color(1, 1, 1);
  if (mat.map) {
    const a = ST.avgColor(mat.map);
    if (a) c.multiply(a);
  }
  const h = ST.hsl(c);
  if (style === "vinyl") {
    ST.setHSL(c, h.h, h.s * .9 + .05, Math.min(.84, h.l * .75 + .18));
  } else if (style === "plasticine") {
    ST.setHSL(c, h.h, h.s * .85 + .06, Math.min(.8, h.l * .82 + .1));
    c.lerp(new T2.Color("#b98a63"), .12);
  } else if (style === "ink") {
    ST.setHSL(c, h.h, h.s * 1.25 + .04, Math.min(.85, h.l * 1.05 + .03));
  } else if (style === "shard") {
    ST.setHSL(c, h.h, h.s * .9, Math.min(.85, h.l * 1.04 + .02));
  } else if (style === "signal") {
    const hh = h.h * 360;
    if (h.s > .6 && hh > 8 && hh < 32 && h.l > .28) c.set("#ff5b1f"); else if ((mat.metalness || 0) > .5) c.set("#e8e5dc"); else if (h.s > .3 && h.l > .15 && h.l < .9) c.set(hh > 180 && hh < 260 ? "#3f8fd8" : hh > 330 || hh < 8 ? "#e2443a" : "#d7ff3a"); else {
      const L = h.l;
      c.set(L < .13 ? "#16191b" : L < .27 ? "#3a4044" : L < .45 ? "#6f7672" : L < .66 ? "#b0b3ab" : "#e8e5dc");
    }
  }
  return c;
};

ST.matCache = new Map;

ST.convMat = function(mat, style) {
  if (!mat || mat.isShadowMaterial || mat.userData.styled) return mat;
  const key = mat.uuid + "|" + style;
  if (ST.matCache.has(key)) return ST.matCache.get(key);
  const T2 = K.THREE;
  const base = {
    transparent: mat.transparent,
    opacity: mat.opacity,
    side: mat.side,
    vertexColors: mat.vertexColors || style === "shard" || style === "signal"
  };
  const emissive = mat.emissive ? mat.emissive.clone() : new T2.Color(0, 0, 0);
  const ei = mat.emissiveIntensity ?? 1;
  let out;
  const c = ST.color(mat, style);
  if (style === "shard") {
    out = new T2.MeshStandardMaterial(Object.assign(base, {
      color: c,
      roughness: .88,
      metalness: Math.min(.25, mat.metalness || 0),
      flatShading: true,
      emissive: emissive,
      emissiveIntensity: ei
    }));
  } else if (style === "ink") {
    const keepMap = mat.map && mat.map.image && mat.map.image.getContext;
    out = new T2.MeshToonMaterial(Object.assign(base, {
      color: keepMap ? mat.color.clone() : c,
      map: keepMap ? mat.map : null,
      gradientMap: ST.toonRamp(),
      emissive: emissive,
      emissiveIntensity: ei
    }));
  } else if (style === "vinyl") {
    const flat = mat.vertexColors || mat.transparent;
    out = new T2.MeshPhysicalMaterial(Object.assign(base, {
      color: c,
      roughness: flat ? .75 : .38,
      metalness: 0,
      clearcoat: flat ? .15 : 1,
      clearcoatRoughness: .18,
      emissive: emissive,
      emissiveIntensity: ei
    }));
  } else if (style === "signal") {
    const lit = emissive.r + emissive.g + emissive.b > .6 && ei > .3;
    out = new T2.MeshBasicMaterial(Object.assign(base, {
      color: lit ? emissive.clone().multiplyScalar(1.1) : c,
      map: mat.map && mat.map.image && mat.map.image.getContext && ST.hsl(c).s < .2 ? mat.map : null
    }));
    if (out.map) out.color.set("#ffffff");
  } else if (style === "plasticine") {
    out = new T2.MeshStandardMaterial(Object.assign(base, {
      color: c,
      roughness: .96,
      metalness: 0,
      bumpMap: ST.thumbBump(),
      bumpScale: 1.2,
      emissive: emissive,
      emissiveIntensity: ei
    }));
  } else out = mat;
  out.userData.styled = style;
  ST.matCache.set(key, out);
  return out;
};

ST.skipped = function(m) {
  let p = m;
  while (p) {
    if (p.userData && (p.userData.noMode || p.userData.overlay || p.userData.noStyle)) return true;
    p = p.parent;
  }
  return false;
};

ST.minDim = function(g) {
  g.computeBoundingBox();
  const s = g.boundingBox.getSize(new K.THREE.Vector3);
  const arr = [ s.x, s.y, s.z ].filter((v => v > 1e-6)).sort(((a, b) => a - b));
  return arr.length ? arr[0] : .01;
};

ST.facet = function(m, P2) {
  const T2 = K.THREE;
  let g = m.geometry;
  if (g.userData.st === "shard") return;
  g = g.index ? g.toNonIndexed() : g.clone();
  const pos = g.attributes.position;
  const amp = Math.min(P2.jit, ST.minDim(g) * .12);
  const f = 1 / Math.max(P2.jit * 4, 1e-4);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    pos.setXYZ(i, x + (ST.vnoise(x * f, y * f, z * f) - .5) * 2 * amp, y + (ST.vnoise(x * f + 17, y * f, z * f) - .5) * 2 * amp, z + (ST.vnoise(x * f, y * f + 29, z * f) - .5) * 2 * amp);
  }
  const old = g.attributes.color;
  const col = new Float32Array(pos.count * 3);
  for (let t = 0; t < pos.count; t += 3) {
    const cx = (pos.getX(t) + pos.getX(t + 1) + pos.getX(t + 2)) / 3, cy = (pos.getY(t) + pos.getY(t + 1) + pos.getY(t + 2)) / 3, cz = (pos.getZ(t) + pos.getZ(t + 1) + pos.getZ(t + 2)) / 3;
    const k = .86 + ST.hash3(cx * 91.3, cy * 47.1, cz * 63.7) * .24;
    for (let j = 0; j < 3; j++) {
      const i = t + j;
      col[i * 3] = (old ? old.getX(i) : 1) * k;
      col[i * 3 + 1] = (old ? old.getY(i) : 1) * k;
      col[i * 3 + 2] = (old ? old.getZ(i) : 1) * k;
    }
  }
  g.setAttribute("color", new T2.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  g.userData.st = "shard";
  m.geometry = g;
};

ST.vector = function(m) {
  const T2 = K.THREE;
  let g = m.geometry;
  if (g.userData.st === "signal") return;
  g = g.index ? g.toNonIndexed() : g.clone();
  const pos = g.attributes.position;
  const old = g.attributes.color;
  const col = new Float32Array(pos.count * 3);
  const nm = (new T2.Matrix3).getNormalMatrix(m.isInstancedMesh ? new T2.Matrix4 : m.matrixWorld);
  const a = new T2.Vector3, b = new T2.Vector3, c = new T2.Vector3, n = new T2.Vector3;
  for (let t = 0; t < pos.count; t += 3) {
    a.fromBufferAttribute(pos, t);
    b.fromBufferAttribute(pos, t + 1);
    c.fromBufferAttribute(pos, t + 2);
    n.subVectors(c, b).cross(a.clone().sub(b)).normalize().applyMatrix3(nm).normalize();
    let k;
    if (n.y > .55) k = 1; else if (n.y < -.55) k = .5; else k = .62 * n.x + .78 * n.z > 0 ? .82 : .66;
    for (let j = 0; j < 3; j++) {
      const i = t + j;
      col[i * 3] = (old ? old.getX(i) : 1) * k;
      col[i * 3 + 1] = (old ? old.getY(i) : 1) * k;
      col[i * 3 + 2] = (old ? old.getZ(i) : 1) * k;
    }
  }
  g.setAttribute("color", new T2.Float32BufferAttribute(col, 3));
  g.userData.st = "signal";
  m.geometry = g;
};

ST.lump = function(m, P2) {
  let g = m.geometry;
  if (g.userData.st === "plasticine") return;
  g = g.clone();
  const pos = g.attributes.position;
  const amp = Math.min(P2.disp, ST.minDim(g) * .16);
  const f = P2.freq;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    pos.setXYZ(i, x + (ST.fbm3(x * f, y * f, z * f) - .5) * 2 * amp, y + (ST.fbm3(x * f + 11, y * f + 3, z * f) - .5) * 2 * amp, z + (ST.fbm3(x * f + 5, y * f + 19, z * f + 7) - .5) * 2 * amp);
  }
  g.deleteAttribute("normal");
  const out = K.BGU.toCreasedNormals(g, Math.PI / 2.6);
  out.userData.st = "plasticine";
  m.geometry = out;
};

ST.outMats = new Map;

ST.outlineMat = function(w) {
  const key = w.toFixed(5);
  if (ST.outMats.has(key)) return ST.outMats.get(key);
  const T2 = K.THREE;
  const m = new T2.ShaderMaterial({
    uniforms: {
      w: {
        value: w
      },
      col: {
        value: new T2.Color("#17110e")
      }
    },
    vertexShader: `uniform float w; void main(){ vec3 p = position + normalize(normal) * w; vec4 mv = vec4(p, 1.0);\n      #ifdef USE_INSTANCING\n      mv = instanceMatrix * mv;\n      #endif\n      gl_Position = projectionMatrix * modelViewMatrix * mv; }`,
    fragmentShader: "uniform vec3 col; void main(){ gl_FragColor = vec4(col, 1.0); }",
    side: T2.BackSide
  });
  ST.outMats.set(key, m);
  return m;
};

ST.outline = function(m, w) {
  const T2 = K.THREE;
  if (m.material && (Array.isArray(m.material) ? m.material[0] : m.material).transparent) return;
  let g = m.geometry.clone();
  for (const k of Object.keys(g.attributes)) if (k !== "position") g.deleteAttribute(k);
  g.clearGroups();
  g = K.BGU.mergeVertices(g, 1e-5);
  g.computeVertexNormals();
  const sc = new T2.Vector3;
  m.getWorldScale(sc);
  const ww = w / Math.max(.2, (sc.x + sc.y + sc.z) / 3);
  let o;
  if (m.isInstancedMesh) {
    o = new T2.InstancedMesh(g, ST.outlineMat(ww), m.count);
    o.instanceMatrix.copy(m.instanceMatrix);
    o.count = m.count;
  } else o = new T2.Mesh(g, ST.outlineMat(ww));
  o.userData.noMode = true;
  o.userData.outline = true;
  o.castShadow = false;
  o.receiveShadow = false;
  m.add(o);
};

ST.edgeMats = {};

ST.edges = function(m) {
  const T2 = K.THREE;
  if (m.isInstancedMesh) return;
  const mat = Array.isArray(m.material) ? m.material[0] : m.material;
  const L = mat.color ? ST.hsl(mat.color).l : .5;
  const col = L < .14 ? "#5d6468" : "#0e1011";
  if (!ST.edgeMats[col]) ST.edgeMats[col] = new T2.LineBasicMaterial({
    color: col
  });
  const e = new T2.LineSegments(new T2.EdgesGeometry(m.geometry, 62), ST.edgeMats[col]);
  e.userData.noMode = true;
  m.add(e);
};

ST.voxelize = function(root, targets, vs, into) {
  const T2 = K.THREE;
  root.updateMatrixWorld(true);
  const inv = (new T2.Matrix4).copy(root.matrixWorld).invert();
  const cells = new Map;
  const glow = new Map;
  const M2 = new T2.Matrix4, IM = new T2.Matrix4;
  const a = new T2.Vector3, b = new T2.Vector3, c = new T2.Vector3, p = new T2.Vector3;
  const tmpC = new T2.Color;
  for (const m of targets) {
    const g = m.geometry, pos = g.attributes.position, uv = g.attributes.uv, vc = g.attributes.color, idx = g.index;
    const mats2 = Array.isArray(m.material) ? m.material : [ m.material ];
    const groups = g.groups.length ? g.groups : [ {
      start: 0,
      count: idx ? idx.count : pos.count,
      materialIndex: 0
    } ];
    const inst = m.isInstancedMesh ? m.count : 1;
    for (let ii = 0; ii < inst; ii++) {
      M2.multiplyMatrices(inv, m.matrixWorld);
      if (m.isInstancedMesh) {
        m.getMatrixAt(ii, IM);
        M2.multiply(IM);
      }
      for (const gr of groups) {
        const mat = mats2[gr.materialIndex] || mats2[0];
        if (!mat || mat.isShadowMaterial) continue;
        const img = mat.map && mat.map.image && mat.map.image.getContext ? ST.imgData(mat.map.image) : null;
        const rep = mat.map ? mat.map.repeat : null, off = mat.map ? mat.map.offset : null;
        const base = mat.color || new T2.Color(1, 1, 1);
        const em = mat.emissive && (mat.emissive.r + mat.emissive.g + mat.emissive.b) * (mat.emissiveIntensity ?? 1) > .5;
        const end = Math.min(gr.start + gr.count, idx ? idx.count : pos.count);
        for (let t = gr.start; t + 2 < end; t += 3) {
          const i0 = idx ? idx.getX(t) : t, i1 = idx ? idx.getX(t + 1) : t + 1, i2 = idx ? idx.getX(t + 2) : t + 2;
          a.fromBufferAttribute(pos, i0).applyMatrix4(M2);
          b.fromBufferAttribute(pos, i1).applyMatrix4(M2);
          c.fromBufferAttribute(pos, i2).applyMatrix4(M2);
          const e = Math.max(a.distanceTo(b), b.distanceTo(c), c.distanceTo(a));
          const n = Math.max(1, Math.ceil(e / (vs * .5)));
          let cr = base.r, cg = base.g, cb = base.b;
          if (vc) {
            cr *= vc.getX(i0);
            cg *= vc.getY(i0);
            cb *= vc.getZ(i0);
          }
          for (let i = 0; i <= n; i++) for (let j = 0; j <= n - i; j++) {
            const u = i / n, v = j / n;
            p.copy(a).addScaledVector(b.clone().sub(a), u).addScaledVector(c.clone().sub(a), v);
            let r = cr, gg = cg, bb = cb;
            if (img && uv) {
              const w0 = 1 - u - v;
              let tu = uv.getX(i0) * w0 + uv.getX(i1) * u + uv.getX(i2) * v;
              let tv = uv.getY(i0) * w0 + uv.getY(i1) * u + uv.getY(i2) * v;
              tu = tu * rep.x + off.x;
              tv = tv * rep.y + off.y;
              tu -= Math.floor(tu);
              tv -= Math.floor(tv);
              const px = Math.min(img.width - 1, Math.floor(tu * img.width)), py = Math.min(img.height - 1, Math.floor((1 - tv) * img.height));
              const k = (py * img.width + px) * 4;
              r *= ST.lut[img.data[k]];
              gg *= ST.lut[img.data[k + 1]];
              bb *= ST.lut[img.data[k + 2]];
            }
            const key = Math.floor(p.x / vs) + "," + Math.floor(p.y / vs) + "," + Math.floor(p.z / vs);
            const tgt = em ? glow : cells;
            let cell = tgt.get(key);
            if (!cell) {
              cell = [ 0, 0, 0, 0 ];
              tgt.set(key, cell);
            }
            if (em) {
              cell[0] += mat.emissive.r;
              cell[1] += mat.emissive.g;
              cell[2] += mat.emissive.b;
            } else {
              cell[0] += r;
              cell[1] += gg;
              cell[2] += bb;
            }
            cell[3]++;
          }
        }
      }
    }
    m.parent && m.parent.remove(m);
  }
  const make = (map, mat) => {
    if (!map.size) return null;
    const geo = new T2.BoxGeometry(vs, vs, vs);
    const im = new T2.InstancedMesh(geo, mat, map.size);
    const d = new T2.Object3D;
    let i = 0;
    for (const [key, v] of map) {
      const [x, y, z] = key.split(",").map(Number);
      d.position.set((x + .5) * vs, (y + .5) * vs, (z + .5) * vs);
      d.updateMatrix();
      im.setMatrixAt(i, d.matrix);
      const j = .94 + ST.hash3(x, y, z) * .12;
      tmpC.setRGB((v[0] / v[3] * .9 + .012) * j, (v[1] / v[3] * .9 + .012) * j, (v[2] / v[3] * .9 + .012) * j);
      im.setColorAt(i, tmpC);
      i++;
    }
    im.instanceMatrix.needsUpdate = true;
    if (im.instanceColor) im.instanceColor.needsUpdate = true;
    return im;
  };
  const vox = make(cells, new T2.MeshStandardMaterial({
    roughness: .82,
    metalness: .04
  }));
  const lit = make(glow, new T2.MeshBasicMaterial);
  const dst = into || root;
  if (vox) {
    vox.castShadow = vox.receiveShadow = true;
    vox.userData.voxels = cells.size;
    dst.add(vox);
  }
  if (lit) dst.add(lit);
  return cells.size + glow.size;
};

ST.post = function(root, style, ctx, o = {}) {
  const P2 = ST.CTX[ctx];
  root.updateMatrixWorld(true);
  const targets = [];
  const scope = o.scope || root;
  scope.traverse((m => {
    if (m.isMesh && !ST.skipped(m)) targets.push(m);
  }));
  if (style === "field") return root;
  if (style === "block") {
    let vs = P2.vox;
    if (!vs) {
      const b = (new K.THREE.Box3).setFromObject(scope);
      const s = b.getSize(new K.THREE.Vector3);
      vs = Math.max(s.x, s.z) / 112;
    }
    root.userData.voxels = ST.voxelize(root, targets, vs, o.into);
    root.userData.voxelSize = vs;
    return root;
  }
  for (const m of targets) {
    m.material = Array.isArray(m.material) ? m.material.map((x => ST.convMat(x, style))) : ST.convMat(m.material, style);
    if (style === "shard") ST.facet(m, P2); else if (style === "signal") ST.vector(m); else if (style === "plasticine") ST.lump(m, P2);
  }
  if (style === "ink") for (const m of targets) ST.outline(m, P2.line);
  if (style === "signal") for (const m of targets) ST.edges(m);
  return root;
};

ST.build = function(style, ctx, fn, o = {}) {
  const ps = K.style, pc = K.ctx;
  K.style = style;
  K.ctx = ctx;
  let obj;
  try {
    obj = fn();
  } finally {
    K.style = ps;
    K.ctx = pc;
  }
  let root = obj;
  if (ctx === "gun" && o.prop !== false) {
    const s = ST.GUNPROP[style];
    root = new K.THREE.Group;
    root.add(obj);
    obj.scale.set(s[0], s[1], s[2]);
    root.userData = obj.userData;
  }
  if (ctx === "map") {
    const k = ST.MAPPROP[style];
    const [surface, overlay, labels] = obj.children;
    surface.scale.y = k;
    overlay.scale.y = k;
    labels.children.forEach((sp => {
      sp.position.y *= k;
    }));
    ST.post(obj, style, ctx, {
      scope: surface
    });
  } else ST.post(root, style, ctx);
  root.userData.style = style;
  if (ctx !== "map") K.shadowAll(root); else K.shadowAll(obj.children[0]);
  root.traverse((m => {
    if (m.userData && m.userData.outline) {
      m.castShadow = false;
      m.receiveShadow = false;
    }
  }));
  return root;
};

var G = {};

var V3 = (x, y, z) => new K.THREE.Vector3(x, y, z);

G.side = function(pts, w, mat, x = 0, y = 0, z = 0, bevel = .0015, holes) {
  const m = K.prof(pts, w, mat, bevel, holes);
  m.position.set(x, y, z);
  return m;
};

G.curvedMag = function(o) {
  const w = o.w ?? .055, len = o.len ?? .2, d = o.d ?? .026, R = o.R ?? .42, steps = 10;
  const ang = len / R, rear = [], front = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps * ang;
    rear.push([ R - R * Math.cos(t), -R * Math.sin(t) ]);
    front.push([ R - (R - w) * Math.cos(t), -(R - w) * Math.sin(t) ]);
  }
  const g = new K.THREE.Group;
  g.add(K.prof(rear.concat(front.reverse()), d, o.mat, .002));
  if (o.ribs !== false) {
    for (let k = 1; k <= 3; k++) {
      const t = k / 4 * ang;
      const r = K.box(w * .92, .004, d + .003, o.ribMat || o.mat);
      r.position.set(R - (R - w * .5) * Math.cos(t), -(R - w * .5) * Math.sin(t), 0);
      r.rotation.z = t;
      g.add(r);
    }
  }
  const tEnd = ang;
  const fp = K.box(w + .006, .008, d + .006, o.plateMat || o.mat, .002);
  fp.position.set(R - (R - w / 2) * Math.cos(tEnd), -(R - w / 2) * Math.sin(tEnd), 0);
  fp.rotation.z = tEnd;
  g.add(fp);
  return g;
};

G.straightMag = function(o) {
  const w = o.w ?? .06, len = o.len ?? .18, d = o.d ?? .024, lean = o.lean ?? .02;
  const pts = [ [ 0, 0 ], [ w, 0 ], [ w + lean, -len ], [ lean, -len ] ];
  const g = K.grp(K.prof(pts, d, o.mat, .002));
  const fp = K.box(w + .008, .01, d + .006, o.plateMat || o.mat, .002);
  fp.position.set(lean + w / 2, -len, 0);
  g.add(fp);
  if (o.window) {
    const wnd = K.box(.008, len * .6, .001, K.P.glass());
    wnd.position.set(w * .5 + lean * .5, -len * .5, d / 2 + .002);
    g.add(wnd);
  }
  return g;
};

G.drum = function(o) {
  const r = o.r ?? .065, d = o.d ?? .07, mat = o.mat;
  const g = new K.THREE.Group;
  const neck = K.box(.05, .06, .024, mat, .004);
  neck.position.set(.025, -.03, 0);
  const body = K.cylZ(r, d, mat, 28);
  body.position.set(.03, -.06 - r, 0);
  const cap = K.cylZ(r * .35, d + .01, o.capMat || mat, 16);
  cap.position.copy(body.position);
  g.add(neck, body, cap);
  return g;
};

G.tapeWrap = function(len, r, mat, x = 0, y = 0, z = 0, axis = "y", rx) {
  const m = K.cyl(r, r, len, mat, 10);
  m.position.set(x, y, z);
  if (axis === "x") m.rotation.z = Math.PI / 2;
  if (axis === "z") m.rotation.x = Math.PI / 2;
  if (rx) m.rotation.x = rx;
  return m;
};

G.grip = function(o) {
  const len = o.len ?? .105, a = o.angle ?? .32, w = o.w ?? .032, t = o.t ?? .03;
  const dx = Math.sin(a) * len, dy = Math.cos(a) * len;
  const pts = [ [ 0, 0 ], [ w, 0 ], [ w - dx + .004, -dy ], [ -dx - .002, -dy + .004 ] ];
  const g = K.grp(K.prof(pts, t, o.mat, .004));
  if (o.tape) {
    for (let i = 0; i < 4; i++) {
      const tw = K.box(w + .006, .012, t + .006, o.tape, .002);
      tw.position.set(w / 2 - dx * (.2 + i * .2), -dy * (.2 + i * .2), 0);
      tw.rotation.z = a;
      g.add(tw);
    }
  }
  return g;
};

G.trigGuard = function(x0, x1, depth, mat, w = .006) {
  const g = new K.THREE.Group;
  const bot = K.box(x1 - x0, .004, w, mat);
  bot.position.set((x0 + x1) / 2, -depth, 0);
  const front = K.box(.004, depth, w, mat);
  front.position.set(x1, -depth / 2, 0);
  const trig = K.box(.004, depth * .7, .005, mat);
  trig.position.set(x0 + (x1 - x0) * .45, -depth * .4, 0);
  trig.rotation.z = .25;
  g.add(bot, front, trig);
  return g;
};

G.scope = function(o) {
  const len = o.len ?? .3, tr = o.tr ?? .0127, obj = o.obj ?? .024, eye = o.eye ?? .02, mat = o.mat || K.P.blued();
  const pts = [ [ 1e-4, 0 ], [ eye, 0 ], [ eye, .06 ], [ tr, .1 ], [ tr, len - .09 ], [ obj, len - .035 ], [ obj, len ], [ 1e-4, len ] ];
  const body = K.lathe(pts, mat, 22);
  body.rotation.z = -Math.PI / 2;
  const g = K.grp(body);
  const lensF = K.cylX(obj * .85, .002, K.P.glass(), 20);
  lensF.position.x = len + .001;
  const lensR = K.cylX(eye * .8, .002, K.P.glass(), 20);
  lensR.position.x = -.001;
  g.add(lensF, lensR);
  if (o.turrets !== false) {
    const tt = K.cyl(.011, .011, .022, mat, 16);
    tt.position.set(len * .5, tr + .01, 0);
    const ts = K.cylZ(.011, .022, mat, 16);
    ts.position.set(len * .5, 0, tr + .01);
    g.add(tt, ts);
  }
  if (o.rubber) {
    const rb = K.cylX(eye + .002, .03, K.P.rubber(), 18);
    rb.position.x = .015;
    g.add(rb);
  }
  if (o.sunshade) {
    const s = K.cylX(obj + .001, o.sunshade, mat, 20);
    s.position.x = len + o.sunshade / 2;
    g.add(s);
  }
  const ringH = o.ringH ?? .02;
  for (const fx of [ .32, .68 ]) {
    const ring = K.tor(tr + .003, .004, mat, Math.PI * 2, 6, 16);
    ring.rotation.y = Math.PI / 2;
    ring.position.set(len * fx, 0, 0);
    const post = K.box(.016, ringH, .014, mat);
    post.position.set(len * fx, -tr - ringH / 2, 0);
    g.add(ring, post);
  }
  g.userData.below = tr + ringH;
  return g;
};

G.redDot = function(mat = K.P.poly()) {

G.magnifier = function(mat = K.P.poly()) {

G.thermal = function(mat = K.P.poly()) {

G.light = function(mat = K.P.poly(), len = .1) {

  const b = K.cylX(.013, len, mat, 16);

CH.limb = function(a, b, r1, r2, mat, kind = "thigh", caps = true) {
  const T2 = T3();
  const st = K.style;
  const g = new T2.Group;
  const d = (new T2.Vector3).subVectors(b, a);
  const len = d.length();
  const [bul, pk] = CH.BULGE[kind] || [ .1, .3 ];
  const prof = (bf, steps) => {
    const pts = [];
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      pts.push([ (r1 + (r2 - r1) * t) * (1 + bul * bf * Math.exp(-Math.pow((t - pk) / .25, 2))), t * len ]);
    }
    return pts;
  };
  let mesh, capR = true;
  if (st === "field") mesh = K.lathe(prof(1, 10), mat, 18); else if (st === "shard") mesh = K.lathe(prof(1.4, 4), mat, 6); else if (st === "ink") mesh = K.lathe(prof(2.2, 10), mat, 14); else if (st === "vinyl" || st === "plasticine") {
    const rr = Math.max(r1, r2) * .98;
    mesh = new T2.Mesh(new T2.CapsuleGeometry(rr, Math.max(.001, len - rr * .4), 6, K.seg(16)), mat);
    mesh.geometry.translate(0, len / 2, 0);
    capR = false;
  } else if (st === "signal") {
    mesh = new T2.Mesh(new T2.CylinderGeometry(r2 * .6, r1, len, 6, 1, true), mat);
    mesh.geometry.translate(0, len / 2, 0);
  } else {
    mesh = new T2.Mesh(new T2.BoxGeometry(r1 * 1.8, len, r1 * 1.8), mat);
    mesh.geometry.translate(0, len / 2, 0);
    capR = false;
  }
  CH.orient(mesh, a, b);
  g.add(mesh);
  if (caps && capR) {
    const s1 = K.sph(r1 * (st === "signal" ? .9 : 1), mat, 14, 10);
    s1.position.copy(a);
    const s2 = K.sph(r2 * (st === "signal" ? .62 : 1), mat, 14, 10);
    s2.position.copy(b);
    g.add(s1, s2);
  }
  if (caps && st === "block") {
    const j = K.box(r2 * 2, r2 * 2, r2 * 2, mat);
    j.position.copy(b);
    g.add(j);
  }
  return g;
};

CH.orient = function(obj, a, b, up) {
  const T2 = T3();
  const d = (new T2.Vector3).subVectors(b, a).normalize();
  obj.position.copy(a);
  obj.quaternion.setFromUnitVectors(new T2.Vector3(0, 1, 0), d);
  if (up) obj.rotateY(up);
  return obj;
};

CH.ik = function(S, H2, L1, L2, pole) {
  const T2 = T3();
  const sh = (new T2.Vector3).subVectors(H2, S);
  let d = sh.length();
  const maxd = (L1 + L2) * .999;
  if (d > maxd) {
    sh.setLength(maxd);
    d = maxd;
    H2 = S.clone().add(sh);
  }
  const dir = sh.clone().normalize();
  const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
  const p = pole.clone().sub(dir.clone().multiplyScalar(pole.dot(dir))).normalize();
  const E = S.clone().addScaledVector(dir, a).addScaledVector(p, h);
  return {
    E: E,
    H: H2
  };
};

CH.toWorld = function(grp, x, y, z) {
  grp.updateWorldMatrix(true, false);
  return CH.v(x, y, z).applyMatrix4(grp.matrixWorld);
};

CH.rig = function(c) {
  const T2 = T3();
  const P2 = Object.assign({
    yaw: -.6,
    lean: .12,
    drop: .05,
    headYaw: .55,
    headPitch: .12,
    stance: "aim",
    scale: 1,
    bulk: 1,
    shoulder: .2
  }, c.pose || {});
  const C = Object.assign({}, CH.CANON[c.canon || K.style] || CH.CANON.field, c.prop || {});
  if (P2.legBulk) C.limbL *= 1 + (P2.legBulk - 1) * (C.limbL > 1.3 ? .35 : 1);
  const root = new T2.Group;
  const body = new T2.Group;
  root.add(body);
  const legLen = C.thigh + C.shin;
  const pelvisY = .1 * C.feet + legLen * .985 + .04 - P2.drop * legLen / .89;
  const pelvis = new T2.Group;
  pelvis.position.set(0, pelvisY, 0);
  pelvis.rotation.y = P2.yaw * .45;
  body.add(pelvis);
  const torso = new T2.Group;
  torso.position.set(0, .06 * C.tl, 0);
  torso.rotation.set(P2.lean, P2.yaw * .55, 0, "YXZ");
  torso.scale.set(C.tw, C.tl, C.td);
  pelvis.add(torso);
  const head = new T2.Group;
  body.add(head);
  torso.updateWorldMatrix(true, false);
  head.position.copy(CH.v(0, .51, .01).applyMatrix4(torso.matrixWorld));
  const tq = new T2.Quaternion;
  torso.getWorldQuaternion(tq);
  head.quaternion.copy(tq).multiply((new T2.Quaternion).setFromEuler(new T2.Euler(P2.headPitch, P2.headYaw, P2.headRoll || 0, "YXZ")));
  head.scale.setScalar(C.head);
  return {
    root: root,
    body: body,
    pelvis: pelvis,
    torso: torso,
    head: head,
    P: P2,
    C: C,
    S: P2.scale
  };
};

CH.legs = function(r, m, feet) {
  const {body: body, pelvis: pelvis, C: C} = r;
  const out = {};
  for (const s of [ -1, 1 ]) {
    const hip = CH.toWorld(pelvis, s * .095 * C.tw * (K.style === "signal" ? .85 : 1), -.04, 0);
    const f = feet[s < 0 ? 1 : 0];
    const ankle = CH.v(f[0] * Math.min(1.2, C.tw), .1 * C.feet, f[1] * Math.min(1.2, (C.thigh + C.shin) / .89 + .1));
    const pole = CH.v(s * .15, 0, 1);
    const {E: knee} = CH.ik(hip, ankle, C.thigh, C.shin, pole);
    const lb = C.limbL;
    body.add(CH.limb(hip, knee, .085 * lb, .064 * lb, m.bottom, "thigh"));
    body.add(CH.limb(knee, ankle, .062 * lb, .048 * lb, m.bottom, "shin"));
    const boot = CH.boot(m.boot, m.sole, C.feet);
    boot.position.copy(ankle);
    boot.rotation.y = f[2] || 0;
    body.add(boot);
    out[s < 0 ? "R" : "L"] = {
      hip: hip,
      knee: knee,
      ankle: ankle,
      boot: boot
    };
    if (m.kneepad) {
      const kp = K.box(.1 * lb, .11 * lb, .05, m.kneepad, .025);
      kp.position.copy(knee).addScaledVector(CH.v(0, 0, 1), .055 * lb);
      kp.lookAt(knee.clone().addScaledVector(CH.v(0, 0, 1), 1));
      body.add(kp);
    }
  }
  r.legs = out;
  return out;
};

CH.arms = function(r, m, handL, handR, o = {}) {
  const {body: body, torso: torso, P: P2, C: C} = r;
  const res = {};
  for (const s of [ -1, 1 ]) {
    const S = CH.toWorld(torso, s * P2.shoulder, .375, 0);
    const H2 = s < 0 ? handR : handL;
    const pole = s < 0 ? o.poleR || CH.v(-.8, -.9, -.3) : o.poleL || CH.v(.6, -1, -.2);
    const {E: E, H: H22} = CH.ik(S, H2, C.upper, C.fore, pole);
    const la = P2.bulk * C.limbA;
    body.add(CH.limb(S, E, .058 * la, .048 * la, m.sleeve || m.top, "upper"));
    body.add(CH.limb(E, H22, .046 * la, .038 * la, m.sleeve || m.top, "fore"));
    if (m.cuff) {
      const cf = K.cyl(.042 * la, .042 * la, .03, m.cuff, 12);
      CH.orient(cf, E.clone().lerp(H22, .82), H22);
      body.add(cf);
    }
    const hand = CH.hand(m.glove, C.hands);
    const d = H22.clone().sub(E).normalize();
    hand.position.copy(H22).addScaledVector(d, -.005);
    hand.quaternion.setFromUnitVectors(CH.v(0, 1, 0), d);
    hand.rotateY(s < 0 ? .9 : -.6);
    body.add(hand);
    if (m.elbowpad) {
      const ep = K.sph(.05 * la, m.elbowpad, 10, 8);
      ep.position.copy(E);
      ep.scale.set(1, 1, .8);
      body.add(ep);
    }
    res[s < 0 ? "R" : "L"] = {
      S: S,
      E: E,
      H: H22
    };
  }
  r.arms = res;
  return res;
};

CH.mountGun = function(r, gun, o = {}) {
  const T2 = T3();
  const {body: body, torso: torso} = r;
  const D = (o.dir || CH.v(.02, -.08, 1)).clone().normalize();
  const upW = CH.v(0, 1, 0);
  const up = upW.clone().sub(D.clone().multiplyScalar(D.dot(upW))).normalize();
  if (o.roll) up.applyAxisAngle(D, o.roll);
  const z = (new T2.Vector3).crossVectors(D, up);
  const mtx = (new T2.Matrix4).makeBasis(D, up, z);
  gun.quaternion.setFromRotationMatrix(mtx);
  gun.updateMatrixWorld(true);
  const bb = (new T2.Box3).setFromObject(gun);
  const ud = gun.userData;
  let anchorLocal, anchorWorld;
  if (o.butt) {
    const g2 = gun.clone();
    g2.position.set(0, 0, 0);
    g2.quaternion.identity();
    g2.updateMatrixWorld(true);
    const bl = (new T2.Box3).setFromObject(g2);
    anchorLocal = CH.v(bl.min.x + .01, ud.buttY ?? 0, 0);
    anchorWorld = o.butt;
  } else {
    anchorLocal = ud.grip.clone();
    anchorWorld = o.hand;
  }
  const rotA = anchorLocal.clone().applyQuaternion(gun.quaternion);
  gun.position.copy(anchorWorld).sub(rotA);
  body.add(gun);
  gun.updateMatrixWorld(true);
  const gw = p => p.clone().applyMatrix4(gun.matrixWorld);
  return {

    fore: gw(ud.fore)

};

CH.plateCarrier = function(t, m, o = {}) {
  const w = o.w ?? .3, h = o.h ?? .33, y = o.y ?? .27, front = o.front ?? .13;
  const T2 = T3();
  const g = new T2.Group;
  const f = K.box(w, h, .05, m.vest, .02);
  f.position.set(0, y, front);
  const b = K.box(w + .02, h + .02, .05, m.vest, .02);
  b.position.set(0, y, -front);
  g.add(f, b);
  for (const s of [ -1, 1 ]) {
    const strap = K.box(.06, .03, front * 2, m.vest, .01);
    strap.position.set(s * .11, y + h / 2 - .005, 0);
    g.add(strap);
    const cum = K.box(.04, h * .5, front * 1.6, m.vest, .015);
    cum.position.set(s * (w / 2 + .015), y - h * .18, 0);
    g.add(cum);
  }
  t.add(g);
  return g;
};

CH.pouch = function(w, h, d, mat, flap) {
  const g = new K.THREE.Group;
  const b = K.box(w, h, d, mat, Math.min(w, h, d) * .25);
  g.add(b);
  if (flap) {
    const f = K.box(w * 1.02, h * .28, d * 1.06, flap === true ? mat : flap, .008);
    f.position.y = h * .38;
    g.add(f);
  }
  return g;
};

CH.magPouches = function(t, n, x0, y, z, mat, dx = .07, o = {}) {
  for (let i = 0; i < n; i++) {
    const p = CH.pouch(.06, o.h ?? .12, .05, mat, o.flap);
    p.position.set(x0 + i * dx, y, z);
    if (o.mags) {
      const mg = K.box(.05, .05, .026, o.mags, .006);
      mg.position.set(0, .08, 0);
      p.add(mg);

  }
};

CH.stripeTex = function(cols, n = 6, angle = 1, size = 128) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const x = c.getContext("2d");
  x.fillStyle = cols[0];
  x.fillRect(0, 0, size, size);
  x.save();
  x.translate(size / 2, size / 2);
  x.rotate(angle);
  x.translate(-size, -size);
  const w = size * 2 / n;
  for (let i = 0; i < n * 2; i += 2) {
    x.fillStyle = cols[1];
    x.fillRect(i * w / 2 * 1, 0, w / 2, size * 2);
  }
  x.restore();
  const r = K.rng(5);
  x.globalAlpha = .25;
  for (let i = 0; i < 260; i++) {
    x.fillStyle = r() < .5 ? "#2a2a2a" : "#8a8a8a";
    x.fillRect(r() * size, r() * size, 1 + r() * 4, 1 + r() * 3);
  }
  const t = new K.THREE.CanvasTexture(c);
  t.colorSpace = K.THREE.SRGBColorSpace;
  return t;
};

CH.quiltTex = function(base, line, size = 128) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const x = c.getContext("2d");
  x.fillStyle = base;
  x.fillRect(0, 0, size, size);
  x.strokeStyle = line;
  x.lineWidth = 2;
  for (let i = 0; i < size; i += 16) {
    x.beginPath();
    x.moveTo(0, i + .5);
    x.lineTo(size, i + .5);
    x.stroke();
  }
  const g = x.createLinearGradient(0, 0, 0, 16);
  const t = new K.THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = K.THREE.RepeatWrapping;
  t.repeat.set(2, 3);
  t.colorSpace = K.THREE.SRGBColorSpace;
  return t;
};

CH.mapTex = function() {
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const x = c.getContext("2d");
  x.fillStyle = "#d9d2bb";
  x.fillRect(0, 0, 128, 128);
  x.strokeStyle = "#7a8c99";
  x.lineWidth = 6;
  x.beginPath();
  x.moveTo(0, 90);
  x.bezierCurveTo(40, 70, 70, 110, 128, 80);
  x.stroke();
  x.strokeStyle = "#8d8676";
  x.lineWidth = 1.5;
  for (let i = 0; i < 9; i++) {
    x.beginPath();
    x.moveTo(i * 16, 0);
    x.lineTo(i * 16 + 10, 128);
    x.stroke();
  }
  x.fillStyle = "#9a9483";
  for (let i = 0; i < 14; i++) x.fillRect(i * 37 % 120, i * 53 % 70, 8, 6);
  x.strokeStyle = "#e0531c";
  x.lineWidth = 2.5;
  x.beginPath();
  x.moveTo(20, 20);
  x.lineTo(60, 50);
  x.lineTo(100, 40);
  x.stroke();
  x.fillStyle = "#e0531c";
  x.beginPath();
  x.arc(100, 40, 5, 0, 7);
  x.fill();
  const t = new K.THREE.CanvasTexture(c);
  t.colorSpace = K.THREE.SRGBColorSpace;
  return t;
};

CH.finish = function(r, info) {
  const C = r.C;
  if (C && (C.tw !== 1 || C.td !== 1)) {
    for (const ch of r.pelvis.children) {
      if (ch === r.torso || ch.userData.hips) continue;
      ch.position.x *= C.tw;
      ch.position.z *= C.td;
      if (ch.userData.belt) ch.scale.set(C.tw, 1, C.td);
    }
  }
  if (C) r.root.userData.canon = C.label;
  K.shadowAll(r.root);
  r.root.userData = Object.assign({
    canon: C ? C.label : ""
  }, info);
  return r.root;
};

CH.octagon = function(r) {
  const pts = [];
  for (let i = 0; i < 8; i++) {
    const a = Math.PI / 8 + i / 8 * Math.PI * 2;
    pts.push([ Math.cos(a) * r, Math.sin(a) * r ]);
  }
  return pts;
};

LV.canvasTex = function(w, h, draw, rep) {
  const c = document.createElement("canvas");
  c.width = w;
  c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new K.THREE.CanvasTexture(c);
  t.colorSpace = K.THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = K.THREE.RepeatWrapping;
  if (rep) t.repeat.set(rep[0], rep[1]);
  t.anisotropy = 4;
  return t;
};

LV.facadeTex = function(base, win, lit, seed = 1, cols = 4, rows = 4) {
  const r = K.rng(seed);
  return LV.canvasTex(128, 128, ((x, w, h) => {
    x.fillStyle = base;
    x.fillRect(0, 0, w, h);
    const cw = w / cols, ch = h / rows;
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const on = lit && r() < lit;
      x.fillStyle = on ? "#e8b25a" : win;
      x.fillRect(i * cw + cw * .22, j * ch + ch * .25, cw * .56, ch * .5);
    }
    x.fillStyle = "rgba(0,0,0,0.12)";
    for (let j = 0; j < rows; j++) x.fillRect(0, j * ch + ch * .82, w, 2);
  }));
};

LV.scaleBoxUV = function(geo, w, h, d, unit) {
  const uv = geo.attributes.uv;
  const dims2 = [ [ d, h ], [ d, h ], [ w, d ], [ w, d ], [ w, h ], [ w, h ] ];
  for (let f = 0; f < 6; f++) {
    const [a, b] = dims2[f];
    for (let k = 0; k < 4; k++) {
      const i = f * 4 + k;
      uv.setXY(i, uv.getX(i) * a / unit, uv.getY(i) * b / unit);
    }
  }
  uv.needsUpdate = true;
};

AU.init = function() {
  if (AU.ctx) {
    if (AU.ctx.state === "suspended") AU.ctx.resume();
    return true;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return false;
  const c = AU.ctx = new AC;
  AU.noise = c.createBuffer(1, c.sampleRate * 2, c.sampleRate);
  const d = AU.noise.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  AU.in = c.createGain();
  AU.helmetLP = c.createBiquadFilter();
  AU.helmetLP.type = "lowpass";
  AU.helmetLP.frequency.value = 2e4;
  AU.comp = c.createDynamicsCompressor();
  AU.comp.threshold.value = 0;
  AU.comp.ratio.value = 1;
  AU.comp.knee.value = 6;
  AU.comp.attack.value = .002;
  AU.comp.release.value = .15;
  AU.makeup = c.createGain();
  AU.out = c.createGain();
  AU.out.gain.value = .9;
  AU.an = c.createAnalyser();
  AU.an.fftSize = 2048;
  AU.in.connect(AU.helmetLP).connect(AU.comp).connect(AU.makeup).connect(AU.out).connect(AU.an).connect(c.destination);
  AU.rev = {
    out: AU.ir(2.6, .5, 2200, .35),
    in: AU.ir(.7, .08, 6e3, .9)
  };
  for (const k in AU.rev) {
    const cv = c.createConvolver();
    cv.buffer = AU.rev[k];
    AU.rev[k] = cv;
    cv.connect(AU.in);
  }
  AU.setListener();
  return true;
};

AU.ir = function(dur, pre, lp, density) {
  const c = AU.ctx, n = Math.floor(c.sampleRate * dur), b = c.createBuffer(2, n, c.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const x = b.getChannelData(ch);
    let lpState = 0;
    const a = Math.exp(-2 * Math.PI * lp / c.sampleRate);
    for (let i = 0; i < n; i++) {
      const t = i / c.sampleRate;
      const env = t < pre ? Math.random() < .002 ? 1 : 0 : Math.pow(1 - (t - pre) / (dur - pre), 2.5);
      const v = (Math.random() * 2 - 1) * env * (Math.random() < density ? 1 : .15);
      lpState = (1 - a) * v + a * lpState;
      x[i] = lpState;
    }
  }
  return b;
};

AU.setListener = function() {
  if (!AU.ctx) return;
  const t = AU.ctx.currentTime;
  AU.helmetLP.frequency.setTargetAtTime(AU.helmet ? 2600 : 2e4, t, .05);
  AU.comp.threshold.setTargetAtTime(AU.headset ? -38 : 0, t, .05);
  AU.comp.ratio.setTargetAtTime(AU.headset ? 9 : 1, t, .05);
  AU.makeup.gain.setTargetAtTime(AU.headset ? 2.6 : 1, t, .05);
  AU.out.gain.setTargetAtTime(AU.P[AU.pal].master, t, .05);
};

AU.src = function(when, dur, rate = 1) {
  const s = AU.ctx.createBufferSource();
  s.buffer = AU.noise;
  s.playbackRate.value = rate;
  s.start(when, Math.random() * 1.5, dur + .05);
  return s;
};

AU.env = function(g, when, a, peak, d, curve = "exp") {
  g.gain.setValueAtTime(1e-4, when);
  g.gain.linearRampToValueAtTime(peak, when + a);
  if (curve === "exp") g.gain.exponentialRampToValueAtTime(1e-4, when + a + d); else g.gain.linearRampToValueAtTime(0, when + a + d);
};

AU.filt = function(type, f, q = .7) {
  const b = AU.ctx.createBiquadFilter();
  b.type = type;
  b.frequency.value = f;
  b.Q.value = q;
  return b;
};

AU.osc = function(type, f, when, dur) {
  const o = AU.ctx.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(f, when);
  o.start(when);
  o.stop(when + dur + .05);
  return o;
};

AU.pan = function(p) {
  const n = AU.ctx.createStereoPanner ? AU.ctx.createStereoPanner() : AU.ctx.createGain();
  if (n.pan) n.pan.value = p;
  return n;
};

AU.bus = function(dist, space, when, pan = 0) {
  const P2 = AU.P[AU.pal], c = AU.ctx;
  const g = c.createGain();
  const lev = Math.pow(1 / (1 + dist / 25), P2.exp);
  g.gain.value = lev;
  const lp = AU.filt("lowpass", Math.max(500, 16e3 * Math.exp(-dist * P2.hf / 420)), .5);
  const dry = c.createGain(), wet = c.createGain();
  const wetAmt = Math.min(.95, P2.wet * (space === "in" ? 1.4 : .6 + dist / 300));
  dry.gain.value = 1 - wetAmt * .6;
  wet.gain.value = wetAmt * P2.tail;
  const delay = c.createDelay(2);
  delay.delayTime.value = Math.min(1.5, dist / 343 * P2.pre);
  const pn = AU.pan(pan);
  g.connect(lp).connect(delay).connect(pn);
  pn.connect(dry).connect(AU.in);
  pn.connect(wet).connect(space === "in" ? AU.rev.in : AU.rev.out);
  return g;
};

AU.gunshot = function(dist = 5, space = "out", supp = false, when) {
  const c = AU.ctx, t = when ?? c.currentTime + .02, P2 = AU.P[AU.pal];
  const bus = AU.bus(dist, space, t, dist > 50 ? .35 : 0);
  const k = supp ? .16 : 1;
  const tr = AU.src(t, .01, 1.5), trg = c.createGain(), trh = AU.filt("highpass", supp ? 2500 : 1200);
  AU.env(trg, t, 5e-4, 1.6 * k * P2.bright, .012);
  tr.connect(trh).connect(trg).connect(bus);
  const body = AU.src(t, .4), bg = c.createGain(), bf = AU.filt("bandpass", supp ? 700 : 900, .6);
  AU.env(bg, t, .002, supp ? .35 : 1.3, supp ? .12 : .28 * P2.tail);
  body.connect(bf).connect(bg).connect(bus);
  const th = AU.osc("sine", supp ? 90 : 70, t, .4), tg = c.createGain();
  th.frequency.exponentialRampToValueAtTime(supp ? 50 : 38, t + .25);
  AU.env(tg, t, .002, supp ? .5 : 1.4, .3);
  th.connect(tg).connect(bus);
  if (supp) {
    const cl3 = AU.src(t + .012, .02, 2), cg = c.createGain(), cf = AU.filt("bandpass", 4200, 4);
    AU.env(cg, t + .012, 5e-4, .5, .02);
    cl3.connect(cf).connect(cg).connect(bus);
  }
  if (!supp && dist > 80) {
    const cr = AU.src(t, .005, 2), cg2 = c.createGain(), cf2 = AU.filt("highpass", 3e3);
    AU.env(cg2, t, 3e-4, .4 * P2.bright, .006);
    cr.connect(cf2).connect(cg2).connect(AU.in);
  }
};

AU.crack = function() {
  const c = AU.ctx, t = c.currentTime + .02;
  const s = AU.src(t, .01, 2), g = c.createGain(), f = AU.filt("highpass", 2500);

AU.step = function(surf, t, loud = 1, dist = 4, pan = 0) {
  const c = AU.ctx, S = AU.SURF[surf], P2 = AU.P[AU.pal];
  const bus = AU.bus(dist, "out", t, pan);
  const L = S.lvl * loud * P2.foot;
  const n = S.grains || 1;
  for (let i = 0; i < n; i++) {
    const tt = t + (n > 1 ? Math.random() * .09 : 0);
    const s = AU.src(tt, S.d + .05), g = c.createGain(), f = AU.filt("bandpass", S.f * (.8 + Math.random() * .4), S.q);
    AU.env(g, tt, .003, L * (n > 1 ? .6 : 1), S.d);
    s.connect(f).connect(g).connect(bus);
  }
  if (S.splash) {
    const s = AU.src(t, .25), g = c.createGain(), f = AU.filt("bandpass", 700, 2);
    f.frequency.setValueAtTime(400, t);
    f.frequency.exponentialRampToValueAtTime(1600, t + .15);
    AU.env(g, t, .02, L * .7, .18);
    s.connect(f).connect(g).connect(bus);
  }
  if (S.thud) {
    const o = AU.osc("sine", S.thud, t, .15), g = c.createGain();
    AU.env(g, t, .002, L * .6, .1);
    o.connect(g).connect(bus);
  }
  for (const r of S.ring) {
    const o = AU.osc("sine", r * (.97 + Math.random() * .06), t, .4), g = c.createGain();
    AU.env(g, t, .001, L * .12, surf === "glass" ? .08 : .3);
    o.connect(g).connect(bus);
  }
  if (P2.tune) {
    const o = AU.osc("triangle", S.tone, t, .12), g = c.createGain();
    AU.env(g, t, .003, L * .07, .08);
    o.connect(g).connect(bus);
  }
};

AU.ambience = function(on) {
  const c = AU.ctx;
  if (AU.amb) {
    const a = AU.amb;
    a.g.gain.setTargetAtTime(0, c.currentTime, .3);
    setTimeout((() => a.nodes.forEach((n => {
      try {
        n.stop();
      } catch (e) {}
    }))), 1200);
    AU.amb = null;
  }
  if (!on) return;
  const g = c.createGain();
  g.gain.value = 0;
  g.connect(AU.in);
  const nodes = [];
  const loop = c.createBufferSource();
  loop.buffer = AU.noise;
  loop.loop = true;
  loop.start();
  const wf = AU.filt("lowpass", AU.pal === "dread" ? 300 : 700, .4);
  const wg = c.createGain();
  wg.gain.value = AU.pal === "dread" ? .25 : .4;
  const lfo = AU.osc("sine", .12, c.currentTime, 3600), lg = c.createGain();
  lg.gain.value = 250;
  lfo.connect(lg).connect(wf.frequency);
  loop.connect(wf).connect(wg).connect(g);
  nodes.push(loop, lfo);
  if (AU.pal !== "readable") {
    const hum = AU.osc("sine", AU.pal === "dread" ? 41 : 50, c.currentTime, 3600), hg = c.createGain();
    hg.gain.value = AU.pal === "dread" ? .3 : .06;
    hum.connect(hg).connect(g);
    nodes.push(hum);
  }
  if (AU.pal === "signal") {
    const st = c.createBufferSource();
    st.buffer = AU.noise;
    st.loop = true;
    st.start();
    const sf = AU.filt("bandpass", 2200, .8), sg = c.createGain();
    sg.gain.value = 0;
    const sl = AU.osc("square", .35, c.currentTime, 3600), slg = c.createGain();
    slg.gain.value = .03;
    sl.connect(slg).connect(sg.gain);
    st.connect(sf).connect(sg).connect(g);
    nodes.push(st, sl);
    const sir = AU.osc("sawtooth", 500, c.currentTime, 3600), sfl = AU.filt("lowpass", 900), sgn = c.createGain();
    sgn.gain.value = .02;
    const sm2 = AU.osc("sine", .15, c.currentTime, 3600), smg = c.createGain();
    smg.gain.value = 140;
    sm2.connect(smg).connect(sir.frequency);
    sir.connect(sfl).connect(sgn).connect(AU.bus(400, "out", c.currentTime));
    nodes.push(sir, sm2);
  }
  g.gain.setTargetAtTime(AU.pal === "dread" ? .5 : .8, c.currentTime, .6);
  AU.amb = {
    g: g,
    nodes: nodes
  };
};

function normalFrom(canvas, strength = 2, heightFn) {
  const w = canvas.width, h = canvas.height;
  const src = canvas.getContext("2d").getImageData(0, 0, w, h).data;
  const H2 = new Float32Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x;
    H2[i] = heightFn ? heightFn(x / w, y / h) : (src[i * 4] * .3 + src[i * 4 + 1] * .59 + src[i * 4 + 2] * .11) / 255;
  }
  const c = document.createElement("canvas");
  c.width = w;
  c.height = h;
  const x2 = c.getContext("2d");
  const img = x2.createImageData(w, h);
  const d = img.data;
  const at = (x, y) => H2[(y + h) % h * w + (x + w) % w];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const dx = (at(x + 1, y - 1) + 2 * at(x + 1, y) + at(x + 1, y + 1) - at(x - 1, y - 1) - 2 * at(x - 1, y) - at(x - 1, y + 1)) * strength;
    const dy = (at(x - 1, y + 1) + 2 * at(x, y + 1) + at(x + 1, y + 1) - at(x - 1, y - 1) - 2 * at(x, y - 1) - at(x + 1, y - 1)) * strength;
    const l = Math.hypot(dx, dy, 1);
    const i = (y * w + x) * 4;
    d[i] = (-dx / l * .5 + .5) * 255;
    d[i + 1] = (dy / l * .5 + .5) * 255;
    d[i + 2] = (1 / l * .5 + .5) * 255;
    d[i + 3] = 255;
  }
  x2.putImageData(img, 0, 0);
  const t = new THREE2.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE2.RepeatWrapping;
  t.anisotropy = 4;
  return t;
}

function tmat(key, o = {}) {
  const ck = key + JSON.stringify(o);
  if (cache.has(ck)) return cache.get(ck);
  const d = TX.defs[key];

    map: map,

    roughness: o.r ?? d.rough ?? .85,
    metalness: o.m ?? (d.fam === "Metal" ? .45 : .02)
  });
  if (o.normal !== false) {
    m.normalMap = normalFrom(map.userData.canvas || map.image, o.ns ?? 1.6, d.height);
    m.normalScale.set(o.nk ?? .8, o.nk ?? .8);
  }
  if (o.e) {
    m.emissive = new THREE2.Color(o.e);
    m.emissiveIntensity = o.ei ?? 1;
    m.emissiveMap = o.emap ? map : null;
  }
  m.name = key;
  cache.set(ck, m);
  return m;
}

  const c = document.createElement("canvas");
  c.width = W;
  c.height = H2;
  const x = c.getContext("2d");
  const panel = TX.get("arch_panel", seed, 1).userData.canvas;
  x.drawImage(panel, 0, 0, W, H2);
  x.fillStyle = base;
  x.globalAlpha = .35;
  x.fillRect(0, 0, W, H2);
  x.globalAlpha = 1;
  const cw = W / cols, ch = H2 / rows;
  const ec = document.createElement("canvas");
  ec.width = W;
  ec.height = H2;
  const ex = ec.getContext("2d");
  ex.fillStyle = "#000";

    x.fillStyle = "#1a2026";
    x.fillRect(wx - 2, wy - 2, ww + 4, wh + 4);
    x.fillStyle = on ? r() < .7 ? "#e0a650" : "#b8c8d0" : "#11161a";
    x.fillRect(wx, wy, ww, wh);
    x.fillStyle = "rgba(255,255,255,0.05)";

var glowT = null;

function glowTex() {
  if (glowT) return glowT;
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const x = c.getContext("2d");
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, "rgba(255,255,255,1)");
  g.addColorStop(.25, "rgba(255,255,255,0.45)");
  g.addColorStop(.6, "rgba(255,255,255,0.1)");
  g.addColorStop(1, "rgba(255,255,255,0)");
  x.fillStyle = g;
  x.fillRect(0, 0, 128, 128);
  glowT = new THREE2.CanvasTexture(c);
  return glowT;
}

function canvasTex(w, h, draw, o = {}) {
  const c = document.createElement("canvas");
  c.width = w;
  c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE2.CanvasTexture(c);
  t.colorSpace = THREE2.SRGBColorSpace;
  if (o.repeat) {
    t.wrapS = t.wrapT = THREE2.RepeatWrapping;
  }
  t.anisotropy = 8;
  return t;
}

function stencilText(text, color = "#d9dcd6", o = {}) {
  return (x, W, H2) => {
    x.clearRect(0, 0, W, H2);
    if (o.bg) {
      x.fillStyle = o.bg;
      x.fillRect(0, 0, W, H2);

    x.fillStyle = color;
    x.font = `${o.weight || 800} ${Math.round(H2 * (o.size || .6))}px ${o.font || '"Big Shoulders Stencil Display", "Big Shoulders Display", Impact, sans-serif'}`;
    x.textAlign = "center";

}

var sm = (e0, e1, x) => {
  const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
  return t * t * (3 - 2 * t);
};

var BOUNDS = {
  x0: -112,
  x1: 127,
  z0: -86,
  z1: 56
};

function heightAt(x, z) {
  let h = -3.2 * sm(56, 63, z);
  const hill = sm(-106, -122, x) * 18;
  const cut = 1 - sm(8.6, 9.6, Math.abs(z + 8));
  h += hill * (1 - cut);
  const nhill = sm(-92, -110, z) * 9;
  h += nhill;
  if (x > -86.6 && x < -77.4 && z > 47 && z < 66) h = Math.min(h, -2 * sm(49, 57, z));
  return h;
}

var REGIONS = [];

function region(x0, z0, x1, z1, surf) {
  REGIONS.push([ Math.min(x0, x1), Math.min(z0, z1), Math.max(x0, x1), Math.max(z0, z1), surf ]);
}

function surfaceAt(x, z) {
  for (let i = REGIONS.length - 1; i >= 0; i--) {
    const r = REGIONS[i];
    if (x >= r[0] && x <= r[2] && z >= r[1] && z <= r[3]) return r[4];
  }
  return "snow";
}

var G2 = 18;

function moveBody(world, b, wx, wz, dt, o = {}) {
  const accel = b.onGround ? o.accel ?? 50 : o.airAccel ?? 6;
  const dvx = wx - b.v.x, dvz = wz - b.v.z;
  const dl = Math.hypot(dvx, dvz), mx = accel * dt;
  if (dl > mx) {
    b.v.x += dvx / dl * mx;
    b.v.z += dvz / dl * mx;
  } else {
    b.v.x = wx;
    b.v.z = wz;
  }
  b.v.y -= G2 * dt;
  const step = b.step ?? .45;
  const sx = b.v.x * dt, sz = b.v.z * dt;
  const n = Math.max(1, Math.ceil(Math.hypot(sx, sz) / .2));
  const was = b.onGround;
  let landV = 0;
  for (let i = 0; i < n; i++) {
    const ox = b.p.x, oz = b.p.z;
    b.p.x += sx / n;
    b.p.z += sz / n;
    world.resolve(b.p, b.r, b.p.y, b.h, step);
    if (o.bounds) {
      b.p.x = Math.max(o.bounds.x0, Math.min(o.bounds.x1, b.p.x));
      b.p.z = Math.max(o.bounds.z0, Math.min(o.bounds.z1, b.p.z));
    }
    const ax = (b.p.x - ox) / dt * n, az = (b.p.z - oz) / dt * n;
    if (Math.abs(ax) < Math.abs(b.v.x) * .5) b.v.x *= .5;
    if (Math.abs(az) < Math.abs(b.v.z) * .5) b.v.z *= .5;
  }
  b.p.y += b.v.y * dt;
  const gr = world.ground(b.p.x, b.p.z, b.p.y, step, b.r);
  const snap = was && b.v.y <= 0 ? .55 : 0;
  if (b.p.y <= gr.y + snap && b.v.y <= .01) {
    if (!was) landV = -b.v.y;
    const dy = gr.y - b.p.y;
    if (dy > .05 && was) b.stepOff = (b.stepOff || 0) - dy;
    b.p.y = gr.y;
    b.v.y = 0;
    b.onGround = true;
    b.surf = gr.surf;
    b.groundCol = gr.col;
  } else {
    b.onGround = false;
  }
  if (b.v.y > 0) {
    const c = world.ceiling(b.p.x, b.p.z, b.p.y + b.h, b.r);
    if (c < b.p.y + b.h) {
      b.p.y = c - b.h;
      b.v.y = 0;
    }
  }
  if (b.stepOff) {
    b.stepOff *= Math.max(0, 1 - dt * 14);
    if (Math.abs(b.stepOff) < .002) b.stepOff = 0;
  }
  return landV;
}

      if (inp.down("KeyQ")) lt -= 1;

        z: -sy * Math.sign(this.lean)

  footstep(k = 1) {

      needles: .55,

      slush: 1.25,
      snow: .9,
      wood: 1.1

  g.addColorStop(.6, "rgba(255,140,60,0.25)");
  g.addColorStop(1, "rgba(255,120,40,0)");
  x.fillStyle = g;
  for (let i = 0; i < 6; i++) {
    x.rotate(Math.PI / 3);
    x.beginPath();
    x.moveTo(-6, 0);
    x.lineTo(0, -62);
    x.lineTo(6, 0);
    x.fill();
  }
  x.beginPath();
  x.arc(0, 0, 26, 0, 7);
  x.fill();
  const t = new THREE8.CanvasTexture(c);
  return t;
}

var Rig = class {

      C: C
    };

    const lb = C.limbL, la = P2.bulk * C.limbA;

        m: .25

  buildSkin() {

      const b = mats2[0].vertexColors ? {

        mat: mats2[0]
      } : bucketOf(mats2[0]);
      const outline = !!o.userData.outline || !o.castShadow;
      const key = b.key + (outline ? "|o" : "");
      const bi = bones.length;
      bones.push(o);
      const g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
      for (const k of Object.keys(g.attributes)) if (k !== "position" && k !== "normal" && k !== "uv" && k !== "color") g.deleteAttribute(k);
      const n = g.attributes.position.count;
      if (!g.attributes.normal) g.computeVertexNormals();
      if (!g.attributes.uv) g.setAttribute("uv", new THREE10.Float32BufferAttribute(new Float32Array(n * 2), 2));
      if (b.mat.vertexColors) {
        if (!g.attributes.color || b.col) {
          const c = new Float32Array(n * 3), col = b.col || {
            r: 1,
            g: 1,
            b: 1

          for (let i = 0; i < n; i++) {
            c[i * 3] = col.r;
            c[i * 3 + 1] = col.g;
            c[i * 3 + 2] = col.b;
          }
          g.setAttribute("color", new THREE10.BufferAttribute(c, 3));
        }
      } else if (g.attributes.color) g.deleteAttribute("color");
      const si = new Uint16Array(n * 4), sw = new Float32Array(n * 4);
      for (let i = 0; i < n; i++) {
        si[i * 4] = bi;
        sw[i * 4] = 1;
      }
      g.setAttribute("skinIndex", new THREE10.Uint16BufferAttribute(si, 4));

  const baoa = bax * oax + bay * oay + baz * oaz;

  let c = baba * oaoa - baoa * baoa - r * r * baba;

    if (h > 0) {
      const t2 = -b - Math.sqrt(h);
      if (t2 >= 0) return t2;
    }

function rollLoot(kind, tier = 1, rng = Math.random) {
  const tab = T[kind] || T.crate;
  const n = Math.max(1, Math.round(1 + rng() * (1.5 + tier * .9)));
  const out = [];
  const tot = tab.reduce(((s, r) => s + r[1]), 0);
  for (let i = 0; i < n; i++) {
    let r = rng() * tot;
    for (const row of tab) {
      r -= row[1];
      if (r <= 0) {
        const it = ITEMS[row[0]];
        if (!it) break;
        if (it.rare && tier < 2 && rng() < .6) break;
        out.push({
          id: row[0],
          n: row[2] ? Math.round(row[2][0] + rng() * (row[2][1] - row[2][0])) : 1
        });
        break;
      }
    }
  }
  if (kind === "body_tollman" && !out.some((o => o.id === "ledger"))) out.push({
    id: "ledger",
    n: 1
  });
  return out;
}

function itemValue(it) {
  const d = ITEMS[it.id];
  if (!d) return 0;
  return d.perRound ? Math.round(d.value * (it.n || 1)) : d.value * (it.n || 1);
}

  const sky = new THREE16.Mesh(new THREE16.SphereGeometry(10, 24, 12), new THREE16.ShaderMaterial({
    side: THREE16.BackSide,
    depthWrite: false,

    fragmentShader: "varying vec3 vP; void main(){ float h = normalize(vP).y; vec3 top = vec3(0.16,0.2,0.3); vec3 hor = vec3(0.22,0.2,0.2); vec3 gnd = vec3(0.07,0.07,0.08); vec3 c = h > 0.0 ? mix(hor, top, pow(h, 0.6)) : mix(hor, gnd, pow(-h, 0.4)); gl_FragColor = vec4(c, 1.0); }"
  }));
  sc.add(sky);
  const strip = (color, x, y, z, w, h, d, k) => {
    const m = new THREE16.Mesh(new THREE16.BoxGeometry(w, h, d), new THREE16.MeshBasicMaterial({
      color: new THREE16.Color(color).multiplyScalar(k)
    }));
    m.position.set(x, y, z);
    sc.add(m);
  };
  strip("#ffb060", 6, 3, -2, .4, 1.2, 5, 2.4);
  strip("#ffb060", -7, 2.5, 3, .4, .8, 3, 1.6);
  strip("#b8cce8", 0, 8, 0, 6, .3, 4, 1.4);
  const pm = new THREE16.PMREMGenerator(r);
  const t = pm.fromScene(sc, .02).texture;
  pm.dispose();
  return t;
}

    const stroke = P2.bleed ? P2.bleed === 2 ? "#ff3b2a" : "#cf6a5a" : P2.frac ? "#e8a33c" : "#2b3439";

function drawYard(x, W, H2, map, o = {}) {
  const B = MAPB;
  const sx = W / (B.x1 - B.x0), sz = H2 / (B.z1 - B.z0);
  const s = Math.min(sx, sz);
  const ox = (W - (B.x1 - B.x0) * s) / 2, oz = (H2 - (B.z1 - B.z0) * s) / 2;
  const P2 = (wx, wz) => [ ox + (wx - B.x0) * s, oz + (wz - B.z0) * s ];
  x.fillStyle = "#d9d2bb";
  x.fillRect(0, 0, W, H2);
  const r = K.rng(4);
  for (let i = 0; i < 900; i++) {
    x.fillStyle = `rgba(${r() < .5 ? "120,100,70" : "255,250,230"},${.04 + r() * .05})`;
    x.fillRect(r() * W, r() * H2, 1 + r() * 3, 1 + r() * 3);
  }
  x.strokeStyle = "rgba(80,70,50,0.12)";

    x.stroke();

  x.lineTo(W, H2 / 2);
  x.stroke();
  const [rx0, rz0] = P2(B.x0, 58), [rx1, rz1] = P2(B.x1, B.z1);
  x.fillStyle = "#9fb0b6";
  x.fillRect(rx0, rz0, rx1 - rx0, rz1 - rz0);
  x.fillStyle = "rgba(255,255,255,0.35)";
  for (let i = 0; i < 40; i++) {
    const [a, b2] = P2(B.x0 + r() * 260, 64 + r() * 34);
    x.beginPath();
    x.ellipse(a, b2, 6 + r() * 14, 3 + r() * 5, r() * 3, 0, 7);
    x.fill();
  }
  const [hx0] = P2(-124, 0), [hx1] = P2(-111, 0);
  x.fillStyle = "rgba(90,100,80,0.25)";
  x.fillRect(hx0, 0, hx1 - hx0, H2);
  const road = (x0, z0, x1, z1, w) => {
    const [a, b2] = P2(x0, z0), [c, d] = P2(x1, z1);
    x.strokeStyle = "#b9b2a0";
    x.lineWidth = w * s;
    x.lineCap = "butt";
    x.beginPath();
    x.moveTo(a, b2);
    x.lineTo(c, d);
    x.stroke();
  };
  road(-112, 30, 134, 30, 9);
  road(-100, -30, 106, -30, 6);
  road(-60, -30, -60, 30, 6);
  road(30, -30, 30, 54, 7);
  road(100, -36, 100, 30, 6);
  road(30, 54, 30, 100, 9);
  const track = (x0, x1, z) => {
    const [a, b2] = P2(x0, z), [c] = P2(x1, z);
    x.strokeStyle = "#4a4440";
    x.lineWidth = 2;
    x.beginPath();
    x.moveTo(a, b2);
    x.lineTo(c, b2);
    x.stroke();
    x.lineWidth = 1;
    for (let xx = a; xx < c; xx += 6) {
      x.beginPath();
      x.moveTo(xx, b2 - 3);
      x.lineTo(xx, b2 + 3);
      x.stroke();
    }
  };
  track(-124, 134, -8);
  track(-44, 96, -16);
  for (const R of map.rects) {
    const [a, b2] = P2(R.x0, R.z0), [c, d] = P2(R.x1, R.z1);
    if (R.kind === "wall") {
      x.fillStyle = "#5e5a50";
      x.fillRect(a, b2 - 2, c - a, 4);
      continue;
    }
    if (R.kind === "yard" || R.kind === "fuel" || R.kind === "platform" || R.kind === "bridge" || R.kind === "culvert" || R.kind === "tunnel" || R.kind === "gate") {
      x.strokeStyle = "rgba(70,64,52,0.6)";
      x.setLineDash([ 4, 3 ]);
      x.strokeRect(a, b2, c - a, d - b2);
      x.setLineDash([]);
    } else {
      x.fillStyle = R.kind === "ruin" ? "rgba(120,108,90,0.45)" : "#8d8676";
      x.fillRect(a, b2, c - a, d - b2);
      x.strokeStyle = "#5e574a";
      x.strokeRect(a, b2, c - a, d - b2);
    }
  }
  for (const L of map.landmarks) {
    const [a, b2] = P2(L.x, L.z);
    x.fillStyle = "#3a352c";
    x.beginPath();
    x.arc(a, b2, L.tall ? 5 : 3, 0, 7);
    x.fill();
    if (L.tall) {
      x.strokeStyle = "#3a352c";
      x.beginPath();
      x.arc(a, b2, 9, 0, 7);
      x.stroke();
    }
  }
  x.font = '600 13px "IBM Plex Mono", monospace';
  x.fillStyle = "#2e2a22";
  for (const R of map.rects) {
    if (!R.label || R.kind === "wall") continue;
    const [a, b2] = P2((R.x0 + R.x1) / 2, R.z0);
    x.textAlign = "center";
    x.fillText(R.label, a, b2 - 5);
  }
  for (const L of map.landmarks) if (L.tall) {
    const [a, b2] = P2(L.x, L.z);
    x.textAlign = "left";
    x.fillText(L.name.toUpperCase(), a + 12, b2 + 4);
  }
  const ex = Object.values(map.extracts).concat([ {
    name: "FREIGHT \xb7 11:00",
    x: -42,
    z: -4,
    r: 3
  } ]);
  for (const e of ex) {
    const [a, b2] = P2(e.x, Math.min(e.z, 98));
    x.fillStyle = "#ff5b1f";
    x.strokeStyle = "#ff5b1f";

    x.stroke();
    x.beginPath();

    x.lineWidth = 2;
    if (m.type === "death") {
      x.beginPath();
      x.moveTo(a - 5, b2 - 5);
      x.lineTo(a + 5, b2 + 5);
      x.moveTo(a + 5, b2 - 5);
      x.lineTo(a - 5, b2 + 5);
      x.stroke();

      x.beginPath();
      x.arc(a, b2, 5, 0, 7);
      x.stroke();
    }
  }

    x.lineWidth = 4;
    x.beginPath();
    x.moveTo(a - 9, b2 - 9);
    x.lineTo(a + 9, b2 + 9);
    x.moveTo(a + 9, b2 - 9);
    x.lineTo(a - 9, b2 + 9);
    x.stroke();
    x.font = '600 13px "IBM Plex Mono", monospace';
    x.fillStyle = "#a3241c";
    x.textAlign = "left";
    x.fillText("YOUR BODY", a + 12, b2 + 4);
  }
  if (o.trail && o.trail.length > 1) {
    x.strokeStyle = "#2d6fb0";
    x.lineWidth = 3;
    x.lineJoin = "round";
    x.beginPath();
    o.trail.forEach(((p, i) => {
      const [a, b2] = P2(p[0], p[1]);
      if (i) x.lineTo(a, b2); else x.moveTo(a, b2);

    const [sa, sb] = P2(o.trail[0][0], o.trail[0][1]);
    x.fillStyle = "#2d6fb0";
    x.beginPath();
    x.arc(sa, sb, 6, 0, 7);
    x.fill();
  }
  if (o.death) {
    const [a, b2] = P2(o.death.x, o.death.z);
    if (o.killer) {
      const [c, d] = P2(o.killer.x, o.killer.z);
      x.strokeStyle = "#1b1b1b";
      x.setLineDash([ 6, 4 ]);
      x.lineWidth = 2;
      x.beginPath();
      x.moveTo(c, d);
      x.lineTo(a, b2);
      x.stroke();
      x.setLineDash([]);
      x.fillStyle = "#1b1b1b";
      x.beginPath();
      x.arc(c, d, 5, 0, 7);
      x.fill();
    }
    x.strokeStyle = "#a3241c";
    x.lineWidth = 4;
    x.beginPath();
    x.moveTo(a - 8, b2 - 8);
    x.lineTo(a + 8, b2 + 8);
    x.moveTo(a + 8, b2 - 8);
    x.lineTo(a - 8, b2 + 8);
    x.stroke();

  x.textAlign = "left";
  x.font = '800 30px "Big Shoulders Stencil Display", "Big Shoulders Display", Impact, sans-serif';
  x.fillText("RAIL YARD 9", 18, H2 - 40);
  x.font = '500 12px "IBM Plex Mono", monospace';
  x.fillText("SURVEY SHEET \xb7 1 SQUARE = 50 M \xb7 ORANGE = EXIT", 18, H2 - 20);
  const [na, nb] = [ W - 40, 46 ];

  x.lineWidth = 2;
  x.beginPath();
  x.moveTo(na, nb + 18);
  x.lineTo(na, nb - 18);
  x.lineTo(na - 7, nb - 6);
  x.moveTo(na, nb - 18);
  x.lineTo(na + 7, nb - 6);
  x.stroke();
  x.font = '700 16px "Big Shoulders Display", sans-serif';
  x.textAlign = "center";

  tp(x, z, yaw = 0, pitch = 0) {
    const P2 = game.player;
    P2.spawn(x, z, yaw);
    P2.pitch = pitch;
  },
  start() {
    game.startRaid();
    game.input.locked = true;
    return game.state;
  },
  info() {
    const P2 = game.player;
    return {
      pos: [ P2.pos.x, P2.pos.y, P2.pos.z ].map((v => +v.toFixed(2))),
      hp: +game.health.total().toFixed(2),
      agents: game.agents.map((a => [ a.kind, a.state, a.dead ? "dead" : "alive", +a.p.x.toFixed(1), +a.p.z.toFixed(1) ])),
      fps: game.fps
    };
  },
  save: save_exports
};
</script>
