  html, body { margin: 0; height: 100%; background: #4a4c52; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; font-family: "Unb", sans-serif; font-weight: 800; color: #1c1830; font-size: 16px; }
  #ui * { box-sizing: border-box; }
  .blk { position: absolute; background: var(--c, #fbf7ee); padding: .6em 1em .7em;
    box-shadow: inset 0 .25em 0 var(--hi, rgba(255,255,255,.6)), inset 0 -.25em 0 var(--lo, rgba(0,0,0,.1)), 0 .38em 0 var(--side, #a49cc0), 0 .62em 0 rgba(10,8,30,.3);
    clip-path: polygon(0 .38em, .38em .38em, .38em 0, calc(100% - .38em) 0, calc(100% - .38em) .38em, 100% .38em, 100% calc(100% + .7em), 0 calc(100% + .7em)); }
  .dark { --c: #2a2a4e; --side: #15152e; --hi: rgba(140,150,255,.3); color: #fff; }
  .yel { --c: #ffcf3a; --side: #c88a12; --hi: rgba(255,255,220,.7); }
  .red { --c: #e8402e; --side: #9a2016; --hi: rgba(255,200,180,.5); color: #fff; }
  .grn { --c: #4ab84a; --side: #2a7a2a; --hi: rgba(220,255,200,.5); color: #fff; }

  /* HUD */
  #money { left: 1em; top: .9em; min-width: 13em; }
  #money .lbl, #warn .lbl, #today .lbl { font-size: .7em; letter-spacing: .12em; opacity: .75; font-weight: 600; }
  #money .v { font-size: 1.5em; color: #ffcf3a; text-shadow: 0 .12em 0 #15152e; }
  #money .v small { font-size: .5em; color: #c8c8e8; font-weight: 600; text-shadow: none; }
  #money .bar { display: grid; grid-template-columns: repeat(16, 1fr); gap: .15em; margin-top: .4em; }
  #money .bar i { height: .6em; background: #3c3c66; }
  #money .bar i.on { background: #ffcf3a; box-shadow: inset 0 -.2em 0 #c88a12; }
  #warn { left: 15.4em; top: .9em; }
  #warn .row { display: flex; gap: .35em; margin-top: .35em; }
  #warn .x { width: 1.6em; height: 1.6em; background: #3c3c66; display: grid; place-items: center; font-size: .9em; color: #2a2a4e; }
  #warn .x.on { background: #e8402e; color: #fff; box-shadow: inset 0 -.25em 0 #9a2016; }
  #warn .cmp { font-size: .62em; font-weight: 600; margin-top: .4em; color: #c8c8e8; }
  #route { left: 50%; transform: translateX(-50%); top: .9em; display: flex; align-items: center; gap: 0; padding: .55em 1em .7em; }
  #route .st { display: flex; flex-direction: column; align-items: center; width: 8.4em; font-size: .52em; line-height: 1.15; font-weight: 600; text-align: center; color: #6a6488; position: relative; }
  #route .st i { width: 1.4em; height: 1.4em; background: #d8d2e8; margin-bottom: .3em; display: block; }
  #route .st.done i { background: #8a84a8; } #route .st.done { color: #8a84a8; }
  #route .st.next i { background: #ffcf3a; box-shadow: inset 0 -.25em 0 #c88a12; } #route .st.next { color: #1c1830; font-weight: 800; }
  #route .st.rev::after { content: "РЕВИЗОР"; position: absolute; top: -1.2em; font-size: .85em; background: #e8402e; color: #fff; padding: .1em .4em; }
  #route .bus { position: absolute; top: .55em; width: 1.6em; height: .9em; background: #e8a032; box-shadow: inset 0 -.2em 0 #c8801e; transition: left .3s linear; }
  #today { right: 1em; top: .9em; text-align: left; }
  #today .m { font-size: 1.05em; }
  #today .tal { display: flex; align-items: center; gap: .6em; margin-top: .35em; font-size: .7em; font-weight: 600; }
  .holes { display: grid; grid-template-columns: repeat(3, .8em); gap: .18em; background: #cfe3f2; padding: .32em; }
  .holes i { width: .8em; height: .8em; background: #b8cfe0; }
  .holes i.p { background: #1c1830; }
  #hint { left: 50%; bottom: 1.4em; transform: translateX(-50%); font-size: .85em; font-weight: 600; text-align: center; max-width: 92vw; white-space: nowrap; }
  #hint b { color: #c86a12; }
  .key { display: inline-grid; place-items: center; min-width: 1.6em; height: 1.6em; padding: 0 .3em; background: #ffcf3a; color: #1c1830; font-weight: 800; font-size: .85em; box-shadow: inset 0 .16em 0 #fff2a8, inset 0 -.22em 0 #c88a12; margin: 0 .15em; vertical-align: .05em; }
  #btns { position: absolute; right: 1em; bottom: 1.2em; display: none; gap: .8em; pointer-events: auto; }
  #btns .blk { position: relative; font-size: 1em; padding: .9em 1.1em 1em; }
  #shoutCd { position: absolute; left: 0; bottom: 0; height: .3em; background: #c88a12; }

  /* пузыри */
  .pin { position: absolute; transform: translate(-50%, calc(-100% - 1.4em)); --c: #fbf7ee; --side: #a49cc0; white-space: nowrap; }
  .pin .blk { position: relative; font-size: .8em; padding: .45em .8em .55em; text-align: center; line-height: 1.25; }
  .pin .tail { position: absolute; left: calc(50% - .6em); bottom: -1.1em; width: 1.2em; height: 1.2em; background: var(--side);
    clip-path: polygon(0 0, 100% 0, 100% 33%, 66% 33%, 66% 66%, 33% 66%, 33% 100%, 0 100%); }
  .pin .tail::before { content: ""; position: absolute; inset: 0 0 .3em 0; background: var(--c); clip-path: polygon(0 0, 100% 0, 100% 33%, 66% 33%, 66% 66%, 33% 66%, 33% 100%, 0 100%); }
  .pin.hero { --c: #fff3d0; --side: #e07a20; }
  .pin.rev { --c: #2a2a4e; --side: #15152e; color: #fff; }
  .pin.bad { --c: #ffe0d8; --side: #c83a2a; color: #8a1810; }
  .pin.big .blk { font-size: 1.15em; }
  .pin.chat { --c: #efe6ff; --side: #8a6ad8; color: #4a2a9a; }
  .pin.chat .blk { font-style: italic; font-size: .72em; }
  .pin.chat .blk::before { content: "стрим · "; font-style: normal; font-weight: 800; color: #8a6ad8; }

  /* карточка проверки */
  #card { position: absolute; left: 50%; bottom: 1.2em; transform: translateX(-50%); width: 30em; padding: 1em 1.2em 1.2em; pointer-events: auto; display: none; }
  #card.side-l { left: 1.2em; transform: none; }
  #card.side-r { left: auto; right: 1.2em; transform: none; }
  #card .who { display: flex; gap: .9em; align-items: center; }
  #card .who img { width: 5em; height: 5em; background: #d8d2e8; image-rendering: pixelated; }
  #card .say { font-size: .9em; line-height: 1.35; }
  #card .say small { display: block; font-size: .72em; font-weight: 600; color: #6a6488; margin-bottom: .2em; }
  #card .doc { margin: .9em 0 1em; }
  #card .opts { display: flex; gap: .7em; }
  #card .opt { position: relative; flex: 1; text-align: center; font-size: .9em; padding: .8em .6em .9em; cursor: pointer; }
  #card .opt:hover { filter: brightness(1.06); }
  #card .rule { font-size: .66em; font-weight: 600; color: #6a6488; margin-top: .9em; text-align: center; }
  .pass { display: flex; gap: .8em; padding: .7em; background: var(--pc, #4a8ad8); color: #fff; box-shadow: inset 0 -.3em 0 rgba(0,0,0,.2); }
  .pass img { width: 4.2em; height: 4.2em; background: #fff; image-rendering: pixelated; border: .2em solid #fff; }
  .pass .t { font-size: .7em; font-weight: 600; opacity: .9; }
  .pass .b { font-size: 1.2em; margin: .1em 0; }
  .pass .s { font-size: .7em; font-weight: 600; }
  .ruler { display: flex; align-items: flex-end; gap: 1em; }
  .ruler .scale { position: relative; width: 7em; height: 7.5em; background: repeating-linear-gradient(0deg, #f4e6c8 0 .5em, #ead8b4 .5em 1em); box-shadow: inset 0 -.3em 0 #c8b490; }
  .ruler .scale i { position: absolute; left: 0; right: 0; border-top: .12em solid #6a6488; }
  .ruler .scale i b { position: absolute; left: .2em; top: -1.35em; font-size: .6em; color: #6a6488; }
  .ruler .scale i.lim { border-top: .25em solid #e8402e; }
  .ruler .scale i.lim b { color: #e8402e; }
  .ruler .kidbar { position: absolute; bottom: 0; right: .6em; width: 2.2em; background: #4a8ad8; box-shadow: inset -.3em 0 0 rgba(0,0,0,.2); }
  .ruler .kidbar em { position: absolute; top: -1.4em; right: -.4em; font-style: normal; font-size: .7em; background: #fff; padding: 0 .3em; white-space: nowrap; color: #2a2440; }
  .ruler .rtxt { font-size: .75em; color: #2a2440; } .ruler .rtxt small { color: #6a6488; }
  .grp { display: grid; grid-template-columns: repeat(3, 1.2em); gap: .25em; padding: .3em; background: #fff; align-content: center; }
  .grp i { width: 1.2em; height: 1.2em; background: #ddd; } .grp i.p { background: #2a2a32; }
  .talon { display: flex; align-items: center; gap: 1em; }
  .talon .tk { background: #cfe3f2; padding: .6em .8em; display: flex; gap: .8em; align-items: center; box-shadow: inset 0 -.3em 0 #a8c0d4; }
  .talon .tk .n { font-size: .75em; color: #2a3a5a; }
  .talon .holes { background: transparent; padding: 0; }
  .talon .cmp { font-size: .7em; font-weight: 600; color: #6a6488; display: flex; align-items: center; gap: .5em; }

  /* крупные объявления */
  #big { position: absolute; left: 50%; top: 17.5%; transform: translate(-50%, -50%); font-size: 1.6em; padding: .5em 1.1em .6em; display: none; text-align: center; }
  #big small { display: block; font-size: .42em; font-weight: 600; margin-top: .3em; }
  .pop { position: absolute; font-size: 1em; color: #ffcf3a; text-shadow: 0 .12em 0 #15152e, 0 0 .3em rgba(0,0,0,.5); transform: translate(-50%, -50%); white-space: nowrap; }
  .pop.minus { color: #ff6a5a; }

  /* титул и итоги */
  #screen { position: absolute; inset: 0; z-index: 5; display: none; place-items: center; background: rgba(20,18,40,.35); pointer-events: auto; }
  #screen.title { background: radial-gradient(ellipse at 50% 50%, rgba(20,18,40,0) 40%, rgba(20,18,40,.45) 100%); grid-template-columns: auto auto; justify-content: space-between; align-items: center; gap: 1em; padding: 0 3vw; }
  #ui.carding #mute { display: none; }
  #screen .valya { width: 15em; image-rendering: pixelated; filter: drop-shadow(0 .5em 0 rgba(20,18,40,.35)); }
  #screen .routes { display: grid; gap: .5em; margin: .2em 0 .9em; text-align: left; }
  #screen .rcard { position: relative; display: flex; gap: .8em; align-items: center; padding: .55em .8em .6em; cursor: pointer; font-size: .78em; --c: #f4efe2; --side: #c8c0a8; }
  #screen .rcard:hover { filter: brightness(1.04); }
  #screen .rcard.on { --c: #fff3c8; --side: #e0a020; }
  #screen .rcard b { display: block; font-size: 1.05em; }
  #screen .rcard small { display: block; font-weight: 600; color: #6a6488; margin: .1em 0 .2em; }
  #screen .rcard em { display: block; font-style: normal; font-weight: 600; font-size: .86em; color: #3a3458; line-height: 1.35; }
  #screen .plate { flex: none; display: grid; place-items: center; width: 2.4em; height: 2em; font-weight: 800; font-size: 1.3em; color: #1c1830; background: #ffcf3a; box-shadow: inset 0 -.2em 0 #c88a12; }
  #screen .rcard.t-morning .plate { background: #ff9a6a; box-shadow: inset 0 -.2em 0 #c8603a; }
  #screen .rcard.t-night .plate { background: #3a3a6a; color: #ffe08a; box-shadow: inset 0 -.2em 0 #1c1c40; }
  #screen .gos .go { position: relative; }
  #screen .gos { display: flex; gap: .7em; justify-content: center; flex-wrap: wrap; }
  #screen .panel { position: relative; width: 30em; max-width: 94vw; text-align: center; padding: 1.4em 1.6em 1.6em; }
  #screen h1 { margin: 0; font-size: 2.3em; line-height: 1.05; color: #e8402e; text-shadow: 0 .1em 0 #9a2016; }
  #screen h2 { margin: .4em 0 0; font-size: 1em; font-weight: 600; color: #4a4468; }
  #screen p { font-size: .78em; font-weight: 600; line-height: 1.5; color: #3a3458; margin: .9em 0; }
  #screen .go { position: relative; display: inline-block; margin-top: .6em; font-size: 1.1em; padding: .8em 1.6em .9em; cursor: pointer; }
  #screen .ctr { display: flex; justify-content: center; gap: 1.2em; font-size: .7em; font-weight: 600; color: #4a4468; flex-wrap: wrap; }
  #screen table { margin: .8em auto; font-size: .82em; border-collapse: collapse; }
  #screen td { padding: .2em .8em; text-align: left; } #screen td:last-child { text-align: right; }
  #screen .order { text-align: left; font-size: .8em; font-weight: 600; line-height: 1.5; background: #fffdf6; padding: 1em 1.2em; margin: .8em 0; color: #2a2440; box-shadow: inset 0 0 0 .15em #d8d0b8; }
  #screen .order b { display: block; text-align: center; font-size: 1.15em; margin-bottom: .4em; letter-spacing: .05em; }
  #screen .stamp { display: inline-block; color: #c8302a; border: .2em solid #c8302a; padding: .1em .5em; transform: rotate(-8deg); font-size: 1.2em; margin-top: .4em; }
  #mute { position: absolute; right: 1em; bottom: 1em; font-size: .7em; pointer-events: auto; cursor: pointer; padding: .5em .7em .6em; min-height: 44px; min-width: 44px; box-sizing: border-box; display: grid; place-items: center; }

  @media (max-aspect-ratio: 1/1) {
    #route { display: none; }
    #warn { left: auto; right: 1em; top: .9em; }
    #today { right: 1em; top: 6.2em; }
    #money { min-width: 10em; }
    #hint { white-space: normal; width: 92vw; bottom: 6.4em; font-size: .78em; }
    #card { width: 94vw; top: auto; bottom: .6em; transform: translateX(-50%); }
    #mute { bottom: auto; top: auto; left: 1em; right: auto; bottom: 1.4em; }
    #ui { font-size: 13px; }
    #big { top: 66%; font-size: 1.4em; width: 88vw; }
    #btns { right: auto; left: 50%; transform: translateX(-50%); }
    #ui.carding #today, #ui.carding #mute, #ui.carding #btns { display: none !important; }
    #screen.title { grid-template-columns: auto; justify-content: center; align-content: center; gap: 0; padding: 0; }
    #screen .valya { width: 9em; margin-bottom: -1.2em; position: relative; z-index: 1; }
  }
