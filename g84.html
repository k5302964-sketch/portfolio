:root{
  --void:#07080c; --gloom:#121a2b; --gloom2:#2a3654; --cold:#4a6a9a; --lamp:#ffd9a0; --spot:#fff0d6;
  --accent:#e0412f; --paper:#f1ece0; --dim:rgba(241,236,224,.55); --faint:rgba(241,236,224,.22);
  --f:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif; --fd:'Yeseva One','Jost',Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--void);color:var(--paper);font-family:var(--f);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:1px solid var(--lamp);outline-offset:3px}
.hidden{display:none!important}
.vign{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%)}

/* ---------- HUD ---------- */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;pointer-events:none;font-size:13px;letter-spacing:.04em}
#hud > *{pointer-events:auto}
.meter{min-width:0}
.meter .lab{color:var(--dim);font-size:11px;letter-spacing:.14em;text-transform:uppercase;display:flex;gap:8px;align-items:baseline}
.meter .lab b{color:var(--paper);font-weight:500;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.bar{position:relative;height:3px;width:min(150px,32vw);margin-top:6px}
.bar:before{content:"";position:absolute;left:0;right:0;top:1px;height:1px;background:var(--faint)}
.bar i{position:absolute;left:0;top:0;height:3px;background:var(--paper);transition:width .15s}
#ink .bar i{background:var(--cold)} #ink.low .bar i{background:var(--accent)}
#mid{text-align:center}
#mid .t{font-size:11px;color:var(--dim);letter-spacing:.16em;text-transform:uppercase}
#mid .c{font-size:15px;font-variant-numeric:tabular-nums;margin-top:2px}
#right{justify-self:end;display:flex;gap:12px;align-items:start}
#right .cnt{text-align:right}
.ib{width:44px;height:44px;display:grid;place-items:center;margin-top:-8px}
.ib svg{width:22px;height:22px;stroke:var(--paper);fill:none;stroke-width:1.4}
#combo{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-size:15px;letter-spacing:.2em;color:var(--lamp);pointer-events:none;opacity:0;transition:opacity .2s}
#combo.on{opacity:1}
#toast{position:fixed;left:50%;top:calc(92px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-size:14px;color:var(--paper);pointer-events:none;text-align:center;max-width:90vw;opacity:0;transition:opacity .3s;background:rgba(7,8,12,.6);padding:4px 10px}
#toast.on{opacity:1}

/* ---------- кнопки действий ---------- */
#actions{position:fixed;left:0;right:0;bottom:0;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:flex;justify-content:center;gap:10px;flex-wrap:wrap;pointer-events:none}
.act{pointer-events:auto;width:76px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--dim);transition:color .15s,transform .1s}
.act .o{width:58px;height:58px;border-radius:50%;border:1px solid var(--faint);display:grid;place-items:center;position:relative;background:rgba(7,8,12,.55)}
.act svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.act .n{font-size:12px;letter-spacing:.06em;text-align:center;line-height:1.1}
.act .k{position:absolute;right:-2px;top:-4px;font-size:10px;color:var(--dim)}
.act .cost{position:absolute;left:-4px;bottom:-2px;font-size:11px;color:var(--cold);font-variant-numeric:tabular-nums}
.act.ready{color:var(--lamp)} .act.ready .o{border-color:var(--lamp)}
.act.ready.pulse .o{animation:pulse 1.2s ease-in-out infinite}
.act.low .cost{color:var(--accent)}
.act.none{color:var(--dim)} .act.none .o{border-color:var(--faint);border-style:dashed}
.act:active{transform:scale(.94)}
.act .cd{position:absolute;inset:-1px;border-radius:50%}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,217,160,.0)}50%{box-shadow:0 0 0 6px rgba(255,217,160,.18)}}

/* ---------- экраны ---------- */
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));background:rgba(7,8,12,.78);overflow-y:auto;touch-action:pan-y;z-index:10}
.scr.solid{background:var(--void)}
.scr .inner{width:min(560px,100%);margin-block:auto;flex-shrink:0;display:flex;flex-direction:column;gap:18px}
.scr h1{font-family:var(--fd);font-weight:400;font-size:clamp(48px,13vw,92px);margin:0;letter-spacing:.02em;line-height:1}
.scr h2{font-family:var(--fd);font-weight:400;font-size:clamp(26px,6vw,36px);margin:0;line-height:1.1;text-wrap:balance}
.scr h3{font-weight:500;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin:0}
.scr p{margin:0;font-size:16px;line-height:1.55;font-weight:300;max-width:62ch}
.sub{color:var(--dim);font-size:14px;letter-spacing:.12em;text-transform:uppercase}
.list{display:flex;flex-direction:column;gap:2px}
.li{display:flex;align-items:center;gap:12px;min-height:46px;font-size:18px;font-weight:300;text-align:left;color:var(--paper);padding:0 2px}
.li .num{width:22px;color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
.li:hover,.li:focus-visible{color:var(--lamp)}
.li:hover span:last-child:before,.li:focus-visible span:last-child:before{content:"— "}
.li.dis{color:var(--faint);pointer-events:none}
.row{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.btn{min-height:46px;padding:0 18px;border:1px solid var(--faint);font-size:16px;letter-spacing:.04em;display:inline-flex;align-items:center;gap:8px}
.btn.main{border-color:var(--lamp);color:var(--lamp)}
.btn:hover{border-color:var(--paper)}
.line{height:1px;background:var(--faint)}
.night{display:flex;flex-direction:column;gap:6px}
.lvls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.lv{min-height:64px;text-align:left;padding:8px 10px;border-left:1px solid var(--faint);display:flex;flex-direction:column;gap:3px}
.lv .a{font-size:11px;color:var(--dim);letter-spacing:.12em}
.lv .b{font-size:16px}
.lv .s{font-size:12px;color:var(--lamp);letter-spacing:.2em}
.lv:hover{border-color:var(--lamp)} .lv.lock{opacity:.35;pointer-events:none}
.lv.cur{border-color:var(--lamp)}
.set{display:grid;grid-template-columns:120px 1fr;gap:14px 16px;align-items:center}
.set label{color:var(--dim);font-size:14px}
.seg{display:flex;gap:16px}
.seg button{min-height:44px;font-size:16px;color:var(--dim)} .seg button.on{color:var(--lamp)}
.seg button.on:before{content:"— "}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--faint)}
input[type=range]::-moz-range-track{height:1px;background:var(--faint)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--lamp);margin-top:-9px}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--lamp);border:0}
.confirm{border-left:1px solid var(--accent);padding:8px 12px;display:flex;flex-direction:column;gap:10px}
.ups{display:flex;flex-direction:column;gap:14px}
.up{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.up .nm{font-size:17px} .up .ds{grid-column:1;color:var(--dim);font-size:13px}
.up .pips{display:flex;gap:4px;margin-top:4px} .up .pips i{width:18px;height:3px;background:var(--faint)} .up .pips i.on{background:var(--lamp)}
.up .bt{grid-row:1/4;grid-column:2}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pg{min-height:96px;text-align:left;padding:10px;border:1px solid var(--faint);font-size:13px;color:var(--dim);display:flex;flex-direction:column;gap:6px}
.pg b{color:var(--paper);font-weight:500;font-size:14px}
.pg.on:hover{border-color:var(--lamp)}
.stars{display:flex;flex-direction:column;gap:8px}
.st{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--dim)} .st i{width:14px;height:14px;border:1px solid var(--faint);transform:rotate(45deg)} .st.on{color:var(--paper)} .st.on i{background:var(--lamp);border-color:var(--lamp)}
.paper{background:#e8dfc8;color:#1a1410;padding:18px 18px 16px;font-family:var(--fd);display:flex;flex-direction:column;gap:8px;transform:rotate(-1deg)}
.paper .mast{font-size:13px;letter-spacing:.3em;text-transform:uppercase;border-bottom:2px solid #1a1410;padding-bottom:6px;text-align:center}
.paper .hl{font-size:clamp(20px,5vw,28px);line-height:1.05}
.paper .bd{font-family:var(--f);font-size:14px;line-height:1.45}
.opt{text-align:left;padding:12px 14px;border:1px solid var(--faint);display:flex;flex-direction:column;gap:4px}
.opt b{font-weight:500;font-size:17px} .opt span{color:var(--dim);font-size:14px}
.opt:hover{border-color:var(--lamp)} .opt:hover b{color:var(--lamp)}
.guide{display:flex;flex-direction:column;gap:12px}
.gi b{display:block;font-weight:500;font-size:16px;margin-bottom:2px} .gi span{color:var(--dim);font-size:14px;line-height:1.45}

<script>
window.K=window.K||{};
// world.js — сетка уровня, лучи, пути кляксы и людей
'use strict';
const K = window.K = window.K || {};

// Символы карты:
//  ' ' снаружи дома   '.' воздух в доме   '#' стена/перекрытие   '%' труба/вентиляция (только для кляксы)
//  'w' окно в наружной стене (свет проходит, пройти нельзя)
//  'E' входная дверь (люди входят и выбегают)   '*' капля чернил   'P' страница альбома   'K' старт кляксы
K.parseLevel = function (L) {
  const rows = L.map.map(r => r.replace(/\s+$/, ''));
  const H = rows.length, W = Math.max(...rows.map(r => r.length));
  const g = new Uint8Array(W * H);      // 0 снаружи, 1 воздух, 2 стена, 3 труба
  const W_ = { w: W, h: H, g, furn: new Int16Array(W * H).fill(-1), drops: [], page: null, start: null, exits: [] };
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const c = rows[y][x] || ' ';
    let v = 0;
    if (c === '#') v = 2; else if (c === '%') v = 3; else if (c === 'w') v = 4; else if (c === ' ') v = 0; else v = 1;
    g[y * W + x] = v;
    if (c === '*') W_.drops.push({ x: x + 0.5, y: y + 0.5, taken: false });
    if (c === 'P') W_.page = { x: x + 0.5, y: y + 0.5, taken: false };
    if (c === 'K') W_.start = { x, y };
    if (c === 'E') W_.exits.push({ x, y });
  }
  return W_;
};

K.World = class {
  constructor(L) {
    Object.assign(this, K.parseLevel(L));
    this.L = L;
    this.objects = [];   // мебель и предметы (из objects.js)
    this.stairs = (L.stairs || []).map(s => ({ ...s }));
  }
  idx(x, y) { return y * this.w + x; }
  inb(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h; }
  cell(x, y) { return this.inb(x, y) ? this.g[y * this.w + x] : 0; }
  isWall(x, y) { return this.cell(x, y) === 2; }
  furnAt(x, y) { return this.inb(x, y) ? this.furn[y * this.w + x] : -1; }
  // непрозрачно для света: стена, труба, снаружи, непрозрачная мебель
  opaque(x, y) {
    const c = this.cell(x, y);
    if (c === 4) return false;
    if (c !== 1) return true;
    const f = this.furnAt(x, y);
    return f >= 0 && this.objects[f].opaque;
  }
  // твёрдо для кляксы (к чему можно прилипнуть)
  solidForBlot(x, y) {
    const c = this.cell(x, y);
    if (c === 2 || c === 0 || c === 4) return true;
    const f = this.furnAt(x, y);
    return f >= 0 && this.objects[f].solid;
  }
  passBlot(x, y) {
    const c = this.cell(x, y);
    if (c === 3) return true;
    if (c !== 1) return false;
    const f = this.furnAt(x, y);
    return !(f >= 0 && this.objects[f].solid);
  }
  registerFurniture() {
    this.furn.fill(-1);
    this.back = new Int16Array(this.w * this.h).fill(-1);
    this.objects.forEach((o, i) => {
      if (o.back && o.poss) for (let y = o.y; y < o.y + o.h; y++) for (let x = o.x; x < o.x + o.w; x++) if (this.inb(x, y)) this.back[this.idx(x, y)] = i;
      if (!o.solid && !o.opaque) return;
      for (let y = o.y; y < o.y + o.h; y++) for (let x = o.x; x < o.x + o.w; x++) if (this.inb(x, y)) this.furn[this.idx(x, y)] = i;
    });
    this.buildBlotGraph();
    this.buildWalk();
  }

  // ---------- лучи (DDA по сетке) ----------
  // возвращает расстояние до первой непрозрачной клетки (или maxD)
  ray(ox, oy, dx, dy, maxD, skipStart = true) {
    let x = Math.floor(ox), y = Math.floor(oy);
    const sx = dx > 0 ? 1 : -1, sy = dy > 0 ? 1 : -1;
    const tdx = dx !== 0 ? Math.abs(1 / dx) : 1e9, tdy = dy !== 0 ? Math.abs(1 / dy) : 1e9;
    let tx = dx !== 0 ? ((dx > 0 ? x + 1 - ox : ox - x) * tdx) : 1e9;
    let ty = dy !== 0 ? ((dy > 0 ? y + 1 - oy : oy - y) * tdy) : 1e9;
    // если начало внутри непрозрачной мебели (человек стоит перед шкафом) — пропускаем этот предмет
    const startF = this.furnAt(x, y);
    if (!skipStart && this.opaque(x, y)) return 0;
    let t = 0;
    for (let i = 0; i < 200; i++) {
      if (tx < ty) { t = tx; tx += tdx; x += sx; } else { t = ty; ty += tdy; y += sy; }
      if (t >= maxD) return maxD;
      if (this.opaque(x, y)) {
        const f = this.furnAt(x, y);
        if (f >= 0 && f === startF && this.cell(x, y) === 1) continue;
        return t;
      }
    }
    return maxD;
  }
  los(ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay, d = Math.hypot(dx, dy);
    if (d < 1e-4) return true;
    return this.ray(ax, ay, dx / d, dy / d, d) >= d - 1e-3;
  }
  // число стен между точками (для глушения звука)
  wallsBetween(ax, ay, bx, by) {
    const d = Math.hypot(bx - ax, by - ay), n = Math.ceil(d * 3);
    let walls = 0, prev = false;
    for (let i = 1; i < n; i++) {
      const t = i / n, x = Math.floor(ax + (bx - ax) * t), y = Math.floor(ay + (by - ay) * t);
      const w = this.cell(x, y) === 2 || this.cell(x, y) === 3;
      if (w && !prev) walls++;
      prev = w;
    }
    return walls;
  }
  // многоугольник света: начало, угол, полуугол, дальность
  lightPoly(ox, oy, ang, half, range, n) {
    const pts = [[ox, oy]];
    n = n || Math.max(24, Math.ceil(half * 2 * range * 6));
    for (let i = 0; i <= n; i++) {
      const a = ang - half + (2 * half * i) / n, dx = Math.cos(a), dy = Math.sin(a);
      const d = this.ray(ox, oy, dx, dy, range);
      pts.push([ox + dx * d, oy + dy * d]);
    }
    return pts;
  }
  inCone(ox, oy, ang, half, range, px, py) {
    const dx = px - ox, dy = py - oy, d = Math.hypot(dx, dy);
    if (d > range) return false;
    if (d > 0.3) {
      let da = Math.atan2(dy, dx) - ang;
      da = Math.atan2(Math.sin(da), Math.cos(da));
      if (Math.abs(da) > half) return false;
    }
    return this.los(ox, oy, px, py);
  }

  // ---------- граф кляксы ----------
  // клетка «прилипания»: проходима и рядом есть твёрдое (4 соседа), либо это труба
  buildBlotGraph() {
    const { w, h } = this;
    this.cling = new Uint8Array(w * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (!this.passBlot(x, y)) continue;
      if (this.cell(x, y) === 3 || this.back[this.idx(x, y)] >= 0) { this.cling[this.idx(x, y)] = 1; continue; }
      if (this.solidForBlot(x - 1, y) || this.solidForBlot(x + 1, y) || this.solidForBlot(x, y - 1) || this.solidForBlot(x, y + 1)) this.cling[this.idx(x, y)] = 1;
    }
  }
  isCling(x, y) { return this.inb(x, y) && this.cling[this.idx(x, y)] === 1; }
  // соседи кляксы: 8 направлений по клеткам прилипания + падение вниз с потолка/края
  blotNeighbors(x, y, out) {
    out.length = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const nx = x + dx, ny = y + dy;
      if (!this.isCling(nx, ny)) continue;
      if (dx && dy) {   // по диагонали — только если не режем угол стены
        if (!this.passBlot(x + dx, y) && !this.passBlot(x, y + dy)) continue;
        if (!this.passBlot(x + dx, y) || !this.passBlot(x, y + dy)) { /* огибание угла разрешено */ }
      }
      out.push(nx, ny, dx && dy ? 1.414 : 1, 0);
    }
    // капля вниз: если под нами воздух (в доме), падаем до первой клетки прилипания
    if (this.cell(x, y) === 1 && this.passBlot(x, y + 1) && this.cell(x, y + 1) === 1 && !this.isCling(x, y + 1)) {
      let yy = y + 1;
      while (yy < this.h && this.passBlot(x, yy) && this.cell(x, yy) === 1 && !this.isCling(x, yy)) yy++;
      if (this.isCling(x, yy)) out.push(x, yy, (yy - y) * 0.45, 1);
    }
    return out;
  }
  nearestCling(px, py, maxR = 6) {
    let best = null, bd = 1e9;
    const cx = Math.floor(px), cy = Math.floor(py);
    for (let y = cy - maxR; y <= cy + maxR; y++) for (let x = cx - maxR; x <= cx + maxR; x++) {
      if (!this.isCling(x, y)) continue;
      const d = (x + 0.5 - px) ** 2 + (y + 0.5 - py) ** 2;
      if (d < bd) { bd = d; best = { x, y }; }
    }
    return best;
  }
  blotPath(sx, sy, tx, ty) {
    const { w } = this, N = w * this.h;
    const gS = new Float32Array(N).fill(1e9), from = new Int32Array(N).fill(-1), drop = new Uint8Array(N), closed = new Uint8Array(N);
    const heap = new K.Heap();
    const s = this.idx(sx, sy), t = this.idx(tx, ty);
    gS[s] = 0; heap.push(s, 0);
    const nb = [];
    while (heap.size) {
      const c = heap.pop();
      if (closed[c]) continue;
      closed[c] = 1;
      if (c === t) break;
      const cx = c % w, cy = (c / w) | 0;
      this.blotNeighbors(cx, cy, nb);
      for (let i = 0; i < nb.length; i += 4) {
        const n = this.idx(nb[i], nb[i + 1]), ng = gS[c] + nb[i + 2];
        if (ng < gS[n]) { gS[n] = ng; from[n] = c; drop[n] = nb[i + 3]; heap.push(n, ng + Math.hypot(nb[i] - tx, nb[i + 1] - ty)); }
      }
    }
    if (from[t] < 0 && s !== t) return null;
    const path = [];
    for (let c = t; c !== s; c = from[c]) path.push({ x: c % w, y: (c / w) | 0, drop: drop[c] });
    path.reverse();
    return path;
  }

  // ---------- граф людей ----------
  // клетка «ног»: воздух, под ней стена, и над ней ещё 2 клетки не-стены
  isFoot(x, y) {
    return this.cell(x, y) === 1 && (this.cell(x, y + 1) === 2 || this.cell(x, y + 1) === 3) && this.cell(x, y - 1) === 1 && this.cell(x, y - 2) === 1;
  }
  buildWalk() {
    const { w, h } = this;
    this.walkAdj = new Map();
    const key = (x, y) => y * w + x;
    const add = (a, b, cost, stair) => {
      if (!this.walkAdj.has(a)) this.walkAdj.set(a, []);
      this.walkAdj.get(a).push({ to: b, cost, stair });
    };
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (!this.isFoot(x, y)) continue;
      if (!this.walkAdj.has(key(x, y))) this.walkAdj.set(key(x, y), []);
      if (this.isFoot(x + 1, y)) { add(key(x, y), key(x + 1, y), 1); add(key(x + 1, y), key(x, y), 1); }
    }
    // мостик над лестничным проёмом (до 4 клеток): люди ходят по площадке с перилами
    this.bridges = [];
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (!this.isFoot(x, y) || this.isFoot(x + 1, y)) continue;
      for (let k = 1; k <= 4; k++) {
        const xx = x + k;
        if (this.cell(xx, y) !== 1 || this.cell(xx, y - 1) !== 1 || this.cell(xx, y - 2) !== 1 || this.cell(xx, y + 1) !== 1) break;
        if (this.isFoot(xx + 1, y)) { add(key(x, y), key(xx + 1, y), k + 1); add(key(xx + 1, y), key(x, y), k + 1); this.bridges.push({ x0: x + 1, x1: xx + 1, y }); break; }
      }
    }
    this.stairs.forEach((s, i) => {
      const a = key(s.x0, s.y0), b = key(s.x1, s.y1), c = Math.hypot(s.x1 - s.x0, s.y1 - s.y0) * 1.3;
      add(a, b, c, i); add(b, a, c, i);
    });
  }
  walkPath(sx, sy, tx, ty) {
    const w = this.w, s = sy * w + sx, t = ty * w + tx;
    if (!this.walkAdj.has(s) || !this.walkAdj.has(t)) return null;
    const dist = new Map([[s, 0]]), from = new Map(), heap = new K.Heap();
    heap.push(s, 0);
    while (heap.size) {
      const c = heap.pop();
      if (c === t) break;
      for (const e of this.walkAdj.get(c) || []) {
        const nd = dist.get(c) + e.cost;
        if (nd < (dist.has(e.to) ? dist.get(e.to) : 1e9)) { dist.set(e.to, nd); from.set(e.to, { c, stair: e.stair }); heap.push(e.to, nd); }
      }
    }
    if (s !== t && !from.has(t)) return null;
    const path = [];
    for (let c = t; c !== s;) { const f = from.get(c); path.push({ x: c % w, y: (c / w) | 0, stair: f.stair }); c = f.c; }
    path.reverse();
    return path;
  }
  // ближайшая клетка ног к точке (по прямой видимости не требуем)
  nearestFoot(px, py, preferSameFloor = true) {
    let best = null, bd = 1e9;
    for (const k of this.walkAdj.keys()) {
      const x = k % this.w, y = (k / this.w) | 0;
      let d = (x + 0.5 - px) ** 2 * 1 + (y - 1 - py) ** 2 * (preferSameFloor ? 4 : 1);
      if (d < bd) { bd = d; best = { x, y }; }
    }
    return best;
  }
  // номер комнаты по клетке (заливка воздуха, ограниченная стенами) — для «отвоёванных» комнат и вспышки
  buildRooms() {
    const { w, h } = this;
    this.room = new Int16Array(w * h).fill(-1);
    let id = 0;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (this.cell(x, y) !== 1 || this.room[this.idx(x, y)] >= 0) continue;
      const st = [[x, y]];
      this.room[this.idx(x, y)] = id;
      while (st.length) {
        const [cx, cy] = st.pop();
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const nx = cx + dx, ny = cy + dy;
          if (this.cell(nx, ny) === 1 && this.room[this.idx(nx, ny)] < 0) { this.room[this.idx(nx, ny)] = id; st.push([nx, ny]); }
        }
      }
      id++;
    }
    this.roomCount = id;
  }
  roomAt(x, y) { x = Math.floor(x); y = Math.floor(y); return this.inb(x, y) ? this.room[this.idx(x, y)] : -1; }
};

// двоичная куча для A*
K.Heap = class {
  constructor() { this.k = []; this.p = []; }
  get size() { return this.k.length; }
  push(k, p) {
    const a = this.k, b = this.p; let i = a.length; a.push(k); b.push(p);
    while (i > 0) { const j = (i - 1) >> 1; if (b[j] <= p) break; a[i] = a[j]; b[i] = b[j]; i = j; }
    a[i] = k; b[i] = p;
  }
  pop() {
    const a = this.k, b = this.p, top = a[0], lk = a.pop(), lp = b.pop();
    if (a.length) {
      let i = 0; const n = a.length;
      for (;;) {
        let l = 2 * i + 1, r = l + 1, m = i, mp = lp;
        if (l < n && b[l] < mp) { m = l; mp = b[l]; }
        if (r < n && b[r] < mp) { m = r; mp = b[r]; }
        if (m === i) break;
        a[i] = a[m]; b[i] = b[m]; i = m;
      }
      a[i] = lk; b[i] = lp;
    }
    return top;
  }
};

K.clamp = (v, a, b) => v < a ? a : v > b ? b : v;
K.lerp = (a, b, t) => a + (b - a) * t;
K.angDiff = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a));
K.rand = (a, b) => a + Math.random() * (b - a);

// objects.js — мебель, предметы-пугалки, лампы
'use strict';
(function () {
const K = window.K;

// scare: snd — слышно (radius), vis — видно (надо смотреть в ту сторону), power — страх
K.KINDS = {
  clock:     { w: 1, h: 4, solid: 1, opaque: 1, poss: 1, scare: { snd: 1, power: 14, radius: 11, cd: 6, sfx: 'clock' } },
  rocker:    { w: 2, h: 2, solid: 1, opaque: 0, poss: 1, scare: { snd: 1, vis: 1, power: 16, radius: 7, cd: 6, sfx: 'creak' } },
  piano:     { w: 3, h: 2, solid: 1, opaque: 1, poss: 1, scare: { snd: 1, power: 18, radius: 12, cd: 8, sfx: 'piano' } },
  portrait:  { w: 2, h: 2, back: 1, poss: 1, scare: { vis: 1, power: 24, cd: 7, sfx: 'whisper' } },
  wardrobe:  { w: 2, h: 4, solid: 1, opaque: 1, poss: 1, scare: { snd: 1, vis: 1, power: 20, radius: 8, cd: 8, sfx: 'bang' } },
  curtain:   { w: 2, h: 3, back: 1, poss: 1, scare: { vis: 1, power: 26, cd: 9, sfx: 'whoosh' } },
  gramophone:{ w: 1, h: 2, solid: 1, opaque: 0, poss: 1, scare: { snd: 1, power: 20, radius: 13, cd: 10, sfx: 'gramo' } },
  doll:      { w: 1, h: 1, solid: 1, opaque: 0, poss: 1, scare: { snd: 1, vis: 1, power: 26, radius: 5, cd: 9, sfx: 'mama' } },
  tv:        { w: 2, h: 2, solid: 1, opaque: 1, poss: 1, scare: { snd: 1, vis: 1, power: 22, radius: 8, cd: 9, sfx: 'static', glow: 1 } },

K.makeObject = function (d, i) {
  const k = K.KINDS[d.k];
  if (!k) throw new Error('kind ' + d.k);
  return {
    i, k: d.k, x: d.x, y: d.y, w: d.w || k.w, h: d.h || k.h,
    solid: !!k.solid, opaque: !!k.opaque, back: !!k.back, poss: !!k.poss,
    scare: k.scare ? { ...k.scare, ...(d.scare || {}) } : null,
    cd: 0, anim: 0, used: 0, tint: d.tint, flip: d.flip, label: d.label,
    possessed: false, lockedBy: d.locked || null,
  };
};
K.objCenter = o => ({ x: o.x + o.w / 2, y: o.y + o.h / 2 });
K.objDist = (o, px, py) => {
  const dx = Math.max(o.x - px, 0, px - (o.x + o.w)), dy = Math.max(o.y - py, 0, py - (o.y + o.h));
  return Math.hypot(dx, dy);
};

// ---------- палитра (стиль 28) ----------
const P = K.PAL = {
  void: '#07080c', gloom: '#121a2b', gloom2: '#2a3654', cold: '#4a6a9a', lamp: '#ffd9a0', spot: '#fff0d6',
  accent: '#e0412f', screen: '#7dff9a', uv: '#9a7cff', paper: '#f1ece0', ink: '#05050a',
  cut: '#0b0f19', cutEdge: '#1b2438',
};
// тёмная версия цвета: в синий мрак (альбедо × мрак, тень всегда синяя)
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgb = (r, g, b) => `rgb(${r | 0},${g | 0},${b | 0})`;
const cache = new Map();
K.dark = function (h, k = 1) {
  const key = h + k;
  if (cache.has(key)) return cache.get(key);
  const [r, g, b] = hex(h);
  const l = (0.3 * r + 0.59 * g + 0.11 * b) / 255;
  const v = (0.22 + l * 0.78) * k;
  const out = rgb(11 + 22 * v, 15 + 31 * v, 27 + 56 * v);
  cache.set(key, out);
  return out;
};
K.shade = function (h, f) { const [r, g, b] = hex(h); return rgb(Math.min(255, r * f), Math.min(255, g * f), Math.min(255, b * f)); };
K.mix = function (a, b, t) { const A = hex(a), B = hex(b); return rgb(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t); };

// ---------- рисование предметов (в клетках) ----------
// lit = true — версия «в свете» (локальные цвета), false — синий мрак
function C(lit, h, k) { return lit ? h : K.dark(h, k); }
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
K.rr = rr;

K.drawObject = function (ctx, o, lit, t, G) {
  const { x, y, w, h } = o;
  const shake = o.anim > 0 ? Math.sin(t * 60) * 0.04 * o.anim : 0;
  ctx.save();
  ctx.translate(x + shake, y);
  const f = DRAW[o.k];
  if (f) f(ctx, o, lit, t, w, h, G); else { ctx.fillStyle = C(lit, '#6a5a4a'); ctx.fillRect(0, 0, w, h); }
  ctx.restore();
};

const wood = '#6b4a32', wood2 = '#4e3424', brass = '#b8924a', cloth = '#7a2e2a', cloth2 = '#3e5a6a';
const DRAW = {
  clock(ctx, o, lit, t, w, h) {
    ctx.fillStyle = C(lit, wood2); rr(ctx, 0.08, 0.1, 0.84, h - 0.1, 0.12); ctx.fill();
    ctx.fillStyle = C(lit, wood); rr(ctx, 0.0, 0.0, 1, 1.15, [0.45, 0.45, 0.05, 0.05]); ctx.fill();
    ctx.fillStyle = C(lit, '#e8dcc0'); ctx.beginPath(); ctx.arc(0.5, 0.62, 0.33, 0, 7); ctx.fill();
    ctx.strokeStyle = C(lit, '#2a1a10'); ctx.lineWidth = 0.05; ctx.beginPath();
    const a1 = t * 0.4 + (o.anim > 0 ? t * 20 : 0), a2 = t * 0.05;
    ctx.moveTo(0.5, 0.62); ctx.lineTo(0.5 + Math.cos(a1) * 0.25, 0.62 + Math.sin(a1) * 0.25);
    ctx.moveTo(0.5, 0.62); ctx.lineTo(0.5 + Math.cos(a2) * 0.17, 0.62 + Math.sin(a2) * 0.17); ctx.stroke();
    ctx.fillStyle = C(lit, '#1e140c'); rr(ctx, 0.25, 1.5, 0.5, 1.8, 0.2); ctx.fill();

    ctx.fillStyle = C(lit, brass); ctx.beginPath(); ctx.arc(0.5 + sw * 0.6, 2.95, 0.14, 0, 7); ctx.fill();
  },
  rocker(ctx, o, lit, t, w, h) {
    const rock = o.anim > 0 ? Math.sin(t * 9) * 0.22 : Math.sin(t * 0.7) * 0.02;

  piano(ctx, o, lit, t, w, h) {

    for (let i = 0; i < 13; i++) if (i % 7 !== 2 && i % 7 !== 6) ctx.fillRect(0.28 + i * 0.205, 0.55, 0.1, 0.17);
    if (o.anim > 0) { ctx.fillStyle = C(lit, '#e8e0cc'); ctx.fillRect(0.15 + ((t * 13) % 2.6), 0.55, 0.12, 0.3); }
    ctx.fillStyle = C(lit, brass); ctx.fillRect(0.3, -0.35, 0.5, 0.06); ctx.fillRect(2.2, -0.35, 0.5, 0.06);
    ctx.fillStyle = C(lit, '#3a2620'); ctx.fillRect(0.1, 0.95, 0.18, 1.05); ctx.fillRect(2.72, 0.95, 0.18, 1.05);
  },
  portrait(ctx, o, lit, t, w, h, G) {
    ctx.fillStyle = C(lit, brass); rr(ctx, 0, 0, w, h, 0.06); ctx.fill();
    ctx.fillStyle = C(lit, '#3a2e3e'); ctx.fillRect(0.18, 0.18, w - 0.36, h - 0.36);
    // строгая дама/господин
    ctx.fillStyle = C(lit, '#c9a888'); ctx.beginPath(); ctx.ellipse(w / 2, 0.85, 0.32, 0.4, 0, 0, 7); ctx.fill();
    ctx.fillStyle = C(lit, '#20182a'); ctx.beginPath(); ctx.moveTo(w / 2 - 0.62, h - 0.18); ctx.quadraticCurveTo(w / 2, 1.05, w / 2 + 0.62, h - 0.18); ctx.fill();

    // глаза следят
    let ex = 0; if (o.anim > 0 || o.possessed) { const p = G && G.blot ? G.nearestPersonX(o) : null; ex = p == null ? Math.sin(t * 2) * 0.05 : K.clamp((p - (o.x + w / 2)) * 0.03, -0.07, 0.07); }
    ctx.fillStyle = o.anim > 0 ? (lit ? '#ffe9b0' : '#d8c890') : C(lit, '#f4ead4');
    ctx.beginPath(); ctx.ellipse(w / 2 - 0.13, 0.85, 0.07, 0.05, 0, 0, 7); ctx.ellipse(w / 2 + 0.13, 0.85, 0.07, 0.05, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#100a08'; ctx.beginPath(); ctx.arc(w / 2 - 0.13 + ex, 0.85, 0.035, 0, 7); ctx.arc(w / 2 + 0.13 + ex, 0.85, 0.035, 0, 7); ctx.fill();

  wardrobe(ctx, o, lit, t, w, h) {

    ctx.fillStyle = C(lit, wood); ctx.fillRect(0.1, 0.25, 0.85 - open * 0.6, h - 0.4); ctx.fillRect(1.05 + open * 0.6, 0.25, 0.85 - open * 0.6, h - 0.4);

    ctx.fillStyle = C(lit, brass); ctx.fillRect(0.85 - open * 0.6, 1.8, 0.06, 0.25); ctx.fillRect(1.09 + open * 0.6, 1.8, 0.06, 0.25);

  curtain(ctx, o, lit, t, w, h) {
    ctx.fillStyle = C(lit, '#20304a'); ctx.fillRect(0.2, 0.3, w - 0.4, h - 0.6); // окно
    ctx.fillStyle = C(lit, '#c8d4e8', 0.8); ctx.beginPath(); ctx.arc(w * 0.62, 0.9, 0.22, 0, 7); ctx.fill();

      ctx.fillStyle = '#05050a'; ctx.beginPath(); ctx.ellipse(w / 2 - 0.15, 0.8, 0.08, 0.12, 0, 0, 7); ctx.ellipse(w / 2 + 0.15, 0.8, 0.08, 0.12, 0, 0, 7); ctx.ellipse(w / 2, 1.25, 0.1, 0.16, 0, 0, 7); ctx.fill();

  gramophone(ctx, o, lit, t, w, h) {

  },
  doll(ctx, o, lit, t, w, h) {

// meta.js — сохранения, настройки, улучшения, награды, концовка
'use strict';
(function () {
const K = window.K;
const SKEY = 'klyaksa.settings.v1', PKEY = 'klyaksa.progress.v1';
const load = k => { try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch (e) { return null; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } };

K.settings = Object.assign({ lang: (navigator.language || 'ru').startsWith('ru') ? 'ru' : 'en', sfx: 0.8, mus: 0.6, shake: 1 }, load(SKEY) || {});
K.lang = K.settings.lang;
K.saveSettings = () => { save(SKEY, K.settings); K.lang = K.settings.lang; K.audio && K.audio.applyVolumes(); };

const fresh = () => ({ done: {}, reached: 1, bank: 0, up: { thick: 0, cap: 0, flow: 0, dread: 0, quiet: 0 }, pages: [], choices: {}, fame: 0, seen: {}, guide: [], ending: null, total: 0 });
K.prog = Object.assign(fresh(), load(PKEY) || {});
K.saveProg = () => save(PKEY, K.prog);
K.resetProg = () => { K.prog = fresh(); K.saveProg(); };

// умения по уровням
K.ABIL_AT = { 1: ['possess'], 2: ['knock'], 3: ['lamp'], 4: ['write'], 5: ['grin'], 6: ['drop'], 10: ['shadow'], 12: ['giant'] };
K.abilitiesFor = id => {
  const top = Math.max(id, Math.min(K.prog.reached, 11));
  const out = [];
  for (const k in K.ABIL_AT) if (+k <= top && (+k !== 12 || id === 12)) out.push(...K.ABIL_AT[k]);
  return out;
};
K.UPS = ['thick', 'cap', 'flow', 'dread', 'quiet'];
K.UP_COST = [60, 130, 220];
K.unlockGuide = k => { if (!K.prog.guide.includes(k)) { K.prog.guide.push(k); K.saveProg(); return true; } return false; };

// итог ночи → награда
K.finishLevel = function (G) {
  const L = G.L, P = K.prog;
  const stars = G.stars();
  const prev = P.done[L.id] || { stars: [false, false, false] };
  const merged = prev.stars.map((s, i) => s || stars[i]);
  const newStars = merged.filter(Boolean).length - prev.stars.filter(Boolean).length;
  let reward = Math.round(G.stat.fear / 4) + newStars * 15;
  let pageNew = false;
  if (G.stat.pages && !P.pages.includes(L.id)) { P.pages.push(L.id); pageNew = true; reward += 20; }
  P.done[L.id] = { stars: merged };
  P.bank += reward; P.total += reward;
  if (L.id + 1 > P.reached) P.reached = Math.min(K.LEVELS.length, L.id + 1);
  if (!prev.won) P.fame = Math.min(100, P.fame + 6 + G.stat.maxCombo * 2);
  P.done[L.id].won = true;
  K.saveProg();
  return { stars, reward, pageNew, newStars };
};
K.ending = function () {
  const P = K.prog;
  if (P.choices.semyon === 'show' && P.pages.length >= 9) return 'master';
  if (P.choices.keys === 'return') return 'apprentice';
  return 'house';
};
})();

      if (i === 0 && bar % 2 === 1 && this.mode !== 'menu') {
        const at = this.next - c.currentTime;
        const o = this.tone(659, dur * 7, { type: 'sine', vol: 0.03, at: Math.max(0, at), a: 0.4, d: 0.3, bus: this.musG, verb: 0.9, glide: 494 });

'use strict';
(function () {
const K = window.K;

K.Blot = class {
  constructor(G, sx, sy) {
    this.G = G;
    this.cx = sx; this.cy = sy;
    this.x = sx + 0.5; this.y = sy + 0.5;
    this.path = []; this.seg = null;
    this.maxInk = 100 * (1 + 0.25 * G.up('cap'));
    this.ink = this.maxInk * 0.8;
    this.speed = 6.2 * (1 + 0.12 * G.up('flow'));
    this.inside = null;          // объект, в который вселились
    this.spot = 0;               // кольцо «замечен» 0..1
    this.exposed = 0;            // доля тела в луче фонаря
    this.lampLit = 0;
    this.uvLit = 0;
    this.vx = 0; this.vy = 0;
    this.nx = 0; this.ny = 1;    // нормаль к поверхности (в сторону поверхности)
    this.t = 0; this.grin = 0; this.scareAnim = 0; this.burn = 0;
    this.trail = []; this.trailT = 0;
    this.lookX = 1; this.lookY = 0;
    this.pts = null; this.giant = 0;
    this.falling = false; this.hitT = 0;
    this.travel = 0;
  }
  get r() { return (0.36 + 0.24 * K.clamp(this.ink / 100, 0, 1.4)) * (1 + this.giant * 2.6); }
  moveTo(px, py) {
    const W = this.G.world;
    const tgt = W.nearestCling(px, py, 7);
    if (!tgt) return false;
    // старт — текущая клетка (или следующая, если сейчас между клетками)
    const from = this.seg ? { x: this.seg.x, y: this.seg.y } : { x: this.cx, y: this.cy };
    const path = W.blotPath(from.x, from.y, tgt.x, tgt.y);
    if (!path) return false;
    if (this.inside) this.leave();
    this.path = path;
    this.target = tgt;
    return true;
  }
  stop() { this.path = []; }
  leave() {
    if (!this.inside) return;
    this.inside.possessed = false;
    this.inside = null;
    this.G.sfx('squish');
  }
  enter(o) {
    if (this.inside === o) return;
    if (this.inside) this.leave();

  update(dt) {

          if (!this.path.length) break;
          this.seg = this.path.shift();
        }
        const tx = this.seg.x + 0.5, ty = this.seg.y + 0.5;
        const dx = tx - this.x, dy = ty - this.y, d = Math.hypot(dx, dy);
        const sp = this.seg.drop ? 2.4 : 1;
        this.falling = !!this.seg.drop;
        if (d <= budget * sp) {
          this.x = tx; this.y = ty; budget -= d / sp;
          this.cx = this.seg.x; this.cy = this.seg.y;
          if (this.seg.drop) { G.sfx('splat'); G.noiseAt(this.x, this.y, 2.2, 'splat'); this.hitT = 0.25; }

        } else {

      if (W.solidForBlot(ix - 1, iy)) nx -= 1;

          this.trailT = 0.18;

    while (this.trail.length && this.trail[0].t > 14) this.trail.shift();
    // смотреть: на ближайшего человека или по ходу
    const p = G.nearestPerson(this.x, this.y, 9);
    let lx = this.vx, ly = this.vy;
    if (p) { lx = p.x - this.x; ly = (p.feet - 2.3) - this.y; }

  samples() {

      else k *= 1 + 0.1 * -dn;

      if (this.falling) { if (dy < -0.3) k *= 1.25; }
      if (this.burn > 0) k *= 1 + Math.sin(t * 40 + i * 3) * 0.08;

        const a = Math.atan2(n[1], n[0]) + (j - 1) * 0.9 + Math.sin(t * 1.3 + j) * 0.25;
        const len = r * (1.15 + 0.35 * Math.sin(t * 1.7 + j * 2));
        ctx.lineWidth = r * 0.16;
        ctx.beginPath(); ctx.moveTo(cx, cy);
        ctx.quadraticCurveTo(cx + Math.cos(a + 0.5) * len * 0.6, cy + Math.sin(a + 0.5) * len * 0.6, cx + Math.cos(a) * len, cy + Math.sin(a) * len);

      }
    }

    }

    ctx.fillStyle = K.PAL.ink;
    ctx.beginPath(); ctx.ellipse(ex, ey + 0.05, r * 0.95, r * 0.42, 0, 0, 7); ctx.fill();

    ctx.restore();
  }
  drawRing(ctx, s) {
    // кольцо «замечен» вокруг кляксы (рисуется в экранных координатах снаружи)
  }
};
})();

'use strict';
(function () {
const K = window.K;

  { base: '#6e5a72', pat: '#7c687f', k: 'dots' },

  // масштаб и камера
  frame(G, dt, focus) {

  // перевод мир → экран (css px)
  toScreen(x, y) {

      if (W.cell(x, y) !== 3) continue;

      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) if (W.cell(x + dx, y + dy) === 1) { c.fillStyle = lit ? '#7a8a9a' : '#2c3a56'; c.fillRect(x + 0.5 + dx * 0.45 - 0.3 * Math.abs(dy) - 0.06 * Math.abs(dx), y + 0.5 + dy * 0.45 - 0.3 * Math.abs(dx) - 0.06 * Math.abs(dy), Math.abs(dy) * 0.6 + Math.abs(dx) * 0.12, Math.abs(dx) * 0.6 + Math.abs(dy) * 0.12); }
    }
    // лестницы
    for (const s of G.world.stairs) {
      const x0 = s.x0 + 0.5, y0 = s.y0 + 1, x1 = s.x1 + 0.5, y1 = s.y1 + 1;

      c.fillStyle = lit ? '#5a3e2a' : '#19223a'; c.fillRect(b.x0, y - 0.08, b.x1 - b.x0, 0.12);
      c.fillRect(b.x0, y - 1.05, b.x1 - b.x0, 0.08);

  }
  // ---------- небо и улица ----------
  drawSky(ctx, G, t) {
    const cw = this.cv.width, ch = this.cv.height;

    ctx.fillStyle = P.void; ctx.fillRect(0, 0, cw, ch);

    ctx.fillStyle = '#c8d4e8'; ctx.beginPath(); ctx.arc(W.w + 3.5, -3, 1.3, 0, 7); ctx.fill();
    ctx.fillStyle = P.void; ctx.beginPath(); ctx.arc(W.w + 4.0, -3.3, 1.15, 0, 7); ctx.fill();
    ctx.fillStyle = '#9aa8c0';
    for (let i = 0; i < 40; i++) { const x = ((i * 97.3) % (W.w + 50)) - 25, y = -8 + ((i * 37.1) % 9); ctx.fillRect(x, y, 0.07, 0.07); }

    ctx.fillStyle = '#0a0f1a';
    ctx.fillRect(-14, W.h - 9, 9, 9); ctx.beginPath(); ctx.moveTo(-15, W.h - 9); ctx.lineTo(-9.5, W.h - 13); ctx.lineTo(-4, W.h - 9); ctx.fill();
    ctx.fillRect(W.w + 5, W.h - 7, 10, 7);
    for (const tx of [-3.2, W.w + 2.6]) { ctx.beginPath(); ctx.arc(tx, W.h - 5, 2.2, 0, 7); ctx.arc(tx + 1, W.h - 6.5, 1.6, 0, 7); ctx.fill(); ctx.fillRect(tx - 0.15, W.h - 4, 0.3, 4); }

  }

  // ---------- кадр ----------
  draw(G, t, ui) {
    const ctx = this.ctx, lctx = this.lctx, mctx = this.mctx, d = this.dpr;
    this.resize();
    // тряска
    this.sx = this.sy = 0;
    if (G.shakeT > 0) { const a = G.shakeT * 10; this.sx = (Math.random() - 0.5) * a; this.sy = (Math.random() - 0.5) * a; }
    this.buildCache(G);
    const [ox, oy] = this.toScreen(-1, -1);
    const k = this.cam.s * d / this.cacheS;
    this.drawSky(ctx, G, t);
    // тёмный слой
    ctx.setTransform(k, 0, 0, k, ox * d, oy * d);
    ctx.drawImage(this.cDark, 0, 0);
    this.worldTf(ctx);
    this.drawDynamic(ctx, G, t, false);

    lctx.setTransform(1, 0, 0, 1, 0, 0); lctx.globalCompositeOperation = 'source-over';
    lctx.clearRect(0, 0, this.lit.width, this.lit.height);
    lctx.setTransform(k, 0, 0, k, ox * d, oy * d);
    lctx.drawImage(this.cLit, 0, 0);
    this.worldTf(lctx);
    this.drawDynamic(lctx, G, t, true);

    lctx.globalCompositeOperation = 'screen'; lctx.fillStyle = 'rgba(70,40,10,0.35)'; lctx.fillRect(0, 0, this.lit.width, this.lit.height);
    lctx.globalCompositeOperation = 'source-over';
    mctx.setTransform(1, 0, 0, 1, 0, 0); mctx.globalCompositeOperation = 'source-over';
    mctx.clearRect(0, 0, this.mask.width, this.mask.height);
    this.worldTf(mctx);
    mctx.globalCompositeOperation = 'lighten';
    for (const L of G.lights) {
      // свет мягко гаснет к краю дальности
      const a0 = L.kind === 'uv' ? 0.55 : L.alpha;
      const g = mctx.createRadialGradient(L.x, L.y, 0, L.x, L.y, Math.max(1, L.range));
      const soft = L.kind === 'lamp' ? [1, 0.8, 0.18] : L.kind === 'camflash' || L.kind === 'flood' ? [1, 1, 0.8] : [1, 0.92, 0.4];
      g.addColorStop(0, `rgba(255,255,255,${a0 * soft[0]})`); g.addColorStop(0.55, `rgba(255,255,255,${a0 * soft[1]})`); g.addColorStop(1, `rgba(255,255,255,${a0 * soft[2]})`);
      mctx.fillStyle = g;
      poly(mctx, L.poly); mctx.fill();
    }
    lctx.setTransform(1, 0, 0, 1, 0, 0);
    lctx.globalCompositeOperation = 'destination-in';
    lctx.drawImage(this.mask, 0, 0);
    lctx.globalCompositeOperation = 'source-over';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(this.lit, 0, 0);
    // дымка лучей и пылинки
    this.worldTf(ctx);
    ctx.globalCompositeOperation = 'lighter';
    for (const L of G.lights) {
      const col = L.kind === 'uv' ? '154,124,255' : L.kind === 'lamp' ? '255,217,160' : '255,240,214';
      const a = L.kind === 'lamp' ? 0.05 : L.kind === 'camflash' ? 0.5 : L.kind === 'uv' ? 0.16 : 0.1;
      ctx.fillStyle = `rgba(${col},${a})`; poly(ctx, L.poly); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,240,214,0.55)';
    for (const L of G.lights) {
      if (L.kind === 'lamp' || L.kind === 'camflash') continue;
      for (let i = 0; i < 14; i++) {
        const m = this.motes[(i * 7 + (L.p ? L.p.i * 13 : 0)) % this.motes.length];
        const r = ((m.u + t * 0.03 * (0.5 + m.s)) % 1) * L.range * 0.85, a = L.ang + (m.v - 0.5) * L.half * 1.6;
        const x = L.x + Math.cos(a) * r, y = L.y + Math.sin(a) * r + Math.sin(t + i) * 0.1;

      }
    }
    ctx.globalCompositeOperation = 'source-over';
    // следы чернил
    const B = G.blot;
    for (const p of B.trail) {
      const a = Math.max(0, 1 - p.t / 14) * (p.uv ? 1 : 0.6);
      ctx.fillStyle = p.uv ? `rgba(190,160,255,${a})` : `rgba(5,5,10,${a})`;
      ctx.beginPath(); ctx.ellipse(p.x, p.y, 0.12, 0.08, 0, 0, 7); ctx.fill();
    }
    // путь
    if (B.path.length && !B.inside) {

      B.path.forEach((n, i) => { if (i % 2 === 0) { ctx.beginPath(); ctx.arc(n.x + 0.5, n.y + 0.5, 0.06, 0, 7); ctx.fill(); } });
      const e = B.path[B.path.length - 1];
      ctx.strokeStyle = 'rgba(241,236,224,0.55)'; ctx.lineWidth = 0.05; ctx.beginPath(); ctx.arc(e.x + 0.5, e.y + 0.5, 0.35 + Math.sin(t * 6) * 0.04, 0, 7); ctx.stroke();
    }
    // тень-великан на стене
    for (const f of G.fx) if (f.k === 'shadow') this.drawGiantShadow(ctx, G, f, t);
    // клякса
    B.draw(ctx, t, B.exposed > 0 || B.lampLit > 0);
    // эффекты
    for (const f of G.fx) {
      const u = 1 - f.t / f.max;
      if (f.k === 'ring') { ctx.strokeStyle = `rgba(241,236,224,${1 - u})`; ctx.lineWidth = 0.06; ctx.beginPath(); ctx.arc(f.x, f.y, 0.3 + u * 1.4, 0, 7); ctx.stroke(); }
      if (f.k === 'wave') { ctx.strokeStyle = `rgba(241,236,224,${0.5 * (1 - u)})`; ctx.lineWidth = 0.05; ctx.setLineDash([0.2, 0.2]); ctx.beginPath(); ctx.arc(f.x, f.y, u * f.r, 0, 7); ctx.stroke(); ctx.setLineDash([]); }
      if (f.k === 'drip') { ctx.fillStyle = P.ink; ctx.beginPath(); ctx.ellipse(f.x, K.lerp(f.y, f.ty, u * u), 0.1, 0.16, 0, 0, 7); ctx.fill(); }
    }
    // колбаса
    if (G.sausage) { ctx.fillStyle = '#b8483a'; ctx.beginPath(); ctx.ellipse(G.sausage.x, G.sausage.y - 0.12, 0.35, 0.12, 0.2, 0, 7); ctx.fill(); }
    // вспышка

    // надписи мира (экранные)
    ctx.setTransform(d, 0, 0, d, 0, 0);
    this.drawWorldUI(ctx, G, t, ui);
  }
  drawDynamic(ctx, G, t, lit) {
    const W = G.world;
    // надписи на стене
    for (const w of G.writings) {
      ctx.save(); ctx.translate(w.x, w.y);
      ctx.font = `600 0.8px Jost, sans-serif`; ctx.textAlign = 'center';
      ctx.fillStyle = lit ? '#0a0608' : '#0b0f1a';
      ctx.fillText(w.txt, 0, 0.3);
      ctx.fillRect(-0.05, 0.35, 0.08, 0.35);
      ctx.restore();
    }
    for (const o of W.objects) if (o.poss) K.drawObject(ctx, o, lit, t, G);
    for (const l of G.lamps) K.drawLamp(ctx, { ...l, on: l.on && !G.blackout }, lit, t);
    // мотыльки у горящих ламп
    if (lit) for (const l of G.lamps) if (l.on && !G.blackout) for (let i = 0; i < 2; i++) {
      const ph = t * (2.2 + i * 0.7) + l.x * 1.7 + i * 3;
      const mx = l.x + 0.5 + Math.cos(ph) * (0.55 + 0.2 * Math.sin(ph * 1.7)), my = l.y + 1.05 + Math.sin(ph * 1.3) * 0.3;
      ctx.fillStyle = '#3a3026'; ctx.beginPath(); ctx.ellipse(mx, my, 0.07, 0.04 + 0.03 * Math.abs(Math.sin(t * 30 + i)), 0, 0, 7); ctx.fill();
    }
    // капли чернил и страница
    for (const dd of W.drops) if (!dd.taken) {
      const b = Math.sin(t * 3 + dd.x) * 0.06;
      ctx.fillStyle = lit ? '#120e1a' : '#05050a';
      ctx.beginPath(); ctx.moveTo(dd.x, dd.y - 0.32 + b); ctx.quadraticCurveTo(dd.x + 0.24, dd.y + 0.05 + b, dd.x, dd.y + 0.15 + b); ctx.quadraticCurveTo(dd.x - 0.24, dd.y + 0.05 + b, dd.x, dd.y - 0.32 + b); ctx.fill();
      ctx.fillStyle = lit ? '#ffd9a0' : '#5a7aaa'; ctx.beginPath(); ctx.arc(dd.x - 0.06, dd.y - 0.02 + b, 0.04, 0, 7); ctx.fill();
    }
    const pg = W.page;
    if (pg && !pg.taken) {
      ctx.save(); ctx.translate(pg.x, pg.y + Math.sin(t * 2) * 0.05); ctx.rotate(-0.15);
      ctx.fillStyle = lit ? '#efe4c8' : '#3a4664'; ctx.fillRect(-0.3, -0.38, 0.6, 0.76);
      ctx.fillStyle = lit ? '#2a2220' : '#1a2238'; for (let i = 0; i < 4; i++) ctx.fillRect(-0.2, -0.24 + i * 0.15, 0.4 - (i % 2) * 0.12, 0.04);
      ctx.restore();
    }
    // люди: сначала дальние (собака поверх)
    const ps = G.people.slice().sort((a, b) => (a.T.dog ? 1 : 0) - (b.T.dog ? 1 : 0));
    for (const p of ps) p.draw(ctx, lit, t);
  }
  drawGiantShadow(ctx, G, f, t) {
    const u = 1 - f.t / f.max, a = Math.min(1, u * 4) * Math.min(1, f.t * 2);
    const sc = 2.6 + u * 0.6;
    ctx.save(); ctx.globalAlpha = 0.92 * a;
    ctx.translate(f.x, f.y - 1.2); ctx.scale(sc, sc);
    ctx.fillStyle = '#04040a';
    ctx.beginPath();
    for (let i = 0; i <= 24; i++) { const an = i / 24 * Math.PI * 2, r = 0.62 + Math.sin(an * 5 + t * 6) * 0.12 + (Math.sin(an) < 0 ? 0.2 : 0); ctx.lineTo(Math.cos(an) * r, Math.sin(an) * r * 0.85); }
    ctx.fill();
    for (let j = 0; j < 5; j++) { const an = -Math.PI + j * 0.6 + 0.3; ctx.beginPath(); ctx.moveTo(Math.cos(an) * 0.5, Math.sin(an) * 0.4); ctx.quadraticCurveTo(Math.cos(an) * 1.0, Math.sin(an) * 0.9 + Math.sin(t * 4 + j) * 0.1, Math.cos(an) * 1.25, Math.sin(an) * 1.1); ctx.lineWidth = 0.1; ctx.strokeStyle = '#04040a'; ctx.stroke(); }
    G.blot.drawEyes(ctx, 0, -0.1, 0.6, t);
    G.blot.drawMouth(ctx, 0, 0.18, 0.6, 1);
    ctx.restore();
  }
  // ---------- подписи, шкалы, реплики (экранные координаты, css px) ----------
  drawWorldUI(ctx, G, t, ui) {
    const B = G.blot, cw = this.cv.clientWidth, ch = this.cv.clientHeight;
    const top = this.hud.top, bot = ch - this.hud.bottom;
    ctx.textBaseline = 'alphabetic';
    // объекты рядом: отметки «можно вселиться»
    for (const o of G.world.objects) {
      if (!o.poss || o.possessed) continue;
      const d = K.objDist(o, B.x, B.y);
      if (d > 7) continue;
      const [sx, sy] = this.toScreen(o.x + o.w / 2, o.y - 0.25);
      const near = d < 1.2;
      const a = near ? 1 : 0.45;
      // метка «можно вселиться»: кольцо с глазом-щёлкой
      ctx.strokeStyle = `rgba(241,236,224,${a})`; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(sx, sy - 2, 6.5, 0, 7); ctx.stroke();
      ctx.fillStyle = `rgba(241,236,224,${a})`;
      ctx.beginPath(); ctx.ellipse(sx, sy - 2, 3.2, 1.5, 0, 0, 7); ctx.fill();
      if (o.cd > 0) { ctx.strokeStyle = 'rgba(224,65,47,0.9)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(sx, sy - 2, 9, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (o.cd / o.scare.cd)); ctx.stroke(); }
    }
    // предсказание пугалки
    const pred = ui && ui.predict;
    const bubbles = [];
    const heads = [];
    for (const p of G.people) {
      if (p.gone || p.state === 'wait') continue;
      let [hx, hy] = this.toScreen(p.x, p.feet - p.T.h - 0.35);
      // подписи стоящих рядом людей не налезают друг на друга
      for (let k = 0; k < 4; k++) { const q = heads.find(q => Math.abs(q[0] - hx) < 64 && Math.abs(q[1] - hy) < 22); if (!q) break; hy = q[1] - 24; }
      heads.push([hx, hy]);
      // шкала страха: линия 1px + красная заливка 3px
      if (!p.T.dog) {
        const w = 46, x0 = hx - w / 2, y0 = hy - 6;
        ctx.fillStyle = 'rgba(7,8,12,0.55)'; ctx.fillRect(x0 - 1, y0 - 3, w + 2, 6);
        ctx.fillStyle = 'rgba(241,236,224,0.5)'; ctx.fillRect(x0, y0, w, 1);
        ctx.fillStyle = P.accent; ctx.fillRect(x0, y0 - 2, w * p.fear / 100, 4);
        if (pred) { const r = pred.find(q => q.p === p); if (r && r.v > 0) { ctx.fillStyle = 'rgba(224,65,47,0.45)'; ctx.fillRect(x0 + w * p.fear / 100, y0 - 2, Math.min(w * (1 - p.fear / 100), w * r.v / 100), 4); } }
        ctx.font = '500 11px Jost, sans-serif'; ctx.fillStyle = 'rgba(241,236,224,0.8)'; ctx.textAlign = 'center';
        ctx.fillText(K.pname(p.id), hx, y0 - 6);
      }
      if (pred) {
        const r = pred.find(q => q.p === p);
        if (r) this.drawSense(ctx, hx + 30, hy - 8, r);
      }
      if (p.flashWarn > 0) {
        ctx.font = '600 16px Jost, sans-serif'; ctx.fillStyle = P.accent; ctx.textAlign = 'center';
        ctx.fillText(String(Math.ceil(p.flashWarn / 0.5)), hx, hy - 30);
      }
      if (p.state === 'investigate' || p.state === 'look' || p.startle > 0) {
        ctx.font = '600 15px Jost, sans-serif'; ctx.fillStyle = p.startle > 0 ? P.accent : P.lamp; ctx.textAlign = 'center';
        if (!p.T.dog) ctx.fillText(p.startle > 0 ? '!' : '?', hx - 30, hy - 3);
      }
      if (p.bubble) bubbles.push({ p, hx, hy });
    }
    // кто за краем экрана: стрелка у края с именем и страхом
    ctx.font = '500 11px Jost, sans-serif';
    for (const p of G.people) {
      if (p.gone || p.state === 'wait') continue;
      const [px, py] = this.toScreen(p.x, p.feet - 1.5);
      if (px > -4 && px < cw + 4 && py > top - 4 && py < bot + 4) continue;
      const cx = cw / 2, cy = (top + bot) / 2, dx = px - cx, dy = py - cy;
      const k = Math.min((cw / 2 - 26) / Math.abs(dx || 1e-3), ((bot - top) / 2 - 26) / Math.abs(dy || 1e-3));
      const ex = cx + dx * k, ey = cy + dy * k, an = Math.atan2(dy, dx);
      ctx.save(); ctx.translate(ex, ey); ctx.rotate(an);
      ctx.fillStyle = p.state === 'flee' ? 'rgba(241,236,224,0.35)' : p.light && p.state !== 'patrol' ? P.lamp : 'rgba(241,236,224,0.8)';
      ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-4, -7); ctx.lineTo(-1, 0); ctx.lineTo(-4, 7); ctx.closePath(); ctx.fill();
      ctx.restore();
      if (!p.T.dog) {
        const lx = K.clamp(ex - Math.cos(an) * 22, 30, cw - 30), ly = K.clamp(ey - Math.sin(an) * 18, top + 12, bot - 6);
        ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(241,236,224,0.75)'; ctx.fillText(K.pname(p.id).split(' ')[0], lx, ly);
        ctx.fillStyle = 'rgba(241,236,224,0.4)'; ctx.fillRect(lx - 15, ly + 4, 30, 1);
        ctx.fillStyle = P.accent; ctx.fillRect(lx - 15, ly + 3, 30 * p.fear / 100, 3);
      }
    }
    // реплики: висят в темноте рядом с головой, тонкая линия к голове
    ctx.font = '400 14px Jost, sans-serif';
    const placed = heads.map(h => ({ x: h[0] - 34, y: h[1] - 4, w: 68 }));
    // не больше двух реплик сразу: ближние к нам важнее
    bubbles.sort((a, b) => Math.abs(a.p.x - B.x) - Math.abs(b.p.x - B.x)).splice(2);
    for (const b of bubbles) {
      const txt = b.p.bubble.txt, w = ctx.measureText(txt).width;
      let x = b.hx + 18, y = b.hy - 26;
      if (x + w > cw - 12) x = b.hx - 18 - w;

K.Tut = class {
  constructor(G, key) {
    this.G = G; this.key = key;
    this.steps = (K.TUTS[key] || (() => []))(G);
    this.i = -1; this.done = !this.steps.length;
    this.hint = null; this.hintT = 0;
    this.waiting = false;
    G.on((ev, a, b) => this.onEvent(ev, a, b));
    this.next();
  }
  get step() { return this.steps[this.i]; }
  next() {
    this.i++; this.acc = 0; this.hint = null; this.canSkip = false;
    while (this.step && this.step.skipIf && this.step.skipIf(this.G)) this.i++;
    const s = this.step;
    if (!s) { this.done = true; this.G.tutHold = false; this.G.opts.allow = null; K.ui && K.ui.tutChanged(this); return; }
    this.waiting = !!s.waitEv && !(s.waitTest && this.G.people.some(p => p.state !== 'wait' && p.state !== 'held' && s.waitTest(p)));
    this.apply();
    K.ui && K.ui.tutChanged(this);
  }
  apply() {
    const s = this.step, G = this.G;
    if (this.waiting) { G.tutHold = false; G.opts.allow = null; return; }
    if (s.start) s.start(G);
    G.tutHold = !!s.hold;
    G.opts.allow = s.allow ? (id => s.allow.includes(id)) : null;
    this.startedAt = G.time;
  }
  onEvent(ev, a, b) {
    if (this.done) return;
    const s = this.step;
    if (this.waiting) {
      if (ev === s.waitEv && (!s.waitTest || s.waitTest(a))) { this.waiting = false; this.apply(); K.ui && K.ui.tutChanged(this); }
      return;
    }
    if (s.hint) { const h = s.hint(ev, a, b); if (h) { this.hint = h; this.hintT = 4; K.ui && K.ui.tutChanged(this); } }
    if (s.until && s.until.ev === ev && (!s.until.test || s.until.test(a, b))) this.next();
  }
  update(dt) {
    if (this.done || this.waiting) return;
    const s = this.step;
    if (this.hintT > 0) { this.hintT -= dt; if (this.hintT <= 0) { this.hint = null; K.ui && K.ui.tutChanged(this); } }
    if (s.check && s.check(this.G, this)) this.next();
    // шаг-задание без заморозки можно пропустить, если долго не выходит
    if (!s.ok && !s.hold && !this.canSkip && this.G.time - this.startedAt > 25 && this.key !== 'L1') { this.canSkip = true; K.ui && K.ui.tutChanged(this); }
  }
  ok() { const s = this.step; if (s && (s.ok || this.canSkip) && !this.waiting) this.next(); }
  skip() { this.i = this.steps.length - 1; this.next(); this.G.people.forEach(p => { if (p.state === 'held') p.state = 'patrol'; }); }
};

  finish() {
    const G = this.G;
    if (this.tut && (this.tut.done || G.state === 'win')) K.prog.seen[this.tut.key] = 1;
    if (G.state === 'win') {
      const res = K.finishLevel(G);
      this.lastRes = res;
      K.ui.result(G, res);
    } else {
      K.ui.result(G, null);
    }
    this.G = null; this.tut = null; K.ui.tutChanged(null);
  },
  afterWin(G, res) {
    const id = G.L.id;
    if (this.opts.replay) { K.ui.toast(K.t('tutDone')); return K.ui.menu(); }
    const goNext = () => {
      if (res.pageNew) return K.ui.page(id - 1, () => cont());
      cont();
    };
    const cont = () => {
      if (id >= K.LEVELS.length) { K.prog.ending = K.ending(); K.saveProg(); return K.ui.ending(K.prog.ending); }
      K.ui.intro(K.LEVELS[id]);
    };
    K.ui.news(id, () => {
      const c = K.CHOICES[id];
      if (!c || K.prog.choices[c.key]) return goNext();
      if (c.key === 'dog' && !G.sausage) { K.prog.choices.dog = 'chase'; K.saveProg(); return K.ui.message(K.t('dogGone'), goNext); }
      K.ui.choice(c, v => {
        K.prog.choices[c.key] = v;
        if (['keep', 'scare', 'chase'].includes(v)) K.prog.bank += 30;
        K.saveProg();
        K.ui.message(K.tt(K.CHOICE_RESULT[v]), goNext);
      });
    });
  },
  restart() { const id = this.G ? this.G.L.id : 1; const o = this.opts || {}; this.G = null; this.start(id, o.tut ? o : {}); },
  pause() { if (!this.G || this.paused) return; this.paused = true; K.ui.showHud(false); K.ui.tut.classList.add('hidden'); K.ui.pause(); },
  resume() { this.paused = false; K.ui.clear(); K.ui.showHud(true); K.ui.tutChanged(this.tut); },
  toMenu() { this.G = null; this.tut = null; this.paused = false; K.ui.tutChanged(null); K.ui.menu(); },
  doAction(id) {
    const G = this.G; if (!G || this.paused) return;
    if (id === 'end') { if (G.cleared) G.win(); return; }
    if (id === 'possess') { const o = G.nearObject(); if (o) G.act('possess', { obj: o }); return; }
    G.act(id);
  },
  // ---------- ввод ----------
  bindInput() {
    const cv = this.cv;
    // касание — течь; перетаскивание одним пальцем — осмотреться; щипок — масштаб
    const pts = new Map(); let drag = false, pinch = null;
    const R = this.R;
    cv.addEventListener('pointerdown', e => {
      K.audio.init();
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY });
      try { cv.setPointerCapture(e.pointerId); } catch (_) { }
      if (pts.size === 1) drag = false;
      if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, z: R.zoomMul }; drag = true; }
    });
    cv.addEventListener('pointermove', e => {
      const p = pts.get(e.pointerId); if (!p) return;
      const dx = e.clientX - p.x, dy = e.clientY - p.y;
      p.x = e.clientX; p.y = e.clientY;
      if (pinch && pts.size >= 2) { const [a, b] = [...pts.values()]; R.zoomMul = K.clamp(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, 0.6, 1.8); return; }
      if (!drag && Math.hypot(p.x - p.x0, p.y - p.y0) > 12) drag = true;
      if (drag && this.G) { R.pan.x -= dx / R.cam.s; R.pan.y -= dy / R.cam.s; R.panT = 4; }
    });
    const up = e => {
      const p = pts.get(e.pointerId); if (!p) return;
      pts.delete(e.pointerId);
      if (pts.size < 2) pinch = null;
      if (drag || e.type === 'pointercancel') { if (!pts.size) drag = false; return; }
      const G = this.G; if (!G || this.paused || G.state !== 'play') return;
      if (G.opts.allow && !G.opts.allow('move')) return;
      const [wx, wy] = R.toWorld(e.clientX, e.clientY);
      R.panT = 0;
      this.tapWorld(wx, wy);
    };
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);
    cv.addEventListener('wheel', e => { e.preventDefault(); this.R.zoomMul = K.clamp(this.R.zoomMul * (e.deltaY > 0 ? 0.9 : 1.1), 0.6, 1.8); }, { passive: false });
    window.addEventListener('keydown', e => {
      const G = this.G;
      if (e.key === 'Escape') { if (G && !this.paused) this.pause(); else if (G && this.paused) this.resume(); return; }
      if (!G || this.paused) return;
      const map = { 'e': 'possess', 'у': 'possess', '1': 'knock', '2': 'lamp', '3': 'write', '4': 'grin', '5': 'drop', '6': 'shadow', 'g': 'giant', 'п': 'giant', 'q': 'sausage', 'й': 'sausage' };
      if (e.key === ' ') {
        e.preventDefault();
        if (this.tut && !this.tut.done && this.tut.step && this.tut.step.ok) { this.tut.ok(); return; }
        const A = G.actions();
        const pick = ['scare', 'grin', 'drop', 'shadow', 'giant', 'possess'].map(id => A.find(a => a.id === id && a.ready)).find(Boolean);
        if (pick) this.doAction(pick.id);
        return;
      }
      if (e.key === 'Enter' && this.tut && !this.tut.done && this.tut.step && this.tut.step.ok) { this.tut.ok(); return; }
      if (e.key === 'Tab') { e.preventDefault(); this.R.overview = !this.R.overview; return; }
      const id = map[e.key.toLowerCase()];
      if (id) this.doAction(id);
    });
  },
  tapWorld(wx, wy) {
    const G = this.G, W = G.world, B = G.blot;
    this.pendingObj = null;
    // касание предмета — течём к нему и вселяемся
    let hit = null;
    for (const o of W.objects) if (o.poss && wx > o.x - 0.35 && wx < o.x + o.w + 0.35 && wy > o.y - 0.35 && wy < o.y + o.h + 0.35) hit = o;
    if (hit && (!G.opts.allow || G.opts.allow('possess'))) {
      if (B.inside === hit) return;
      if (K.objDist(hit, B.x, B.y) < 1.25 && !B.path.length) { G.act('possess', { obj: hit }); return; }
      const c = K.objCenter(hit);
      // ближайшая клетка прилипания у предмета
      let best = null, bd = 1e9;
      for (let y = hit.y - 1; y <= hit.y + hit.h; y++) for (let x = hit.x - 1; x <= hit.x + hit.w; x++) {
        if (!W.isCling(x, y)) continue;
        if (K.objDist(hit, x + 0.5, y + 0.5) > 1.1) continue;
        const d = Math.hypot(x + 0.5 - B.x, y + 0.5 - B.y);
        if (d < bd) { bd = d; best = { x, y }; }
      }
      if (best && B.moveTo(best.x + 0.5, best.y + 0.5)) { this.pendingObj = hit; G.emit('move'); return; }
    }
    if (B.moveTo(wx, wy)) { G.emit('move'); K.audio.sfx('squish'); }
  },
};
window.addEventListener('DOMContentLoaded', () => {
  const go = () => { app.init(); window.__ready = true; };
  if (document.fonts && document.fonts.ready) Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]).then(go); else go();
});
})();

</script>
