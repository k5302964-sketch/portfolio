:root{--s:1;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);--green:#5ad12e;--blue:#38aef5;--red:#ff3b3b;--ink:#141a28}
html{font-size:calc(var(--s)*1px);}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#8fd0ff;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{font-family:"Fredoka One","Arial Rounded MT Bold",system-ui,sans-serif;color:#fff}
#app{position:fixed;inset:0}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
#ui{position:absolute;inset:0;pointer-events:none;z-index:2}
#ui *{box-sizing:border-box}
.stroke{-webkit-text-stroke:calc(var(--sw,5)*1rem) var(--sc,#141a28);paint-order:stroke fill}
.btn{pointer-events:auto;cursor:pointer;border:none;outline:none;font-family:inherit;color:#fff;transition:transform .08s}
.btn:active{transform:scale(.94)}

#boot{position:fixed;inset:0;background:linear-gradient(#8fd0ff,#bfe8ff 60%,#7bd23f 60%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;transition:opacity .5s}
#boot.hide{opacity:0;pointer-events:none}
.boot-title{font-size:56rem;-webkit-text-stroke:9rem #141a28;paint-order:stroke fill;color:#ffd84a;letter-spacing:1rem}
.boot-sub{margin-top:6rem;font-size:17rem;-webkit-text-stroke:5rem #141a28;paint-order:stroke fill}
.boot-bar{margin-top:22rem;width:200rem;height:16rem;border-radius:9rem;background:#141a28;padding:3rem}
.boot-bar div{height:100%;width:10%;border-radius:6rem;background:linear-gradient(#8ff05a,#3fb02f);transition:width .2s}

.topbtns{position:absolute;left:calc(10rem + var(--safe-l));top:calc(8rem + var(--safe-t));display:flex;gap:10rem;pointer-events:auto}
.roundbtn{width:40rem;height:40rem;border-radius:50%;background:rgba(18,22,34,.62);display:flex;align-items:center;justify-content:center;font-size:20rem}
.roundbtn svg{width:22rem;height:22rem}

.objective{position:absolute;left:0;right:0;top:calc(52rem + var(--safe-t));text-align:center;font-size:26rem;--sw:6;white-space:nowrap;transition:transform .2s}
.objsub{position:absolute;left:0;right:0;top:calc(84rem + var(--safe-t));text-align:center;font-size:15rem;--sw:4;color:#bfe3ff;white-space:nowrap}
.objective.pulse{animation:pulse .5s}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}

.leftcol{position:absolute;left:calc(8rem + var(--safe-l));top:30%;display:flex;flex-direction:column;gap:9rem;align-items:flex-start}
.menubtn{position:relative;height:46rem;min-width:126rem;padding:0 14rem 0 8rem;border-radius:6rem;display:flex;align-items:center;gap:6rem;font-size:25rem;--sw:5;border:3.5rem solid #141a28;box-shadow:inset 0 -6rem 0 rgba(0,0,0,.18),inset 0 4rem 0 rgba(255,255,255,.35)}
.menubtn.shop{background:linear-gradient(#7fe84a,#3fbf22)}
.menubtn.index{background:linear-gradient(#5cc6ff,#1f8fe0)}
.menubtn img,.menubtn canvas{width:32rem;height:32rem}
.badge{position:absolute;right:-10rem;top:-12rem;min-width:24rem;height:24rem;border-radius:12rem;background:#ff2a2a;border:3rem solid #fff;font-size:14rem;display:flex;align-items:center;justify-content:center;padding:0 4rem;box-shadow:0 2rem 0 rgba(0,0,0,.3)}
.badge.hidden{display:none}
.slowmode{display:flex;align-items:center;gap:8rem;font-size:15rem;--sw:4;pointer-events:auto;cursor:pointer}
