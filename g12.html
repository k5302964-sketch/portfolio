/* ui.css — интерфейс из бумажек. --u — масштаб от базового экрана (1280×720 или 390 по ширине на телефоне). */
:root { --u: 1; --ink: #2a2030; --ink2: #6a5a50; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #1b2a28; overflow: hidden; font-family: Rubik, system-ui, sans-serif; color: var(--ink); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#grade { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse 78% 72% at 50% 48%, rgba(255,220,170,0) 55%, rgba(26,12,18,.5) 100%); }
#ui { position: fixed; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }
.paper { background-repeat: no-repeat; filter: drop-shadow(1px 3px 2px rgba(30,15,10,.45)) drop-shadow(0 6px 8px rgba(30,15,10,.22)); }
button { font: inherit; color: inherit; border: 0; background: transparent; cursor: pointer; }
.ic { width: calc(var(--u) * 20px); height: calc(var(--u) * 20px); vertical-align: middle; }

#lvl { position: absolute; left: calc(var(--u) * 18px); top: calc(var(--u) * 12px); padding: calc(var(--u) * 8px) calc(var(--u) * 16px); display: flex; flex-direction: column; transform: rotate(-1.5deg); }
#lvl .n { font-size: calc(var(--u) * 13px); font-weight: 600; color: var(--ink2); }
#lvl .nm { font-size: calc(var(--u) * 20px); font-weight: 800; }

#hud { position: absolute; left: 50%; top: calc(var(--u) * 10px); transform: translateX(-56%); display: flex; gap: calc(var(--u) * 14px); align-items: center; }
#hud .moves, #hud .tokens { display: flex; align-items: center; gap: calc(var(--u) * 10px); padding: calc(var(--u) * 8px) calc(var(--u) * 16px); height: calc(var(--u) * 52px); }
.ttl b, #title b, #panel .ttl b { display: inline-block; color: #fbf6ea; font-weight: 800; padding: 0 .16em; margin-right: .06em; border-radius: .12em; text-shadow: 0 1px 1px rgba(40,22,12,.35); box-shadow: 1px 2px 2px rgba(40,22,12,.35), 0 0 0 .07em #fbf7ee; }
.ttl i, #title i { display: inline-block; width: .35em; }
#hud .moves .ttl { font-size: calc(var(--u) * 24px); }
#hud .tabs { display: flex; gap: calc(var(--u) * 5px); }
#hud .tab { width: calc(var(--u) * 13px); height: calc(var(--u) * 30px); background: #e04a3a; border-radius: calc(var(--u) * 3px); box-shadow: 1px 2px 2px rgba(40,22,12,.35), 0 0 0 1.5px #fbf7ee; position: relative; transition: transform .25s, background .25s; }
#hud .tab.used { background: #d8cdb6; box-shadow: 0 0 0 1.5px #fbf7ee; transform: translateY(2px) rotate(-4deg); }
#hud .tab.used::after { content: ''; position: absolute; left: -35%; right: -35%; top: 44%; height: 22%; background: #8a6a4a; border-radius: 2px; transform: rotate(-58deg); box-shadow: 0 1px 1px rgba(40,22,12,.4), 0 0 0 1px #fbf7ee; }
#hud .lw { font-size: calc(var(--u) * 15px); font-weight: 600; color: var(--ink2); white-space: nowrap; }
#hud .lw b { font-size: calc(var(--u) * 26px); font-weight: 800; color: var(--ink); vertical-align: -2px; }
#hud .tokens .lb { font-size: calc(var(--u) * 19px); font-weight: 700; }
#hud .tokens .ic { width: calc(var(--u) * 30px); height: calc(var(--u) * 30px); }

.goal { position: absolute; transform: translate(-50%, 0) rotate(-2deg); padding: calc(var(--u) * 6px) calc(var(--u) * 14px); display: flex; align-items: baseline; gap: calc(var(--u) * 8px); white-space: nowrap; transition: transform .3s; }
.goal .lb { font-size: calc(var(--u) * 16px); font-weight: 600; color: var(--ink2); }
.goal .v { font-size: calc(var(--u) * 22px); font-weight: 800; }
.goal.ok .v { color: #3e8a48; }
.goal.miss .v { color: #c8302a; }
.goal.miss { animation: wob .5s 2; }
@keyframes wob { 50% { transform: translate(-50%, 0) rotate(3deg) scale(1.08); } }
#panel.on ~ #side, body:has(#panel.on) #side { visibility: hidden; }
#goalBird { transform: translate(-50%, 0) rotate(1.5deg); }

#side { position: absolute; width: calc(var(--u) * 252px); padding: calc(var(--u) * 14px) calc(var(--u) * 18px); transform: rotate(1deg); transition: opacity .2s; }
#side .hd { font-size: calc(var(--u) * 20px); font-weight: 800; margin-bottom: calc(var(--u) * 8px); }
#side .ft { font-size: calc(var(--u) * 13px); color: var(--ink2); font-weight: 600; margin-top: calc(var(--u) * 6px); }
#side .row { position: relative; display: flex; align-items: center; gap: calc(var(--u) * 10px); padding: calc(var(--u) * 6px) 0 calc(var(--u) * 10px); font-size: calc(var(--u) * 14px); font-weight: 600; color: var(--ink2); }
#side .row .ic { width: calc(var(--u) * 30px); height: calc(var(--u) * 30px); }
#side .row .ln { position: absolute; left: 0; right: 0; bottom: calc(var(--u) * 3px); height: calc(var(--u) * 5px); background: #e8dcc4; border-radius: 2px; box-shadow: 0 2px 2px rgba(60,40,20,.3); }
#side .row:nth-child(2) .ln { left: calc(var(--u) * 6px); background: #e2d4c0; }
#side .row:nth-child(3) .ln { left: calc(var(--u) * 12px); background: #d8cbc8; }
#side .row.can { color: var(--ink); font-weight: 800; }
#side .row.can::before { content: ''; position: absolute; left: calc(var(--u) * -12px); top: calc(var(--u) * 14px); border: calc(var(--u) * 6px) solid transparent; border-left-color: #e9a020; }
#side .row.hid .ic { opacity: .45; }
#side .row.cut .ic { opacity: .9; }
#side.idle .row .ln { display: none; }
#side.idle .row { padding: calc(var(--u) * 3px) 0; }
body.titling #hud, body.titling #lvl, body.titling #side, body.titling #btns, body.titling .goal { visibility: hidden; }
